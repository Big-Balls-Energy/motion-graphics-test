<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>

<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2;
const C={bg:'#0A0A0A',white:'#FAFAFA',violet:'#7C3AED',violetL:'#A78BFA',yellow:'#FACC15',green:'#22C55E',gray:'#525252',grayL:'#A3A3A3',panel:'#171717',edge:'#3F3F46'};
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const mini=document.createElement('canvas');mini.width=W;mini.height=H;const mctx=mini.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const bounceOut=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`};

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:4.5,tr:null,vis:'Celular con un Reel y el contador de vistas atorado en «200» parpadeando en gris. Un dedo hace swipe y el Reel se va. Cronómetro gigante «3 s» en amarillo (cifra sola 2 s). Chip: HOOK.'},
 {id:'promise',name:'PROMESA',a:4.5,b:8,tr:'wipe',vis:'El chip se ilumina y los puntos de la línea de tiempo se encienden; aparecen las 5 secciones; el ícono de «guardar» se rellena con rebote. Chip: PROMESA.'},
 {id:'v1',name:'VALOR 1 · HOOK',a:8,b:15,tr:'slide',vis:'«1» enorme; dos celulares: persona estática sin texto (gris, ✕) vs. texto grande y movimiento (verde, ✓). Flecha que señala al primer punto de la línea de tiempo (HOOK). Chip: VALOR.'},
 {id:'v2',name:'VALOR 2 · RETENCIÓN',a:15,b:22,tr:'zoom',vis:'«2»; curva de retención que cae en gris vs. curva que se mantiene alta en verde, con destellos en cada cambio.'},
 {id:'v3',name:'VALOR 3 · SUBTÍTULOS',a:22,b:27,tr:'spin',vis:'«3»; bocina tachada; los subtítulos del propio video se agrandan y brillan, con una flecha que los señala.'},
 {id:'v4',name:'VALOR 4 · QUE LO COMPARTAN',a:27,b:34,tr:'up',vis:'«4»; balanza: like (corazón) vs. envío (avión de papel); el envío pesa más → «3–5x» en amarillo (sola 2 s, *estimación de la industria).'},
 {id:'v5',name:'VALOR 5 · LOOP',a:34,b:40,tr:'zoom',vis:'«5»; flecha circular que une el último cuadro con el primero; contador de reproducciones 1 → 2 → 3. Chip: LOOP.'},
 {id:'gift',name:'REGALO',a:40,b:52,tr:'wipe',vis:'Caja de regalo que se abre y sale un mini-celular reproduciendo esta misma animación → «20» (sola 2 s) → tarjeta de requisitos punto por punto con contador 20 → 19 → 18. Chip: CTA.'},
 {id:'cta',name:'CTA FINAL',a:52,b:60,tr:'slide',vis:'Logo + «ATLAS PATH» + @Atlas_Path + botón SEGUIR con clic → regresa el celular del inicio con las vistas disparándose de «200» a «200K» (loop).'},
];
const SECTIONS=[{n:'HOOK',a:0},{n:'PROMESA',a:4.5},{n:'VALOR',a:8},{n:'LOOP',a:34},{n:'CTA',a:40}];
const SUBS_RAW=[
 [0.0,2.0,'¿Atorado en 200 vistas?',['200']],
 [4.5,6.0,'La fórmula viral:',['fórmula']],
 [6.0,7.5,'guarda este video.',['guarda']],
 [8.0,9.5,'Uno: el hook.',['hook']],
 [9.5,11.0,'Movimiento y texto',['movimiento']],
 [11.0,13.0,'desde el primer cuadro:',['primer']],
 [13.0,14.5,'ahí deciden quedarse.',['deciden']],
 [15.0,16.5,'Dos: la retención.',['retención']],
 [16.5,18.0,'Cada 3–5 segundos,',['3–5']],
 [18.0,19.75,'algo nuevo: una cifra,',['nuevo']],
 [19.75,21.5,'un cambio, una pregunta.',['pregunta']],
 [22.0,23.5,'Tres: los subtítulos.',['subtítulos']],
 [23.5,26.5,'La mayoría ve sin sonido.',['sonido']],
 [27.0,28.9,'Cuatro: que lo compartan.',['compartan']],
 [28.9,31.5,'Un envío por DM pesa…',['envío']],
 [34.0,35.5,'Cinco: el loop.',['loop']],
 [35.5,37.25,'un final que conecte',['final']],
 [37.25,39.5,'con el inicio.',['inicio']],
 [40.0,41.75,'Y ahora, el regalo:',['regalo']],
 [41.75,43.5,'los primeros 20 negocios',['20']],
 [45.5,48.0,'que nos sigan y comenten',['sigan']],
 [48.0,49.5,'«ANIMACIÓN» se llevan',['animación']],
 [49.5,51.5,'un video como este.',['video']],
 [52.0,53.75,'Síguenos en Atlas Path',['síguenos']],
 [53.75,55.25,'para más estrategias',['estrategias']],
 [55.25,57.5,'que hacen crecer tu negocio.',['crecer']],
];
const HOLDS=[{a:2.0,b:4.0,text:'3 s'},{a:31.5,b:33.5,text:'3–5x'},{a:43.5,b:45.5,text:'20'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const REQ=['Cuenta de negocio,\nempresa o creador','Seguir a @Atlas_Path','Comentar «ANIMACIÓN»','Solo los primeros 20'],REQT=[45.7,46.2,46.7,47.2];

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(1.2,'whoosh',.9,1.7);for(let i=0;i<4;i++)sfx(2.0+i*.5,'tictac',.8,i%2?.8:1);sfx(2.0,'ding',.8);
sfx(4.5,'whoosh');sfx(4.6,'shine',.6);for(let i=0;i<5;i++)sfx(4.7+i*.2,'pop',.4,1+i*.08);sfx(6.0,'pop');sfx(6.25,'pop',.5,1.3);
sfx(8.0,'whoosh');sfx(8.05,'pop',1,.8);sfx(8.6,'pop',.5);sfx(9.6,'pop',.5);sfx(10.2,'strike',.4);sfx(10.6,'ding',.6,1.3);sfx(11.6,'whoosh',.5,1.5);
sfx(15.0,'whoosh');sfx(15.05,'pop',1,.85);[19.0,19.6,20.2,20.8].forEach((x,i)=>sfx(x,'pop',.35,1.3+i*.05));
sfx(22.0,'whoosh');sfx(22.05,'pop',1,.9);sfx(22.6,'pop',.6);sfx(23.5,'shine',.7);
sfx(27.0,'whoosh');sfx(27.05,'pop',1,.95);sfx(29.2,'step',.8,.8);sfx(31.5,'ding');
sfx(34.0,'whoosh');sfx(34.05,'pop',1,1);sfx(35.5,'whoosh',.4,1.3);[37.3,38.1,38.9].forEach((x,i)=>sfx(x,'ding',.6,1+i*.12));
sfx(40.0,'whoosh');sfx(40.25,'gift');sfx(43.5,'ding',1,1.1);REQT.forEach(x=>sfx(x,'pop',.55,1.2));sfx(49.0,'tictac',.8);sfx(50.2,'tictac',.8);
sfx(52.0,'whoosh');sfx(52.15,'pop',.6);sfx(52.35,'pop',.6);sfx(52.6,'pop',.6);sfx(55.0,'click');sfx(55.02,'pop',.6,1.3);
sfx(57.6,'whoosh',.6);sfx(58.4,'whoosh',.5,1.5);sfx(59.3,'ding',1,1.3);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,sfx:SFX};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.white,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function person(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-s*3.1,s,0,TAU);ctx.fill();rr(x-s*1.15,y-s*1.9,s*2.3,s*1.9,[s*1.1,s*1.1,s*.25,s*.25]);ctx.fill()}
function sparkle(x,y,r,col){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fillStyle=col;ctx.fill()}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cross(x,y,s,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y+s);ctx.moveTo(x+s,y-s);ctx.lineTo(x-s,y+s);ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
// íconos genéricos
function heartP(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.closePath()}
function planeP(x,y,s){ctx.beginPath();ctx.moveTo(x-s,y-s*.05);ctx.lineTo(x+s,y-s*.85);ctx.lineTo(x+s*.25,y+s*.9);ctx.lineTo(x-s*.05,y+s*.15);ctx.closePath()}
function bookP(x,y,s){ctx.beginPath();ctx.moveTo(x-s*.62,y-s);ctx.lineTo(x+s*.62,y-s);ctx.lineTo(x+s*.62,y+s);ctx.lineTo(x,y+s*.5);ctx.lineTo(x-s*.62,y+s);ctx.closePath()}
function bubbleP(x,y,s){ctx.beginPath();ctx.ellipse(x,y-s*.08,s,s*.82,0,Math.PI*.62,Math.PI*2.5);ctx.lineTo(x-s*.85,y+s*.95);ctx.closePath()}
function icon(kind,x,y,s,stroke,fill,lw){({heart:heartP,plane:planeP,book:bookP,bubble:bubbleP})[kind](x,y,s);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||s*.16;ctx.lineJoin='round';ctx.stroke()}}
function eye(x,y,s,col){ctx.beginPath();ctx.moveTo(x-s,y);ctx.quadraticCurveTo(x,y-s*.9,x+s,y);ctx.quadraticCurveTo(x,y+s*.9,x-s,y);ctx.strokeStyle=col;ctx.lineWidth=s*.18;ctx.stroke();circle(x,y,s*.3,col)}
function phone(cx,cy,w,h,screen){
 ctx.save();ctx.translate(cx,cy);rr(-w/2-12,-h/2-12,w+24,h+24,w*.15);ctx.fillStyle='#1C1C1E';ctx.fill();ctx.strokeStyle=C.edge;ctx.lineWidth=4;ctx.stroke();
 rr(-w/2,-h/2,w,h,w*.11);ctx.save();ctx.clip();ctx.translate(-w/2,-h/2);screen(w,h);ctx.restore();
 rr(-w*.16,-h/2+12,w*.32,20,10);ctx.fillStyle='#000';ctx.fill();ctx.restore();
}
function reelScreen(w,h,t,o={}){
 const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,o.c1||'#3B1D7A');g.addColorStop(1,o.c2||'#111');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 const sh=Math.sin(t*1.7)*w*.05;circle(w*.7+sh,h*.3,w*.32,'rgba(250,250,250,.06)');circle(w*.2-sh,h*.62,w*.22,'rgba(124,58,237,.18)');
 person(w*.45,h*.86,w*.13,o.person||'rgba(250,250,250,.85)');
 const ix=w-w*.12;[['heart',.52],['bubble',.62],['plane',.72],['book',.82]].forEach(([k,f])=>icon(k,ix,h*f,w*.045,'#fff',null,w*.012));
 ctx.fillStyle='rgba(250,250,250,.6)';rr(w*.06,h*.9,w*.5,h*.015,4);ctx.fill();rr(w*.06,h*.93,w*.34,h*.013,4);ctx.fill();
 if(o.views){const blink=o.blink?(Math.sin(t*9)>0?1:.35):1;ctx.save();ctx.globalAlpha*=blink;rr(w*.06,h*.05,w*.6,h*.09,h*.045);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fill();
  eye(w*.16,h*.095,w*.055,o.vcol||C.grayL);text(o.views,w*.25,h*.097,w*.11,'MBlack',o.vcol||C.grayL,'left');ctx.restore()}
}

/* ================= FONDO / HUD / SUBTÍTULOS ================= */
function bg(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.save();
 const g=ctx.createRadialGradient(250+Math.sin(t*.25)*40,700,0,250,700,640);g.addColorStop(0,'rgba(124,58,237,.16)');g.addColorStop(1,'rgba(124,58,237,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const g2=ctx.createRadialGradient(900,1500,0,900,1500,560);g2.addColorStop(0,'rgba(250,204,21,.05)');g2.addColorStop(1,'rgba(250,204,21,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(250,250,250,.035)';for(let y=40;y<H;y+=60)for(let x=30;x<W;x+=60)ctx.fillRect(x,y,3,3);ctx.restore()}
const sectionAt=t=>SECTIONS.reduce((s,x,i)=>t>=x.a?i:s,0);
const TLX0=40,TLX1=940,TLY=272,tlx=tt=>lerp(TLX0,TLX1,tt/DUR);
function hud(t){
 ctx.fillStyle='rgba(250,250,250,.1)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.violet;ctx.fillRect(0,0,W*clamp(t/DUR),10);
 // línea de tiempo con los puntos de cada sección
 const lit=t>=4.6&&t<7.5;
 ctx.fillStyle='rgba(250,250,250,.14)';rr(TLX0,TLY-3,TLX1-TLX0,6,3);ctx.fill();ctx.fillStyle=C.violet;rr(TLX0,TLY-3,tlx(t)-TLX0,6,3);ctx.fill();
 for(const v of[15,22,27])circle(tlx(v),TLY,4,t>=v?C.violetL:'rgba(250,250,250,.3)');
 SECTIONS.forEach((s,i)=>{const x=tlx(s.a),on=t>=s.a,pk=lit?pop(t,4.7+i*.2,.35):1,pulse=lit?1+.35*Math.sin(clamp((t-4.7-i*.2)/.5)*Math.PI):1;
  ctx.save();ctx.translate(x,TLY);ctx.scale(pulse,pulse);circle(0,0,11,on?C.violet:C.bg);ctx.strokeStyle=on?C.violetL:'rgba(250,250,250,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.stroke();ctx.restore();
  });
 const px=tlx(t);circle(px,TLY,7,'#fff');
 // logo
 rr(40,302,128,128,24);ctx.fillStyle='rgba(250,250,250,.96)';ctx.fill();
 if(logo.complete&&logo.naturalWidth){const h=110,w=h*logo.naturalWidth/logo.naturalHeight;ctx.drawImage(logo,104-w/2,311,w,h)}
 // chip de sección
 const si=sectionAt(t),s=SECTIONS[si],kc=si?pop(t,s.a,.35):1,glow=lit?(.5+.5*Math.sin(t*10)):0;
 ctx.font='32px MBlack';const tw=ctx.measureText(s.n).width,cw=tw+86;
 ctx.save();ctx.translate(186,366);ctx.scale(kc,kc);
 if(glow>0){ctx.shadowColor=C.violetL;ctx.shadowBlur=30+30*glow}
 rr(0,-32,cw,64,32);ctx.fillStyle=C.violet;ctx.fill();ctx.shadowBlur=0;circle(32,0,9,Math.sin(t*6)>0?C.yellow:'rgba(250,204,21,.4)');text(s.n,52,2,32,'MBlack','#fff','left');ctx.restore();
}
let subsBoost=0;
const SUB_FS=60,SUB_Y=1400,SUB_MAXW=800;
function subs(t){
 const s=SUBS.find(s=>t>=s.a&&t<s.b);if(!s)return;
 ctx.font=`${SUB_FS}px MXB`;const sp=ctx.measureText(' ').width;
 const lines=[];let cur=[],cw=0;
 for(const w of s.words){const ww=ctx.measureText(w.w).width;if(cur.length&&cw+sp+ww>SUB_MAXW){lines.push({ws:cur,w:cw});cur=[];cw=0}cur.push({...w,ww});cw+=(cur.length>1?sp:0)+ww}
 lines.push({ws:cur,w:cw});
 const lh=SUB_FS*1.25,pad=34,pv=20,bw=Math.max(...lines.map(l=>l.w))+pad*2,bh=lines.length*lh+pv*2;
 const kin=eo(p(t,s.a,s.a+.18)),kout=1-p(t,s.b-.12,s.b);
 ctx.save();ctx.translate(CX,SUB_Y);const sc=(.92+.08*kin)*(1+.16*subsBoost);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(kin,kout);
 if(subsBoost>0){ctx.shadowColor=C.yellow;ctx.shadowBlur=50*subsBoost}
 rr(-bw/2,-bh/2,bw,bh,26);ctx.fillStyle='rgba(10,10,10,.86)';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=subsBoost>0?`rgba(250,204,21,${.3+.7*subsBoost})`:'rgba(250,250,250,.14)';ctx.lineWidth=subsBoost>0?5:2;ctx.stroke();
 ctx.textBaseline='middle';ctx.textAlign='left';
 lines.forEach((l,li)=>{let x=-l.w/2;const y=-bh/2+pv+lh*(li+.5);
  l.ws.forEach(w=>{const reached=t>=w.t0;ctx.fillStyle=reached?(w.key?C.yellow:'#fff'):'rgba(255,255,255,.42)';
   const bump=reached?1+.1*(1-eo(p(t,w.t0,w.t0+.28))):1;
   ctx.save();ctx.translate(x+w.ww/2,y);ctx.scale(bump,bump);ctx.fillText(w.w,-w.ww/2,0);ctx.restore();x+=w.ww+sp})});
 ctx.restore();
}
const holdK=(t,h)=>Math.min(eo(p(t,h.a,h.a+.25)),1-p(t,h.b,h.b+.2));
function bigNum(t,n,t0){ // número de cada valor: entra enorme y se queda como insignia
 const k=pop(t,t0,.4),m=eio(p(t,t0+.9,t0+1.4));if(k<=0)return;
 ctx.save();ctx.translate(lerp(CX,150,m),lerp(840,530,m));ctx.scale(k*lerp(1,.3,m),k*lerp(1,.3,m));
 ctx.shadowColor=C.violet;ctx.shadowBlur=60;text(String(n),0,0,420,'MBlack',C.violet);ctx.shadowBlur=0;text(String(n),0,0,420,'MBlack',C.white);ctx.restore();
}

/* ================= 1 · HOOK ================= */

window.ready=Promise.all([document.fonts.load('100px MBlack'),document.fonts.load('100px MXB'),document.fonts.load('100px MSemi'),
 new Promise(r=>{if(logo.complete)r();else{logo.onload=r;logo.onerror=r}})]);
const RENDER=new URLSearchParams(location.search).has('render');
const ui=document.getElementById('ui'),aud=document.getElementById('aud');
if(RENDER){ui.classList.add('hide');document.body.style.background=C.bg}
else{
 let playing=false,t0=0,useAudio=true;
 aud.addEventListener('error',()=>useAudio=false);
 const now=()=>useAudio&&!isNaN(aud.duration)?aud.currentTime:(performance.now()-t0)/1000;
 function loop(){if(!playing)return;let t=now();if(t>=DUR){if(useAudio){aud.currentTime=0;aud.play()}else t0=performance.now();t=0}renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)}
 function start(){ui.classList.add('hide');playing=true;t0=performance.now();aud.currentTime=0;aud.play().catch(()=>useAudio=false);loop()}
 ui.addEventListener('click',start);
 addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
</script>
</body>
</html>
