}

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.white,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();

 ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetX=6;ctx.shadowOffsetY=8;rr(-w/2,-size*.85,w,size*1.7,size*.85);ctx.fillStyle=col;ctx.fill();ctx.shadowColor='transparent';

 ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=22;ctx.shadowOffsetX=8;ctx.shadowOffsetY=12;rr(-w/2,-56,w,112,20);ctx.fillStyle=bgc;ctx.fill();ctx.shadowColor='transparent';

const BGC={},BW=1296,BH=2304;
function illus(name,c){ // sustitutos gráficos para fondos que faltan
 const w=BW,h=BH;let g;
 if(name==='G09_cdmx_reforma'){g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1b2a4a');g.addColorStop(.5,'#c2703d');g.addColorStop(.62,'#f2b36b');g.addColorStop(1,'#1a1410');c.fillStyle=g;c.fillRect(0,0,w,h);

  c.fillStyle='#0c0a0b';c.fillRect(w*.47,h*.22,w*.06,h*.5);c.fillRect(w*.43,h*.68,w*.14,h*.05);c.beginPath();c.arc(w*.5,h*.2,46,0,TAU);c.fill();c.fillStyle='#d4a017';c.beginPath();c.moveTo(w*.5,h*.16);c.lineTo(w*.46,h*.2);c.lineTo(w*.54,h*.2);c.closePath();c.fill();

 if(name==='G15_escucha_conversacion'){g=c.createRadialGradient(w*.5,h*.45,50,w*.5,h*.45,h*.7);g.addColorStop(0,'#3b3a2c');g.addColorStop(1,'#0e0f0c');c.fillStyle=g;c.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){c.fillStyle=`rgba(${200+rnd(i)*55|0},${200+rnd(i*2)*40|0},140,${.15+rnd(i*3)*.3})`;c.beginPath();c.arc(rnd(i*7)*w,rnd(i*9)*h*.6,30+rnd(i*5)*70,0,TAU);c.fill()}
  c.fillStyle='#14120f';for(const[x,s]of[[w*.3,1],[w*.72,-1]]){c.beginPath();c.arc(x,h*.48,120,0,TAU);c.fill();c.beginPath();c.ellipse(x,h*.72,260,300,0,0,TAU);c.fill()}}
 c.fillStyle='rgba(0,0,0,.12)';c.fillRect(0,0,w,h)}

 c.filter=`${GRADE} blur(${name==='G12_cartel_espectacular'?10:8}px) brightness(.42)`;c.drawImage(src,clamp((BW-dw)*f.fx,BW-dw,0),clamp((BH-dh)*f.fy,BH-dh,0),dw,dh);c.filter='none';
 const g=c.createRadialGradient(BW/2,BH*.45,BH*.25,BW/2,BH*.45,BH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=g;c.fillRect(0,0,BW,BH);BGC[name]=o}
function fondo(name,t,{z=1,ox=0,oy=0,alpha=1,gray=0}={}){const o=BGC[name];if(!o)return;ctx.save();ctx.globalAlpha*=alpha;if(gray)ctx.filter=`grayscale(${gray})`;ctx.translate(W/2+ox,H/2+oy);ctx.scale(z,z);ctx.drawImage(o,-BW/2,-BH/2);ctx.restore()}
