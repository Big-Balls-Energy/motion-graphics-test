const POOL={};
function pool(k){return POOL[k]||(POOL[k]=document.createElement('canvas'))}
function cutRatio(name){const im=IMG[name];return loaded(im)?im.naturalHeight/im.naturalWidth:RECORTES[name]}

 const im=IMG[name],h=Math.round(w*cutRatio(name));w=Math.round(w);const o=pool(name);o.width=w;o.height=h;const c=o.getContext('2d');
 if(loaded(im)){c.filter=GRADE+(P.gray?` grayscale(${P.gray}) brightness(${1-.25*P.gray})`:'');c.drawImage(im,0,0,w,h);c.filter='none'}
 else{c.fillStyle='#3a3f4a';c.beginPath();c.roundRect(0,0,w,h,16);c.fill();c.setLineDash([12,8]);c.strokeStyle='#cbd5e1';c.lineWidth=3;c.stroke();c.fillStyle='#fff';c.font=`${Math.max(16,w*.05)}px JBM`;c.textAlign='center';c.fillText(name+'.png',w/2,h/2)}
 c.globalCompositeOperation='source-atop';coolTint(c,w,h,.55);
 let g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,240,220,.12)');g.addColorStop(.4,'rgba(255,240,220,0)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');c.fillStyle=g;c.fillRect(0,0,w,h);

 c.globalCompositeOperation='destination-in';if(loaded(im))c.drawImage(im,0,0,w,h);c.globalCompositeOperation='source-over';
 if(P.fade){c.globalCompositeOperation='destination-out';g=c.createLinearGradient(0,h*(1-P.fade),0,h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');c.fillStyle=g;c.fillRect(0,h*(1-P.fade),w,h*P.fade);c.globalCompositeOperation='source-over'}
 return o}

function drawCut(name,P){

 ctx.save();ctx.globalAlpha*=P.alpha??1;

 if(P.glow){ctx.shadowColor=rimCol;ctx.shadowBlur=50*P.glow}else{ctx.shadowColor=rgba(rimCol,.4*(P.rim??1));ctx.shadowBlur=22;ctx.shadowOffsetX=5}

function cutMB(name,pose,t,n=5,dt=.012){const a=pose(t),b=pose(t-dt*2),v=Math.hypot(a.x-b.x,a.y-b.y)+Math.abs((a.rot||0)-(b.rot||0))*300;

const _v=new THREE.Vector3(),_w=new THREE.Vector3();
function proj(v,cam){_v.copy(v).project(cam);return{x:(_v.x*.5+.5)*W,y:(-_v.y*.5+.5)*H,z:_v.z}}
function projObj(o,cam){o.updateWorldMatrix(true,false);o.getWorldPosition(_w);return proj(_w,cam)}
function screenTo(cam,sx,sy,dist){cam.updateMatrixWorld();_v.set(sx/W*2-1,-(sy/H*2-1),.5).unproject(cam).sub(cam.position).normalize();return cam.position.clone().add(_v.multiplyScalar(dist))}

function ribbon(curve,width,segs,mat){
 const pts=curve.getSpacedPoints(segs),pos=[],uv=[],idx=[],L=curve.getLength(),up=new THREE.Vector3(0,1,0);
 for(let i=0;i<=segs;i++){const T=curve.getTangentAt(i/segs),lat=new THREE.Vector3().crossVectors(T,up).normalize(),P=pts[i];
  pos.push(P.x-lat.x*width/2,P.y-lat.y*width/2,P.z-lat.z*width/2,P.x+lat.x*width/2,P.y+lat.y*width/2,P.z+lat.z*width/2);const u=i/segs*L/2;uv.push(u,0,u,1);
  if(i<segs){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);geo.computeVertexNormals();
 return new THREE.Mesh(geo,mat)}
function offsetCurve(curve,off,n=200){const up=new THREE.Vector3(0,1,0),pts=[];for(let i=0;i<=n;i++){const T=curve.getTangentAt(i/n),lat=new THREE.Vector3().crossVectors(T,up).normalize();pts.push(curve.getPointAt(i/n).add(lat.multiplyScalar(off)))}return new THREE.CatmullRomCurve3(pts)}
function frameAt(curve,u){const P=curve.getPointAt(clamp(u,0,1)),T=curve.getTangentAt(clamp(u,0,1)),lat=new THREE.Vector3().crossVectors(T,new THREE.Vector3(0,1,0)).normalize(),N=new THREE.Vector3().crossVectors(lat,T).normalize();return{P,T,lat,N}}
