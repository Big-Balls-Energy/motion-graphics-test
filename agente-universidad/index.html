/* Edición del video «Agente IA para una universidad» (Atlas Path) con motion graphics.
   El video fuente se preprocesa con tools/preprocesar.py (cuadros en src/, matte de la persona en mat/) y tools/plan.py
   (ritmo, encuadre y subtítulos en tools/plan.js). renderFrame(t) es determinista: el mismo segundo siempre da el mismo cuadro. */
'use strict';
const W=1080,H=1920,FPS=30,P=window.PLAN,DUR=P.dur;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ================= BLOQUE EDITABLE ================= */
// colores de marca: azul Atlas Path, amarillo para resaltar, verde para lo resuelto y rojo para el problema
const C={navy:'#0B1630',ink:'#0F172A',blue:'#2F6FED',sky:'#8DB8FF',yellow:'#FFD43B',green:'#22C55E',red:'#EF4444',white:'#FFFFFF',grey:'#94A3B8',soft:'#E8EEF8'};
const GRADE='contrast(1.07) saturate(1.12) brightness(1.01)';
const T={
 hook:['¿PIERDES','VENTAS?'],
 notifs:[['MR','María R.','Hola, ¿precio?'],['JP','Juan P.','¿Tienen disponibilidad?'],['AL','Ana L.','Quiero información'],['CS','Carlos S.','¿Siguen atendiendo?'],['LV','Laura V.','¿Me pasan detalles?']],
 sinResp:'Sin responder',seguim:'Seguimiento pendiente',ventas:'VENTAS',
 tareas:[['💬','Contestar preguntas'],['📋','Recopilar datos'],['📨','Mandar información'],['📅','Agendar citas']],
 extra:['Inventario','Pagos','Redes sociales','Proveedores','Facturas','Llamadas','Pedidos','Reportes'],
 saturado:'SATURADO',
 agente:['AGENTE','IA'],marca:['ATLAS PATH','Automatización con IA'],
 hechos:['Preguntas','Datos','Información','Citas'],
 caso:['CASO REAL','UNIVERSIDAD'],
 chat:{nombre:'Agente IA',estado:'en línea'},
 db:{titulo:'BASE DE DATOS',filas:[['Nombre','••••• ••••••'],['Carrera','Ingeniería'],['Teléfono','••• ••• ••••']],ok:'Registro guardado'},
 cita:{titulo:'VISITA AGENDADA',dia:'Jueves',hora:'10:00 a. m.',lugar:'Recorrido por el campus'},
 crm:{titulo:'SISTEMA · EQUIPO COMERCIAL',cols:['Nuevos','Interesados','Visita agendada'],lead:'Prospecto · Ingeniería',ok:'Información organizada'},
 lista:{titulo:'TU AGENTE IA:',items:['Conversa con prospectos','Identifica su interés','Resuelve dudas','Comparte planes de estudio','Registra sus datos','Agenda visitas','Actualiza el sistema']},
 repetitivas:'TAREAS REPETITIVAS',importante:['LO MÁS','IMPORTANTE'],cerrada:['VENTA','CERRADA'],
 como:['¿CÓMO LO','HACEMOS?'],clic:'TE EXPLICAMOS A DETALLE',
 marcaCTA:'ATLAS PATH',servicios:'MARKETING · WEB · TECNOLOGÍA',usuario:'@Atlas_Path',dm:'ESCRÍBENOS',seguir:'SEGUIR',siguiendo:'SIGUIENDO'
};

/* ================= UTILIDADES ================= */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),p=(t,a,b)=>clamp((t-a)/(b-a),0,1),lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-k,3),eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const back=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const ws=i=>P.words[i].a,we=i=>P.words[i].b;
function vis(t,a,b,fi=.22,fo=.22){if(t<a||t>b)return 0;return Math.min(eo(p(t,a,a+fi)),1-eio(p(t,b-fo,b)))}
function rnd(s){const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const EMO='"Noto Color Emoji"';
function font(sz,f='MB'){return `${sz}px ${f}, ${EMO}`}
function tw(s,sz,f='MB'){ctx.font=font(sz,f);return ctx.measureText(s).width}
function txt(s,x,y,sz,f,col,al='left',{stroke=0,sc=C.navy,alpha=1,shadow=0}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(sz,f);ctx.textAlign=al;ctx.textBaseline='middle';
 if(shadow){ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=shadow;ctx.shadowOffsetY=shadow/3}
 if(stroke){ctx.lineJoin='round';ctx.lineWidth=stroke;ctx.strokeStyle=sc;ctx.strokeText(s,x,y)}ctx.shadowColor='transparent';ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore()}
function emoji(e,x,y,sz,alpha=1,rot=0){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${sz}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore()}
function card(x,y,w,h,{r=26,fill='#fff',sh=.32,stroke=null,lw=3}={}){ctx.save();ctx.shadowColor=`rgba(0,0,0,${sh})`;ctx.shadowBlur=36;ctx.shadowOffsetY=12;rr(ctx,x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.restore();
 if(stroke){ctx.save();rr(ctx,x,y,w,h,r);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();ctx.restore()}}
// entrada con rebote alrededor de un punto: escala y opacidad
function popIn(t,t0,cx,cy,{dur=.32,out=null,outDur=.22,from=.55}={}){const k=p(t,t0,t0+dur);if(k<=0)return false;let s=lerp(from,1,back(k)),a=eo(Math.min(1,k*1.6));
 if(out!==null&&t>out){const o=p(t,out,out+outDur);if(o>=1)return false;s*=1-.25*eio(o);a*=1-eio(o)}
 ctx.save();ctx.globalAlpha*=a;ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);return true}
function check(x,y,r,col=C.green,k=1){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=r*.28;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();const pts=[[-.45,.02],[-.12,.36],[.5,-.32]];ctx.moveTo(x+pts[0][0]*r,y+pts[0][1]*r);const k1=Math.min(1,k*2),k2=clamp(k*2-1,0,1);
 ctx.lineTo(x+lerp(pts[0][0],pts[1][0],k1)*r,y+lerp(pts[0][1],pts[1][1],k1)*r);if(k2>0)ctx.lineTo(x+lerp(pts[1][0],pts[2][0],k2)*r,y+lerp(pts[1][1],pts[2][1],k2)*r);ctx.stroke();ctx.restore()}

/* ================= TIEMPOS (anclados a las palabras: si cambia el ritmo, todo se mueve con la voz) ================= */
const cutNear=x=>{let b=x,d=.45;for(const c of P.cuts)if(Math.abs(c-x)<d){d=Math.abs(c-x);b=c}return b};
const TR=[cutNear(ws(25)),cutNear(ws(51)),cutNear(ws(70)),cutNear(ws(128)),cutNear(ws(153))];   // transiciones entre secciones
const EMPH=[2,8,14,22,26,52,59,73,113,138,145,151,158,177];                                         // golpes de zoom en palabras fuertes
const S={hookEnd:ws(7)+.05,notif:[ws(7),ws(8)+.1,ws(11),ws(12),ws(12)+.18],sinResp:ws(14),seguim:ws(16),venta:ws(20),aEnd:TR[0],
 tareas:[ws(29),ws(31),ws(33),ws(35)],caos:ws(39),bEnd:TR[1],marca:ws(52),agente:ws(59),hechos:ws(66),cEnd:TR[2],
 caso:ws(70),casoEnd:ws(80),phone:ws(76)-.1,phoneEnd:we(113)+.35,
 chat:[[ws(77),'in','Hola 👋 quiero información'],[ws(80),'out','¡Hola! ¿Qué carrera te interesa? 🎓'],[ws(82)+.1,'in','Ingeniería'],
  [ws(85),'in','Tengo una duda 🙋'],[ws(86)+.12,'out','¡Claro! Te ayudo con gusto'],[ws(87)+.05,'pdf','Plan de estudios.pdf'],
  [ws(104),'in','¿Puedo visitar el campus? 🏫'],[ws(111),'cal','Visita al campus · Jue 10:00']],
 db:ws(92),dbOk:we(99)-.1,dbEnd:we(99)+.5,cita:ws(111),citaEnd:we(113)+.45,crm:ws(115),crmMove:ws(117),crmTeam:ws(121),crmOk:ws(127),crmEnd:TR[3]-.05,
 lista:ws(128),listaEnd:we(138)+.15,rep:ws(137),repStrike:we(138)-.12,repEnd:ws(140)+.1,imp:ws(142),impEnd:we(145)+.55,
 cerrada:ws(151),cerradaEnd:ws(153)+.1,como:ws(153),comoEnd:we(158)+.25,clic:ws(159),clicEnd:we(163)+.35,
 cta:ws(170),dm:ws(177),cursor:ws(178),click:ws(180),siguiendo:ws(180)+.12,loop:DUR-.5};

/* ================= VIDEO: cámara, recorte de la persona y transiciones ================= */
const IMG={},MAT={};
const pad=n=>String(n).padStart(5,'0');
function loadImg(map,key,url){if(map[key])return map[key].ready;const im=new Image();const ready=new Promise(r=>{im.onload=r;im.onerror=r});im.src=url;map[key]={im,ready};
 const ks=Object.keys(map);if(ks.length>24)delete map[ks[0]];return ready}
const fIndex=t=>clamp(Math.round(t*FPS),0,P.n-1);
function shake(t){const a=.0+14*vis(t,S.caos,S.bEnd,.6,.12);return a?[a*(rnd(Math.floor(t*30))-.5),a*(rnd(Math.floor(t*30)+.5)-.5)]:[0,0]}
function bump(t){let z=0;for(const i of EMPH){const a=ws(i);if(t>a-.05&&t<a+.7)z+=.045*(t<a+.1?eo(p(t,a-.05,a+.1)):1-eio(p(t,a+.1,a+.7)))}
 for(const T0 of TR)if(Math.abs(t-T0)<.13)z+=.13*Math.pow(1-Math.abs(t-T0)/.13,2);return z}
function cam(t){const k=fIndex(t),[fi,s,cx,cy]=P.frames[k],[dx,dy]=shake(t);return {k,fi,s,cx:cx-dx/s,cy:cy-dy/s,z:1+bump(t)}}
function drawSrc(c,im,m,filter){c.save();c.translate(540,760);c.scale(m.z,m.z);c.translate(-540,-760);c.translate(540,960);c.scale(m.s,m.s);c.translate(-m.cx,-m.cy);
 if(filter)c.filter=filter;c.drawImage(im,0,0,1080,1920);c.restore()}
const PC=mk(W,H),pctx=PC.getContext('2d');
function person(m,im,mt){pctx.clearRect(0,0,W,H);drawSrc(pctx,im,m,GRADE);pctx.globalCompositeOperation='destination-in';drawSrc(pctx,mt,m,null);pctx.globalCompositeOperation='source-over';ctx.drawImage(PC,0,0)}
function face(t){const f=P.faces[fIndex(t)],z=1+bump(t);const x=(f[0]-540)*z+540,y=(f[1]-760)*z+760;return {x,y,w:f[2]*z,h:f[3]*z,cx:x+f[2]*z/2,cy:y+f[3]*z/2,top:y-f[3]*z*.32}}
function vignette(){const g=ctx.createRadialGradient(540,860,500,540,860,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.30)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

/* ================= GRÁFICOS DETRÁS DE LA PERSONA ================= */
function headTop(t){const z=1+bump(t);return (P.htop[fIndex(t)]-760)*z+760}
// solo la parte baja de las letras queda detrás de la cabeza: el título se lee y a la vez se ve en profundidad
function bigBehind(lines,t,a,b,{col=C.white,size=[90,180],glow=null}={}){const k=vis(t,a,b,.18,.25);if(!k)return false;
 const L2=lines[lines.length-1],fs2=Math.min(size[1],90000/tw(L2,100)),fs1=lines.length>1?Math.min(size[0],86000/tw(lines[0],100)):0;
 let yB=headTop(t)-.15*fs2;const minY=300+(fs1?fs1*.35+fs1*.5+16:0)+fs2*.35;yB=Math.max(yB,minY);const y1=yB-fs2*.35-fs1*.5-16;
 const z=lerp(1.22,1,eo(p(t,a,a+.3)))*(1+.015*Math.sin((t-a)*3));ctx.save();ctx.globalAlpha=k;ctx.translate(540,yB);ctx.scale(z,z);ctx.translate(-540,-yB);
 if(fs1)txt(lines[0],540,y1,fs1,'MB',C.white,'center',{stroke:11,shadow:18});
 if(glow){ctx.save();ctx.shadowColor=glow;ctx.shadowBlur=50;txt(L2,540,yB,fs2,'MB',col,'center');ctx.restore()}
 txt(L2,540,yB,fs2,'MB',col,'center',{stroke:13,shadow:22});ctx.restore();return true}
function behind(t){let any=false;
 any=bigBehind(T.hook,t,-1,S.hookEnd,{col:C.yellow})||any;
 any=bigBehind([T.agente.join(' ')],t,S.agente,S.cEnd-.05,{col:C.sky,glow:'rgba(47,111,237,.9)',size:[0,170]})||any;
 any=bigBehind(T.importante,t,S.imp,S.impEnd,{col:C.yellow,size:[96,170]})||any;
 return any}
function behindActive(t){return t<S.hookEnd||(t>S.agente&&t<S.cEnd)||(t>S.imp&&t<S.impEnd)}

/* ================= GRÁFICOS AL FRENTE ================= */
// --- gancho: mensajes que se acumulan, sin responder, y las ventas que caen ---
function appIcon(x,y,s,n=0){ctx.save();const g=ctx.createLinearGradient(x,y,x+s,y+s);g.addColorStop(0,'#4F8BFF');g.addColorStop(1,'#2149C9');rr(ctx,x,y,s,s,s*.26);ctx.fillStyle=g;ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+s*.5,y+s*.47,s*.27,s*.21,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x+s*.36,y+s*.6);ctx.lineTo(x+s*.3,y+s*.76);ctx.lineTo(x+s*.48,y+s*.64);ctx.fill();
 if(n){const r=s*.26,bx=x+s-r*.55,by=y+r*.45,lab=n>=99?'99+':String(n);ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fillStyle=C.red;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  txt(lab,bx,by+1,r*(lab.length>2?.78:1.05),'MB','#fff','center')}ctx.restore()}
function notif(t,i,x,y){const t0=S.notif[i];const out=S.venta+.12+i*.06;if(!popIn(t,t0,x+170,y+52,{out,outDur:.35}))return;const w=340,h=104;
 const grey=p(t,S.sinResp+i*.09,S.sinResp+i*.09+.2);card(x,y,w,h,{fill:grey>0?`rgba(${lerp(255,236,grey)},${lerp(255,239,grey)},${lerp(255,244,grey)},.97)`:'rgba(255,255,255,.97)'});
 appIcon(x+14,y+18,66);const [ini,nom,msg]=T.notifs[i];txt(nom,x+94,y+36,25,'MS',C.ink);txt('ahora',x+w-16,y+34,18,'MM',C.grey,'right');
 ctx.font=font(22,'MM');let m=msg;while(ctx.measureText(m).width>w-110&&m.length>4)m=m.slice(0,-2)+'…';txt(m,x+94,y+70,22,'MM',grey>0?'#7A8699':'#334155');
 if(t>S.sinResp+i*.09){const k=back(p(t,S.sinResp+i*.09,S.sinResp+i*.09+.3));ctx.save();ctx.translate(x+w-18,y+h);ctx.scale(k,k);const lab=(i===1||i===3)&&t>S.seguim+(i===3?.12:0)?T.seguim:T.sinResp,red=lab===T.seguim;
  ctx.font=font(19,'MS');const lw=ctx.measureText(lab).width+46;rr(ctx,-lw,-17,lw,34,17);ctx.fillStyle=red?C.red:'#64748B';ctx.fill();emoji(red?'⚠️':'🕒',-lw+19,0,18);txt(lab,-lw+34,1,19,'MS','#fff');ctx.restore()}
 ctx.restore();if(t>S.venta+.12+i*.06){}}
function badgeTile(t){const a=ws(11)-.1;if(!popIn(t,a,880,350,{out:S.venta+.1}))return;card(820,292,120,120,{r:30,fill:'rgba(255,255,255,.96)'});
 const n=Math.round(lerp(3,99,eio(p(t,a+.1,we(12)))));appIcon(836,308,88,n);ctx.restore()}
function ventasCard(t){const a=S.venta;if(!popIn(t,a,760,400,{out:S.aEnd-.05,outDur:.15}))return;const x=560,y=280,w=400,h=240;card(x,y,w,h,{fill:'rgba(255,255,255,.97)'});
 txt(T.ventas,x+28,y+42,30,'MB',C.ink);emoji('📉',x+w-44,y+42,36);const k=eo(p(t,a+.1,a+1.1)),pts=[[0,.18],[.18,.3],[.34,.22],[.5,.5],[.66,.44],[.82,.74],[1,.92]];
 ctx.save();ctx.beginPath();for(let j=0;j<pts.length;j++){const px=x+34+pts[j][0]*(w-68),py=y+88+pts[j][1]*(h-118);if(pts[j][0]>k)break;j?ctx.lineTo(px,py):ctx.moveTo(px,py)}
 ctx.strokeStyle=C.red;ctx.lineWidth=9;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.restore();
 if(k>.95){const kk=back(p(t,a+1.05,a+1.35));ctx.save();ctx.translate(x+w-56,y+h-48);ctx.scale(kk,kk);ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fillStyle=C.red;ctx.fill();txt('↓',0,3,46,'MB','#fff','center');ctx.restore()}
 ctx.restore();ctx.save();const red=vis(t,a,a+1.3,.1,.6)*.28;if(red){const g=ctx.createRadialGradient(540,960,420,540,960,1200);g.addColorStop(0,'rgba(239,68,68,0)');g.addColorStop(1,`rgba(239,68,68,${red})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.restore()}
// --- «ahora imagina»: tareas que se amontonan hasta saturar ---
function chip(x,y,w,h,e,lab,{done=false,rot=0,alpha=1,sz=28}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x+w/2,y+h/2);ctx.rotate(rot);ctx.translate(-x-w/2,-y-h/2);
 card(x,y,w,h,{r:h/2,fill:done?'#ECFDF3':'rgba(255,255,255,.97)',stroke:done?C.green:null});if(e)emoji(e,x+h*.55,y+h/2,h*.48);
 txt(lab,x+(e?h*1.02:24),y+h/2+1,sz,'MS',C.ink);if(done)check(x+w-h*.5,y+h/2,h*.3,C.green,1);ctx.restore()}
function tareas(t){T.tareas.forEach(([e,l],i)=>{const a=S.tareas[i];if(!popIn(t,a,250,600+i*108,{out:S.bEnd-.22,outDur:.22}))return;
 const j=vis(t,S.caos,S.bEnd)*6;chip(40+j*(rnd(i+Math.floor(t*20))-.5),560+i*108,430,88,e,l,{rot:j*.004*(rnd(i*3+Math.floor(t*20))-.5)});ctx.restore()});
 T.extra.forEach((l,i)=>{const a=S.caos+.1+i*.16;if(t<a||t>S.bEnd)return;const x=20+rnd(i*7)*150,y=420+((i*5)%8)*104+rnd(i*5)*40;const rot=(rnd(i*11)-.5)*.24;
  if(!popIn(t,a,x+150,y+36,{out:S.bEnd-.2,outDur:.18}))return;chip(x,y,300,70,'',l,{rot,sz:25});ctx.restore()});
 const k=vis(t,S.caos+.2,S.bEnd-.1,.25,.15);if(k){ctx.save();ctx.globalAlpha=k;const x=260,y=290,w=560,h=96;card(x,y,w,h,{r:48,fill:'rgba(11,22,48,.92)'});
  const f=eio(p(t,S.caos+.3,S.bEnd-.5));rr(ctx,x+150,y+36,(w-180)*f,26,13);ctx.fillStyle=f>.85?C.red:C.yellow;ctx.fill();rr(ctx,x+150,y+36,w-180,26,13);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();
  txt(f>.85?T.saturado:'CARGA',x+28,y+h/2,28,'MB',f>.85?C.red:'#fff');if(f>.85)emoji('🤯',x+w-6,y+6,52);ctx.restore()}}
// --- el agente de Atlas Path ---
function marcaTag(t){const a=S.marca;if(!popIn(t,a,260,1190,{out:S.hechos-.25}))return;const x=56,y=1128,w=560,h=124;card(x,y,w,h,{r:62,fill:'rgba(11,22,48,.94)'});
 ctx.save();ctx.beginPath();ctx.arc(x+62,y+62,48,0,7);ctx.fillStyle='#fff';ctx.fill();if(LOGO.complete&&LOGO.naturalWidth){const s=80;ctx.drawImage(LOGO,x+62-s/2,y+62-s/2,s,s*LOGO.naturalHeight/LOGO.naturalWidth)}ctx.restore();
