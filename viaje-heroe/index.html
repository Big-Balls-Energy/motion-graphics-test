<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viaje del Héroe — Reel</title>
<style>
@font-face{font-family:MBlack;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:MXB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MSemi;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;width:auto;background:#0F172A;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);color:#fff;font-family:MXB,system-ui,sans-serif;cursor:pointer;text-align:center;padding:16px}
#ui .play{width:120px;height:120px;border-radius:50%;background:#7C3AED;display:flex;align-items:center;justify-content:center;font-size:52px}
#ui small{font-family:MSemi,system-ui,sans-serif;opacity:.8;font-size:15px;line-height:1.6}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>El viaje del héroe · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-con-voz.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2;
const C={bg:'#0F172A',parch:'#F5EFE6',parchD:'#E7DCC8',ink:'#1F2937',inkL:'#6B5B45',white:'#FAFAFA',violet:'#7C3AED',violetL:'#A78BFA',yellow:'#FACC15',green:'#22C55E',gray:'#94A3B8',grayD:'#64748B',orange:'#FB923C',red:'#EF4444',panel:'#1E293B'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));

/* ================= TIMELINE ================= */
const STAGE0=11,STAGEP=5;
const stageStart=k=>STAGE0+k*STAGEP;
const STAGES=[['MUNDO ORDINARIO'],['EL LLAMADO'],['EL MENTOR'],['LA PRUEBA'],['LA TRANSFORMACIÓN']];
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:4,tr:null,vis:'Dos claquetas genéricas («STAR WARS» y «EL REY LEÓN» en texto) chocan y sale un «=» brillante; se une el letrero «TU MARCA». Zoom.'},
 {id:'what',name:'QUÉ ES',a:4,b:11,tr:'wipe',vis:'Un libro antiguo se abre y despliega el mapa de aventura; «EL VIAJE DEL HÉROE» grande y «Joseph Campbell» estilo cita.'},
 {id:'stages',name:'LAS 5 ETAPAS',a:11,b:36,tr:null,pauses:[],vis:'El mapa hace zoom a la primera estación; el personaje recorre el camino punteado (lo recorrido en amarillo) y cada estación se ilumina. Cada etapa queda al frente 5 s con su número y nombre grandes.'},
 {id:'error',name:'EL ERROR MÁS COMÚN',a:36,b:46,ra:36.5,tr:'zoom',pauses:[[36.0,36.5],[45.5,46.0]],vis:'Un logo genérico con capa de héroe se tacha en gris; la capa pasa al cliente y el logo toma la lámpara de mentor. Check verde.'},
 {id:'nike',name:'EJEMPLO DE MARCA',a:46,b:52,tr:'slide',vis:'Silueta genérica de atleta corriendo cuesta arriba; «Nike» solo como texto pequeño en un letrero al costado del camino.'},
 {id:'cta',name:'CTA CON PALABRA CLAVE',a:52,b:60,tr:'wipe',vis:'Burbuja de comentario que se escribe sola → «HISTORIA» sola y grande 3 s → sobre de DM con la plantilla → logo, «ATLAS PATH», @Atlas_Path y botón SEGUIR con clic → regresa a las claquetas del inicio (loop).'},
];
function alloc(a,b,blocks){
 const n=blocks.map(x=>x[0].split(/\s+/).length),tot=n.reduce((s,v)=>s+v,0);let t=a;
 return blocks.map((x,i)=>{const d=(b-a)*n[i]/tot,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const STAGE_SUBS=[
 [['Uno: tu cliente',['cliente']],['vive con un problema.',['problema']]],
 [['Dos: algo lo empuja',['empuja']],['a querer cambiar.',['cambiar']]],
 [['Tres: aparece un mentor…',['mentor']],['esa es tu marca.',['marca']]],
 [['Cuatro: enfrenta el reto',['reto']],['con tu ayuda.',['ayuda']]],
 [['Cinco: regresa transformado…',['transformado']],['y lo cuenta.',['cuenta']]],
];
const SUBS_RAW=[
 [0.0,2.0,'Dos clásicos, una fórmula.',['fórmula']],
 [2.0,3.5,'¿Y tu marca?',['marca']],
 [4.0,6.2,'Es el viaje del héroe',['héroe']],
 [6.2,7.7,'de Joseph Campbell:',['campbell']],
 [7.7,10.5,'la fórmula que nos atrapa.',['atrapa']],
 ...STAGE_SUBS.flatMap((b,k)=>{const s=stageStart(k);return[[s+.2,s+2.3,...b[0]],[s+2.3,s+4.6,...b[1]]]}),
 ...alloc(36.5,45.5,[['El error más común:',['error']],['tu marca como héroe.',['héroe']],['El héroe es tu cliente.',['cliente']],['Tú eres el mentor.',['mentor']]]),
 [46.0,47.5,'Nike lo hace:',['nike']],
 [47.5,49.7,'el atleta es el héroe,',['atleta']],
 [49.7,51.5,'Nike da las herramientas.',['herramientas']],
 [52.0,53.6,'Comenta la palabra…',['comenta']],
 [56.6,58.4,'Síguenos en Atlas Path.',['síguenos']],
];
const HOLDS=[{a:53.6,b:56.6,text:'HISTORIA'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const ERR=SUBS.filter(s=>s.a>=36.5&&s.a<46).map(s=>s.a); // inicios de los 4 bloques del error

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(.9,'clap');sfx(1.0,'shine',.8);sfx(2.1,'pop',.7);sfx(2.9,'whoosh',.5,1.3);
sfx(4.0,'whoosh');sfx(4.15,'pop',.5);sfx(4.6,'pages');sfx(5.1,'whoosh',.5,.8);sfx(6.2,'ding',.7,.9);sfx(7.7,'pop',.5);
sfx(11.0,'whoosh',.7);
for(let k=0;k<5;k++){const s=stageStart(k);if(k)sfx(s,'whoosh',.4,1.2);for(let i=0;i<3;i++)if(k)sfx(s+.15+i*.25,'step',.5);sfx(s+.9,'ding',.8,1+k*.08);sfx(s+.05,'pop',.5,1.2)}
sfx(16.6,'whoosh',.5,1.6);sfx(17.4,'shine',.7);sfx(21.5,'pop',.6);sfx(23.6,'pop',.8,1.3);
sfx(26.4,'thunder');sfx(28.5,'thunder',.6);sfx(30.3,'rise',.7);
sfx(31.9,'triumph');sfx(32.2,'pop',.7,1.3);[33.3,33.8,34.3].forEach(x=>sfx(x,'pop',.5,1.4));
sfx(36.5,'whoosh',.5);sfx(36.7,'pop',.6);sfx(ERR[1],'strike');sfx(ERR[2],'whoosh',.5,1.3);sfx(ERR[2]+.9,'pop',.6);sfx(ERR[3],'pop',.6);sfx(44.2,'ding',.9,1.3);
sfx(46.0,'whoosh');sfx(49.7,'pop',.6);
sfx(52.0,'whoosh');for(let i=0;i<8;i++)sfx(52.3+i*.14,'key',.7,1+(i%3)*.08);sfx(53.6,'ding',1,1.2);sfx(53.6,'shine',.8);
sfx(56.6,'whoosh',.7,1.3);sfx(57.0,'pop',.6);sfx(57.2,'pop',.6);sfx(57.4,'pop',.6);sfx(58.3,'click');sfx(58.32,'pop',.6,1.3);sfx(59.45,'whoosh',.5);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,
 sfx:SFX,
 musicBoost:[[26,31,1.35]]};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.white,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function person(x,y,s,col,alpha=1,lookUp=0){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+lookUp*s*.15,y-s*3.1-lookUp*s*.2,s,0,TAU);ctx.fill();rr(x-s*1.15,y-s*1.9,s*2.3,s*1.9,[s*1.1,s*1.1,s*.25,s*.25]);ctx.fill();ctx.restore()}
function sparkle(x,y,r,col){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fillStyle=col;ctx.fill()}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function starP(x,y,r,ir=.45,n=5){ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rad=i%2?r*ir:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function cloud(x,y,s,rain,t){ctx.save();ctx.translate(x,y);ctx.fillStyle='#64748B';for(const[a,b,r]of[[-.5,0,.45],[0,-.25,.6],[.5,0,.45],[0,.1,.5]])circle(a*s,b*s,r*s,'#64748B');
 if(rain){ctx.strokeStyle='#93C5FD';ctx.lineWidth=s*.06;ctx.lineCap='round';for(let i=0;i<4;i++){const ph=((t*2.2)+i*.27)%1;ctx.globalAlpha=1-ph;const xx=(-.45+i*.3)*s;ctx.beginPath();ctx.moveTo(xx,s*.5+ph*s*.6);ctx.lineTo(xx-s*.08,s*.75+ph*s*.6);ctx.stroke()}}ctx.restore()}
function envelope(x,y,s,rot=0,glow=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(glow>0){ctx.shadowColor=C.yellow;ctx.shadowBlur=40*glow}
 rr(-s,-s*.65,s*2,s*1.3,s*.12);ctx.fillStyle='#FFFDF7';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=C.ink;ctx.lineWidth=s*.08;ctx.stroke();
 ctx.beginPath();ctx.moveTo(-s,-s*.6);ctx.lineTo(0,s*.15);ctx.lineTo(s,-s*.6);ctx.stroke();circle(0,s*.1,s*.16,C.red);ctx.restore()}
function lamp(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.strokeStyle=C.ink;ctx.lineWidth=s*.08;ctx.lineCap='round';
 const g=ctx.createRadialGradient(0,0,0,0,0,s*1.6);g.addColorStop(0,`rgba(250,204,21,${.45+.1*Math.sin(t*6)})`);g.addColorStop(1,'rgba(250,204,21,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*1.6,0,TAU);ctx.fill();
 ctx.beginPath();ctx.moveTo(0,-s*.75);ctx.lineTo(0,-s*.95);ctx.stroke();ctx.beginPath();ctx.arc(0,-s*1.05,s*.12,0,TAU);ctx.stroke();
 rr(-s*.4,-s*.75,s*.8,s*1.2,s*.15);ctx.fillStyle='rgba(250,204,21,.95)';ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.4,-s*.2);ctx.lineTo(s*.4,-s*.2);ctx.stroke();
 rr(-s*.5,s*.45,s,s*.18,s*.06);ctx.fillStyle=C.ink;ctx.fill();ctx.restore()}
function cape(x,y,s,col,t){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(-s*.9,0);ctx.quadraticCurveTo(-s*1.5+Math.sin(t*5)*s*.15,s*1.4,-s*1.3,s*2.4);ctx.lineTo(s*1.3,s*2.4);ctx.quadraticCurveTo(s*1.5+Math.sin(t*5+1)*s*.15,s*1.4,s*.9,0);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore()}
function house(x,y,s,col,roof,win){ctx.save();ctx.translate(x,y);rr(-s,-s*1.2,s*2,s*1.2,s*.06);ctx.fillStyle=col;ctx.fill();ctx.beginPath();ctx.moveTo(-s*1.25,-s*1.15);ctx.lineTo(0,-s*2.1);ctx.lineTo(s*1.25,-s*1.15);ctx.closePath();ctx.fillStyle=roof;ctx.fill();
 rr(-s*.25,-s*.75,s*.5,s*.75,s*.05);ctx.fillStyle=C.ink;ctx.fill();rr(-s*.8,-s*.95,s*.4,s*.35,s*.05);ctx.fillStyle=win;ctx.fill();rr(s*.4,-s*.95,s*.4,s*.35,s*.05);ctx.fill();ctx.restore()}

/* ================= FONDO / HUD / SUBTÍTULOS ================= */
function bg(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.save();
 const g=ctx.createRadialGradient(CX,860,0,CX,860,820);g.addColorStop(0,'rgba(124,58,237,.16)');g.addColorStop(1,'rgba(124,58,237,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<46;i++){const x=(i*233)%W,y=(i*389)%H,tw=.25+.25*Math.sin(t*.7+i);ctx.fillStyle=`rgba(250,250,250,${tw*.3})`;ctx.fillRect(x,y,3,3)}ctx.restore()}
function hud(t){
 ctx.save();ctx.globalAlpha=.7;rr(40,262,100,100,20);ctx.fillStyle='rgba(250,250,250,.95)';ctx.fill();
 if(logo.complete&&logo.naturalWidth){const h=86,w=h*logo.naturalWidth/logo.naturalHeight;ctx.drawImage(logo,90-w/2,269,w,h)}ctx.restore();
 ctx.fillStyle='rgba(250,250,250,.1)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.yellow;ctx.fillRect(0,0,W*clamp(t/DUR),10);
}
const SUB_FS=60,SUB_Y=1400,SUB_MAXW=800;
function subs(t){
 const s=SUBS.find(s=>t>=s.a&&t<s.b);if(!s)return;
 ctx.font=`${SUB_FS}px MXB`;const sp=ctx.measureText(' ').width;
 const lines=[];let cur=[],cw=0;
 for(const w of s.words){const ww=ctx.measureText(w.w).width;if(cur.length&&cw+sp+ww>SUB_MAXW){lines.push({ws:cur,w:cw});cur=[];cw=0}cur.push({...w,ww});cw+=(cur.length>1?sp:0)+ww}
 lines.push({ws:cur,w:cw});
 const lh=SUB_FS*1.25,pad=34,pv=20,bw=Math.max(...lines.map(l=>l.w))+pad*2,bh=lines.length*lh+pv*2;
 const kin=eo(p(t,s.a,s.a+.18)),kout=1-p(t,s.b-.12,s.b);
 ctx.save();ctx.translate(CX,SUB_Y);const sc=.92+.08*kin;ctx.scale(sc,sc);ctx.globalAlpha=Math.min(kin,kout);
 rr(-bw/2,-bh/2,bw,bh,26);ctx.fillStyle='rgba(2,6,23,.86)';ctx.fill();ctx.strokeStyle='rgba(250,250,250,.14)';ctx.lineWidth=2;ctx.stroke();
 ctx.textBaseline='middle';ctx.textAlign='left';
 lines.forEach((l,li)=>{let x=-l.w/2;const y=-bh/2+pv+lh*(li+.5);
  l.ws.forEach(w=>{const reached=t>=w.t0;ctx.fillStyle=reached?(w.key?C.yellow:'#fff'):'rgba(255,255,255,.42)';
   const bump=reached?1+.1*(1-eo(p(t,w.t0,w.t0+.28))):1;
   ctx.save();ctx.translate(x+w.ww/2,y);ctx.scale(bump,bump);ctx.fillText(w.w,-w.ww/2,0);ctx.restore();x+=w.ww+sp})});
 ctx.restore();
}

/* ================= 1 · HOOK ================= */
function clapper(x,y,w,title,col,open,rot=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);const h=w*.62;
 rr(-w/2,-h/2+w*.08,w,h,w*.05);ctx.fillStyle='#111827';ctx.fill();ctx.strokeStyle=C.white;ctx.lineWidth=w*.015;ctx.stroke();
 ctx.fillStyle='rgba(250,250,250,.35)';ctx.fillRect(-w/2+w*.06,h*.18,w*.88,w*.008);ctx.fillRect(-w/2+w*.06,h*.33,w*.88,w*.008);
 text(title,0,-h*.02,fitSize(title,'MBlack',w*.13,w*.82),'MBlack',col);
 ctx.save();ctx.translate(-w/2,-h/2+w*.08);ctx.rotate(-open*.45);
 rr(0,-w*.12,w,w*.12,w*.02);ctx.fillStyle='#111827';ctx.fill();ctx.stroke();
 ctx.save();ctx.beginPath();ctx.rect(0,-w*.12,w,w*.12);ctx.clip();ctx.fillStyle=C.white;for(let i=-1;i<8;i++){ctx.beginPath();ctx.moveTo(i*w*.16,0);ctx.lineTo(i*w*.16+w*.08,-w*.12);ctx.lineTo(i*w*.16+w*.16,-w*.12);ctx.lineTo(i*w*.16+w*.08,0);ctx.fill()}ctx.restore();ctx.restore();
 ctx.restore();
}
function brandSign(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rr(-130,-70,260,140,24);ctx.fillStyle=C.violet;ctx.fill();ctx.strokeStyle=C.yellow;ctx.lineWidth=6;ctx.stroke();text('TU',0,-22,40,'MBlack','#fff');text('MARCA',0,26,48,'MBlack',C.yellow);ctx.restore()}
function sHook(t){
 const z=eio(p(t,2.9,3.5)),zs=1+.12*z;ctx.save();ctx.translate(CX,860);ctx.scale(zs,zs);ctx.translate(-CX,-860);
 const hit=eo(p(t,0,.9)),row=eio(p(t,1.8,2.3)),bounce=t>.9?Math.sin(clamp((t-.9)/.25)*Math.PI)*-30:0;
 const wB=lerp(330,250,row);
 const xl=lerp(lerp(130,330,hit),190,row)+(t>.9&&row<1?bounce:0),xr=lerp(lerp(890,690,hit),510,row)-(t>.9&&row<1?bounce:0),yB=lerp(860,800,row);
 clapper(xl,yB,wB,'STAR WARS',C.white,t<.9?1-hit*.2:Math.max(0,.8-p(t,.9,1.1)*.8),lerp(-.12,0,hit));
 clapper(xr,yB,wB,'EL REY LEÓN',C.white,t<.9?1-hit*.2:Math.max(0,.8-p(t,.9,1.1)*.8),lerp(.12,0,hit));
 const ke=pop(t,.95,.35);if(ke>0){const ex=lerp(CX,350,row);ctx.save();ctx.translate(ex,yB);ctx.scale(ke*lerp(1.4,.8,row),ke*lerp(1.4,.8,row));ctx.shadowColor=C.yellow;ctx.shadowBlur=40;text('=',0,0,150,'MBlack',C.yellow);ctx.restore()}
 if(t>.9&&t<1.6){const k=p(t,.9,1.6);for(let i=0;i<8;i++){const a=i*TAU/8;ctx.save();ctx.globalAlpha*=1-k;ctx.strokeStyle=C.yellow;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(CX+Math.cos(a)*(60+k*100),860+Math.sin(a)*(60+k*100));ctx.lineTo(CX+Math.cos(a)*(100+k*170),860+Math.sin(a)*(100+k*170));ctx.stroke();ctx.restore()}}
 const k2=pop(t,2.05,.35);if(k2>0){ctx.save();ctx.translate(670,yB);ctx.scale(k2*.8,k2*.8);ctx.shadowColor=C.yellow;ctx.shadowBlur=30;text('=',0,0,150,'MBlack',C.yellow);ctx.restore();brandSign(830,yB,k2*.85)}
 ctx.restore();
}

/* ================= MAPA DE AVENTURA ================= */
const ST=[{x:0,y:40},{x:760,y:-70},{x:1520,y:50},{x:2280,y:-60},{x:3040,y:30}];
const MAPY=1000,MAP_L=-460,MAP_R=3500,MAP_T=-500,MAP_B=240;
function pathY(x){let i=0;while(i<ST.length-2&&x>ST[i+1].x)i++;const a=ST[i],b=ST[i+1],k=clamp((x-a.x)/(b.x-a.x));return lerp(a.y,b.y,eio(k))+Math.sin(x/150)*38*Math.sin(Math.PI*k)}

   ctx.beginPath();ctx.arc(CX,900,k*1350,0,TAU);ctx.strokeStyle=C.yellow;ctx.lineWidth=40*(1-k);ctx.stroke()}
  else{drawTr(sc.tr,k,0,()=>DRAW[i-1](tp));drawTr(sc.tr,k,1,()=>DRAW[i](t))}}
 else DRAW[i](t);
 // loop: el último medio segundo regresa a las dos claquetas del primer cuadro
 if(t>59.45){ctx.save();ctx.globalAlpha=eio(p(t,59.45,60));bg(0);sHook(0);ctx.restore()}
 subs(t);hud(t);
}

window.renderFrame=renderFrame;
window.ready=Promise.all([document.fonts.load('100px MBlack'),document.fonts.load('100px MXB'),document.fonts.load('100px MSemi'),
 new Promise(r=>{if(logo.complete)r();else{logo.onload=r;logo.onerror=r}})]);
const RENDER=new URLSearchParams(location.search).has('render');
const ui=document.getElementById('ui'),aud=document.getElementById('aud');
if(RENDER){ui.classList.add('hide');document.body.style.background=C.bg}
else{
 let playing=false,t0=0,useAudio=true;
 aud.addEventListener('error',()=>useAudio=false);
 const now=()=>useAudio&&!isNaN(aud.duration)?aud.currentTime:(performance.now()-t0)/1000;
 function loop(){if(!playing)return;let t=now();if(t>=DUR){if(useAudio){aud.currentTime=0;aud.play()}else t0=performance.now();t=0}renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)}
 function start(){ui.classList.add('hide');playing=true;t0=performance.now();aud.currentTime=0;aud.play().catch(()=>useAudio=false);loop()}
 ui.addEventListener('click',start);
 addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
