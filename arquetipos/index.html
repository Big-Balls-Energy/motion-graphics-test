<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 Arquetipos — Reel</title>
<style>
@font-face{font-family:MBlack;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:MXB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MSemi;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;width:auto;background:#0A0A0A;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);color:#fff;font-family:MXB,system-ui,sans-serif;cursor:pointer;text-align:center;padding:16px}
#ui .play{width:120px;height:120px;border-radius:50%;background:#7C3AED;display:flex;align-items:center;justify-content:center;font-size:52px}
#ui small{font-family:MSemi,system-ui,sans-serif;opacity:.8;font-size:15px;line-height:1.6}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>12 arquetipos de marca · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-arquetipos.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2;
const C={bg:'#0A0A0A',white:'#FAFAFA',violet:'#7C3AED',violetL:'#A78BFA',yellow:'#FACC15',green:'#22C55E',gray:'#525252',grayL:'#A3A3A3',panel:'#141414',edge:'#3F3F46',skin:'#E9B48C'};
const GROUPS=[['INDEPENDENCIA','#38BDF8'],['MAESTRÍA','#EF4444'],['PERTENENCIA','#F472B6'],['ESTABILIDAD','#22C55E']];
const ARCH=[['INOCENTE','Coca-Cola','sun'],['SABIO','Google','owl'],['EXPLORADOR','The North Face','compass'],
 ['HÉROE','Nike','shield'],['REBELDE','Harley-Davidson','bolt'],['MAGO','Disney','magic'],
 ['AMIGO','IKEA','hands'],['AMANTE','Chanel','heart'],['BUFÓN',"M&M's",'mask'],
 ['CUIDADOR','Johnson & Johnson','care'],['CREADOR','LEGO','brush'],['GOBERNANTE','Rolex','crown']].map((a,i)=>({name:a[0],brand:a[1],ic:a[2],g:Math.floor(i/3),col:GROUPS[Math.floor(i/3)][1]}));
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));

/* ================= TIMELINE ================= */
const CARD0=12.0,CARDP=2.0,FLIP=.22,WHEEL_END=36.0;
const cardStart=k=>CARD0+k*CARDP;
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:4,tr:null,vis:'Un tenis genérico (sin logo) gira al centro; en «héroe» se transforma en un escudo brillante con destello. Zoom.'},
 {id:'what',name:'QUÉ SON',a:4,b:12,tr:'wipe',vis:'12 cartas boca abajo se despliegan en abanico; «12» grande en amarillo y «Carl Jung» en pequeño, estilo cita.'},
 {id:'cards',name:'LOS 12 ARQUETIPOS',a:12,b:36,tr:'zoom',pauses:[],vis:'Cada carta se voltea (2 s por carta) con su ícono, el arquetipo arriba y la marca abajo; cada grupo de 3 se acomoda en su cuadrante de la rueda de 4 colores. Sin subtítulo: la carta ya muestra el texto.'},
 {id:'why',name:'POR QUÉ FUNCIONA',a:36,b:46,ra:36.5,tr:'zoom',pauses:[[36.0,36.5],[45.5,46.0]],vis:'La rueda completa con las 12 cartas gira (pausa) → personita frente a un espejo; en el reflejo aparece con capa de héroe → tres íconos (colores, tono, historias) se alinean con check verde bajo «COHERENCIA».'},
 {id:'app',name:'APLICACIÓN',a:46,b:54,tr:'spin',vis:'Cartas en abanico; una mano elige solo una y las demás se desvanecen. La carta elegida tiñe una mini identidad de marca (paleta, frase, publicación).'},
 {id:'cta',name:'CTA',a:54,b:60,tr:'wipe',vis:'Burbuja de comentario que se escribe sola → logo + «ATLAS PATH» + @Atlas_Path + botón SEGUIR con clic → regresa al tenis del inicio (loop).'},
];
const SUBS_RAW=[
 [0.0,1.75,'Nike no vende tenis.',['tenis']],
 [1.75,3.5,'Vende sentirte un héroe.',['héroe']],
 [4.0,6.2,'Se llaman arquetipos de marca:',['arquetipos']],
 [6.2,7.7,'son 12 personalidades,',['12']],
 [7.7,9.5,'basadas en Carl Jung,',['jung']],
 [9.5,11.5,'que tu cerebro reconoce.',['reconoce']],
 [36.5,38.3,'No compras un producto:',['producto']],
 [38.3,40.1,'compras quién quieres ser.',['quién']],
 [40.1,41.6,'Un arquetipo claro',['claro']],
 [41.6,43.55,'hace que te recuerden',['recuerden']],
 [43.55,45.5,'y te sientan coherente.',['coherente']],
 [46.0,47.5,'¿Tienes un negocio?',['negocio']],
 [47.5,49.0,'Elige uno solo',['solo']],
 [49.0,51.2,'y úsalo en tus colores,',['colores']],
 [51.2,53.5,'tu tono y tus historias.',['historias']],
 [54.0,55.5,'Comenta tu marca',['comenta']],
 [55.5,57.7,'y te decimos su arquetipo.',['arquetipo']],
 [57.7,59.5,'Síguenos en Atlas Path.',['síguenos']],
];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const CARDS=ARCH.map((c,k)=>({a:cardStart(k),b:cardStart(k)+CARDP,text:`${c.name[0]+c.name.slice(1).toLowerCase()}: ${c.brand}.`}));

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(.2,'whoosh',.35,1.4);sfx(2.85,'shine');sfx(2.9,'ding',.8,.9);sfx(3.0,'whoosh',.6,1.3);
sfx(4.0,'whoosh');for(let i=0;i<12;i++)sfx(4.3+i*.1,'flip',.35,1+i*.03);sfx(6.2,'ding');sfx(7.7,'pop',.5);
for(let k=0;k<12;k++){sfx(cardStart(k),'flip',1);if(k%3===0)sfx(cardStart(k)+.05,'pop',.4,1.2)}
[18,24,30].forEach(x=>sfx(x+.05,'whoosh',.35,1.4));sfx(36.0,'rise');sfx(36.0,'whoosh',.6);
sfx(36.5,'whoosh',.5);sfx(36.7,'pop',.5);sfx(38.3,'shine',.8);sfx(40.1,'whoosh',.4);[40.3,40.7,41.1].forEach(x=>sfx(x,'pop',.55));sfx(41.6,'ding',.7,1.2);sfx(43.6,'ding',.9,1.4);
sfx(46.0,'whoosh');for(let i=0;i<5;i++)sfx(46.2+i*.12,'flip',.4,1.1);sfx(48.3,'pop',.7);sfx(48.4,'whoosh',.4,1.3);[49.2,51.3,52.0].forEach(x=>sfx(x,'pop',.55,1.15));
sfx(54.0,'whoosh');for(let i=0;i<10;i++)sfx(54.3+i*.16,'tick',.25,1.4);sfx(56.6,'whoosh',.5);sfx(56.8,'pop',.6);sfx(57.0,'pop',.6);sfx(57.3,'pop',.6);sfx(58.3,'click');sfx(58.32,'pop',.6,1.3);sfx(59.45,'whoosh',.5);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:[],cards:CARDS,sfx:SFX};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.white,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function person(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-s*3.1,s,0,TAU);ctx.fill();rr(x-s*1.15,y-s*1.9,s*2.3,s*1.9,[s*1.1,s*1.1,s*.25,s*.25]);ctx.fill()}
function sparkle(x,y,r,col){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fillStyle=col;ctx.fill()}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function starP(x,y,r,ir=.45,n=5){ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rad=i%2?r*ir:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath()}
function heartP(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.closePath()}
function shieldP(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x+s*.55,y-s*.7,x+s*.85,y-s*.75);ctx.quadraticCurveTo(x+s*.9,y+s*.35,x,y+s);ctx.quadraticCurveTo(x-s*.9,y+s*.35,x-s*.85,y-s*.75);ctx.quadraticCurveTo(x-s*.55,y-s*.7,x,y-s);ctx.closePath()}

/* ================= ÍCONOS DE ARQUETIPO (s ≈ radio) ================= */
function archIcon(kind,x,y,s,col,t=0){
 ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';const lw=s*.12;ctx.lineWidth=lw;
 if(kind==='sun'){circle(0,0,s*.42,col);for(let i=0;i<12;i++){const a=i*TAU/12+t*.3;ctx.beginPath();ctx.moveTo(Math.cos(a)*s*.58,Math.sin(a)*s*.58);ctx.lineTo(Math.cos(a)*s*.88,Math.sin(a)*s*.88);ctx.stroke()}}
 if(kind==='owl'){ctx.beginPath();ctx.ellipse(0,s*.12,s*.62,s*.78,0,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.55,-s*.4);ctx.lineTo(-s*.45,-s*.85);ctx.lineTo(-s*.15,-s*.55);ctx.moveTo(s*.55,-s*.4);ctx.lineTo(s*.45,-s*.85);ctx.lineTo(s*.15,-s*.55);ctx.fill();
  for(const d of[-1,1]){circle(d*s*.26,-s*.15,s*.24,C.panel);circle(d*s*.26,-s*.15,s*.11,col)}ctx.beginPath();ctx.moveTo(-s*.08,s*.08);ctx.lineTo(s*.08,s*.08);ctx.lineTo(0,s*.24);ctx.closePath();ctx.fillStyle=C.yellow;ctx.fill();
  ctx.strokeStyle=C.panel;ctx.lineWidth=lw*.6;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,s*.42+i*s*.0,s*(.25+i*.12),.5,Math.PI-.5);ctx.stroke()}}
 if(kind==='compass'){ctx.beginPath();ctx.arc(0,0,s*.85,0,TAU);ctx.stroke();for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(a)*s*.68,Math.sin(a)*s*.68);ctx.lineTo(Math.cos(a)*s*.85,Math.sin(a)*s*.85);ctx.stroke()}
  ctx.rotate(.5+Math.sin(t*2)*.15);ctx.beginPath();ctx.moveTo(0,-s*.65);ctx.lineTo(s*.16,0);ctx.lineTo(-s*.16,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,s*.65);ctx.lineTo(s*.16,0);ctx.lineTo(-s*.16,0);ctx.closePath();ctx.fillStyle=C.white;ctx.fill();circle(0,0,s*.09,C.panel)}
 if(kind==='bolt'){ctx.beginPath();ctx.moveTo(s*.2,-s*.95);ctx.lineTo(-s*.5,s*.12);ctx.lineTo(-s*.02,s*.12);ctx.lineTo(-s*.22,s*.95);ctx.lineTo(s*.52,-s*.2);ctx.lineTo(s*.04,-s*.2);ctx.closePath();ctx.fill()}
 if(kind==='magic'){ctx.lineWidth=lw*1.1;ctx.beginPath();ctx.moveTo(-s*.7,s*.75);ctx.lineTo(s*.15,-s*.1);ctx.strokeStyle=C.white;ctx.stroke();starP(s*.32,-s*.32,s*.42,.45);ctx.fillStyle=col;ctx.fill();
  for(const[a,b,r]of[[-.45,-.6,.12],[.75,.25,.1],[.7,-.85,.08]])sparkle(a*s,b*s,r*s*(1+.3*Math.sin(t*5+a*9)),C.yellow)}
 if(kind==='shield'){shieldP(0,0,s*.9);ctx.fill();shieldP(0,0,s*.62);ctx.fillStyle=C.panel;ctx.fill();starP(0,-s*.02,s*.32,.45);ctx.fillStyle=col;ctx.fill()}
 if(kind==='heart'){heartP(0,-s*.05,s*.85);ctx.fill()}
 if(kind==='mask'){ctx.beginPath();ctx.moveTo(-s*.85,-s*.55);ctx.quadraticCurveTo(0,-s*.75,s*.85,-s*.55);ctx.quadraticCurveTo(s*.85,s*.85,0,s*.85);ctx.quadraticCurveTo(-s*.85,s*.85,-s*.85,-s*.55);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.panel;for(const d of[-1,1]){ctx.beginPath();ctx.ellipse(d*s*.33,-s*.12,s*.17,s*.11,d*-.3,0,TAU);ctx.fill()}ctx.strokeStyle=C.panel;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(0,s*.15,s*.38,.3,Math.PI-.3);ctx.stroke()}
 if(kind==='hands'){for(const d of[-1,1]){ctx.save();ctx.scale(d,1);ctx.fillStyle=d<0?col:C.white;rr(-s*.98,-s*.18,s*.62,s*.42,s*.12);ctx.fill();
   ctx.beginPath();ctx.moveTo(-s*.42,-s*.2);ctx.quadraticCurveTo(-s*.05,-s*.5,s*.3,-s*.15);ctx.quadraticCurveTo(s*.12,s*.1,s*.25,s*.32);ctx.quadraticCurveTo(-s*.1,s*.45,-s*.42,s*.24);ctx.closePath();ctx.fill();ctx.restore()}
  ctx.strokeStyle=C.panel;ctx.lineWidth=lw*.5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-s*.05+i*s*.12,-s*.16);ctx.lineTo(s*.05+i*s*.12,s*.18);ctx.stroke()}}
 if(kind==='care'){heartP(0,-s*.35,s*.38);ctx.fillStyle=C.white;ctx.fill();ctx.fillStyle=col;for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(d*s*.08,s*.82);ctx.quadraticCurveTo(d*s*.95,s*.75,d*s*.88,-s*.05);ctx.quadraticCurveTo(d*s*.75,-s*.2,d*s*.62,-s*.02);ctx.quadraticCurveTo(d*s*.55,s*.45,d*s*.08,s*.5);ctx.closePath();ctx.fill()}}
 if(kind==='brush'){ctx.save();ctx.rotate(.65);rr(-s*.09,-s*.95,s*.18,s*1.05,s*.08);ctx.fillStyle=C.white;ctx.fill();rr(-s*.13,s*.05,s*.26,s*.2,s*.04);ctx.fillStyle='#A3A3A3';ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.13,s*.25);ctx.quadraticCurveTo(-s*.15,s*.62,0,s*.85);ctx.quadraticCurveTo(s*.15,s*.62,s*.13,s*.25);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
  ctx.beginPath();ctx.moveTo(-s*.9,s*.7);ctx.quadraticCurveTo(-s*.4,s*.35,-s*.05,s*.78);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.stroke()}
 if(kind==='crown'){ctx.beginPath();ctx.moveTo(-s*.85,s*.5);ctx.lineTo(-s*.85,-s*.35);ctx.lineTo(-s*.42,s*.05);ctx.lineTo(0,-s*.6);ctx.lineTo(s*.42,s*.05);ctx.lineTo(s*.85,-s*.35);ctx.lineTo(s*.85,s*.5);ctx.closePath();ctx.fill();
  rr(-s*.9,s*.5,s*1.8,s*.22,s*.06);ctx.fill();for(const[a,b]of[[-.85,-.42],[0,-.7],[.85,-.42]])circle(a*s,b*s,s*.11,C.yellow)}
 ctx.restore();
}

/* ================= CARTAS ================= */
function cardBack(w,h,t){
 rr(-w/2,-h/2,w,h,w*.07);const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#5B21B6');g.addColorStop(1,'#2E1065');ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle=C.yellow;ctx.lineWidth=w*.015;rr(-w/2+w*.05,-h/2+w*.05,w*.9,h-w*.1,w*.05);ctx.stroke();
 ctx.strokeStyle='rgba(250,204,21,.35)';ctx.lineWidth=w*.008;ctx.beginPath();ctx.arc(0,0,w*.28,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(0,0,w*.18,0,TAU);ctx.stroke();
 starP(0,0,w*.12,.4,8);ctx.fillStyle=C.yellow;ctx.fill();
 for(const[a,b]of[[-.3,-.35],[.3,-.35],[-.3,.35],[.3,.35]])sparkle(a*w,b*h,w*.03,'rgba(250,204,21,.6)');
}
function cardFront(c,k,w,h,t){
 rr(-w/2,-h/2,w,h,w*.07);ctx.fillStyle=C.panel;ctx.fill();ctx.strokeStyle=c.col;ctx.lineWidth=w*.016;ctx.stroke();
 ctx.save();ctx.globalAlpha*=.5;rr(-w/2+w*.045,-h/2+w*.045,w*.91,h-w*.09,w*.05);ctx.lineWidth=w*.005;ctx.stroke();ctx.restore();
 text(ROMAN[k],0,-h*.41,w*.065,'MXB',c.col);
 text(c.name,0,-h*.32,fitSize(c.name,'MBlack',w*.14,w*.84),'MBlack',C.white);
 ctx.save();ctx.globalAlpha*=.16;circle(0,-h*.02,w*.3,c.col);ctx.restore();ctx.beginPath();ctx.arc(0,-h*.02,w*.3,0,TAU);ctx.strokeStyle=c.col;ctx.lineWidth=w*.008;ctx.stroke();
 archIcon(c.ic,0,-h*.02,w*.24,c.col,t);
 ctx.fillStyle=c.col;ctx.fillRect(-w*.32,h*.24,w*.64,w*.006);
 text('MARCA',0,h*.29,w*.04,'MXB',C.grayL);
 text(c.brand,0,h*.37,fitSize(c.brand,'MBlack',w*.13,w*.84),'MBlack',C.yellow);
}
// carta con volteo: flip 0 = reverso, 1 = frente
function card(k,x,y,s,flip,rot=0,t=0,w=420,h=640){
 const a=flip*Math.PI,sx=Math.abs(Math.cos(a));ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s*Math.max(sx,.02),s);
 if(flip<.5)cardBack(w,h,t);else cardFront(ARCH[k],k,w,h,t);ctx.restore();
}

/* ================= FONDO / HUD / SUBTÍTULOS ================= */
function bg(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);ctx.save();
 const g=ctx.createRadialGradient(CX,820,0,CX,820,760);g.addColorStop(0,'rgba(124,58,237,.17)');g.addColorStop(1,'rgba(124,58,237,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<40;i++){const x=(i*233)%W,y=(i*389)%H,tw=.25+.25*Math.sin(t*.8+i);ctx.fillStyle=`rgba(250,250,250,${tw*.25})`;ctx.fillRect(x,y,3,3)}ctx.restore()}
function hud(t){
 // marca de agua: más chica y semitransparente
 ctx.save();ctx.globalAlpha=.7;rr(40,262,100,100,20);ctx.fillStyle='rgba(250,250,250,.95)';ctx.fill();
 if(logo.complete&&logo.naturalWidth){const h=86,w=h*logo.naturalWidth/logo.naturalHeight;ctx.drawImage(logo,90-w/2,269,w,h)}ctx.restore();
 ctx.fillStyle='rgba(250,250,250,.1)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.violet;ctx.fillRect(0,0,W*clamp(t/DUR),10);
}
const SUB_FS=60,SUB_Y=1400,SUB_MAXW=800;
function subs(t){
 const s=SUBS.find(s=>t>=s.a&&t<s.b);if(!s)return;

  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
</script>
