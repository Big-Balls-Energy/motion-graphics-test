<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrewDog — Auge y caída</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton.woff2)}
@font-face{font-family:Bebas;src:url(fonts/BebasNeue.woff2)}
@font-face{font-family:MXB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MSemi;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;width:auto;background:#0A0A0A;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);color:#F2EDE4;font-family:MXB,system-ui,sans-serif;cursor:pointer;text-align:center;padding:16px}
#ui .play{width:120px;height:120px;border-radius:50%;background:#0EA5E9;display:flex;align-items:center;justify-content:center;font-size:52px}
#ui small{font-family:MSemi,system-ui,sans-serif;opacity:.8;font-size:15px;line-height:1.6}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>BrewDog · auge y caída · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-con-voz.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2,DEG=Math.PI/180;
const C={bg:'#0A0A0A',bone:'#F2EDE4',blue:'#0EA5E9',blueHi:'#38BDF8',red:'#DC2626',redHi:'#EF4444',ink:'#141414',gray:'#8C877F',tape:'rgba(222,208,176,.82)'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';
// Fotos reales: assets/latas/<ETIQUETA>.png y assets/avatares/<ETIQUETA>.png (PNG con fondo transparente).
// Si un archivo no existe se dibuja un sustituto gráfico con la proporción indicada; basta con guardar el PNG con ese nombre.
const LATAS={LATA_PUNK_IPA:1.9,LATA_HAZY_JANE:1.9,LATA_ELVIS_JUICE:1.9,PINTA_BLACK_HEART:1.6};
const AVATARES=['AVATAR_JAMES_WATT','AVATAR_MARTIN_DICKIE'];
const IMG={};
Object.keys(LATAS).forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/latas/${n}.png`});
AVATARES.forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/avatares/${n}.png`});
const loaded=i=>i&&i.complete&&i.naturalWidth>0;

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const ei=x=>x*x*x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],k)).toString(16).padStart(2,'0')).join('')};
const rgba=(h,a)=>`rgba(${hex(h).join(',')},${a})`;

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:6.0,tr:null,vis:'[LATA_PUNK_IPA] cae al centro con impacto; detrás «≈£2,000,000,000» en azul con conteo rápido, que de golpe se desploma a «£33,000,000» en rojo con una grieta sobre la lata.'},
 {id:'origen',name:'EL ORIGEN (2007)',a:6.0,b:13.1,tr:'tear',vis:'Cinta en 2007; [AVATAR_JAMES_WATT] y [AVATAR_MARTIN_DICKIE] con etiquetas de cofundador. Fila de latas grises e iguales; una se tacha con el sello «ABURRIDO» y entra [LATA_PUNK_IPA] a color.'},
 {id:'stunts',name:'LOS STUNTS',a:13.1,b:22.8,tr:'slam',vis:'Tres recortes de collage, uno por uno: botella con silueta de ardilla y «55%»; un tanque cruzando una calle genérica; un helicóptero del que caen gatitos con paracaídas (caricatura). Sellos «TITULAR» y «VIRAL». La línea de valor empieza a subir; la cinta pasa por 2010 y 2015.'},
 {id:'jugada',name:'LA JUGADA MAESTRA (2009)',a:22.8,b:32.5,tr:'tear',vis:'Cinta en 2009; [LATA_HAZY_JANE] al centro; se multiplican íconos de personas con un certificado de acción; «≈200,000» y «≈£75 M» solos en pantalla; los certificados entran a la lata. La línea de valor sube con fuerza.'},
 {id:'caida',name:'LA CAÍDA (2026)',a:32.5,b:44.7,tr:'slam',vis:'Cinta en 2017 con la etiqueta «Valuación +£1,000 M»; luego salta a 2026, la paleta cambia a rojo y la línea se desploma. [LATA_ELVIS_JUICE] y [PINTA_BLACK_HEART] pierden color y se agrietan. 38 bares se apagan uno por uno; los certificados de los fans se vuelven ceniza.'},
 {id:'leccion',name:'LA LECCIÓN',a:44.7,b:51.4,tr:'tear',vis:'Pantalla dividida: megáfono con «ATENCIÓN» (azul) y cimientos de ladrillo con «NEGOCIO SÓLIDO». Se unen y [LATA_PUNK_IPA] recupera el color encima de los cimientos.'},
 {id:'cta',name:'CTA CON PALABRA CLAVE',a:51.4,b:60,tr:'tear',vis:'Burbuja que escribe «PUNK» → «PUNK» sola y grande 3 s → logo, «ATLAS PATH», @Atlas_Path y botón SEGUIR con clic. Texto pequeño de aviso → regresa a la lata cayendo (loop).'},
];
function alloc(a,b,blocks){
 const base=blocks.map(x=>Math.max(1.5,x[0].split(/\s+/).length/2.25)),tot=base.reduce((s,v)=>s+v,0),k=(b-a)/tot;
 if(k<1)console.log('ALLOC no cabe: '+blocks[0][0]);let t=a;
 return blocks.map((x,i)=>{const d=base[i]*k,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const SUBS_RAW=[
 [0.0,1.5,'Esta cervecería valía…',['valía']],
 ...alloc(6.0,12.6,[['En 2007, dos escoceses',['escoceses']],['aburridos de la cerveza comercial,',['aburridos']],['fundaron BrewDog: ser punk.',['punk']]]),
 [13.1,14.7,'Una cerveza de…',['cerveza']],
 ...alloc(16.7,22.3,[['dentro de ardillas disecadas,',['ardillas']],['un tanque en Londres,',['tanque']],['gatos desde un helicóptero.',['helicóptero']]]),
 ...alloc(22.8,26.2,[['Su jugada maestra:',['maestra']],['fans convertidos en dueños.',['dueños']]]),
 [28.2,30.0,'compraron acciones y aportaron…',['acciones']],
 ...alloc(32.5,36.3,[['Pero el negocio no aguantó',['aguantó']],['su propio ritmo.',['ritmo']]]),
 [36.3,38.55,'En 2026 entró en insolvencia,',['insolvencia']],
 ...alloc(40.55,44.2,[['y sus fans-inversionistas',['fans-inversionistas']],['se quedaron sin nada.',['nada']]]),
 ...alloc(44.7,50.9,[['Lo disruptivo consigue atención.',['atención']],['Pero solo un negocio sólido',['sólido']],['la convierte en éxito.',['éxito']]]),
 [51.4,52.9,'Comenta la palabra…',['comenta']],
 [55.9,57.7,'Estrategia con bases firmes.',['bases','firmes']],
 [57.7,59.45,'Síguenos en Atlas Path.',['síguenos']],
];
const HOLDS=[{a:1.5,b:3.5,text:'≈£2,000,000,000'},{a:3.5,b:5.5,text:'£33,000,000'},{a:14.7,b:16.7,text:'55%'},{a:26.2,b:28.2,text:'≈200,000'},{a:30.0,b:32.0,text:'≈£75 M'},{a:38.55,b:40.55,text:'38 BARES'},{a:52.9,b:55.9,text:'PUNK'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const BS=id=>{const sc=SCENES.find(s=>s.id===id);return SUBS.filter(s=>s.a>=sc.a-1e-6&&s.a<sc.b).map(s=>s.a)};
const O=BS('origen'),S=BS('stunts'),J=BS('jugada'),K=BS('caida'),L=BS('leccion');
const CRASH=34.77,FALL=36.3; // empieza a caer la línea · llega 2026 (grieta)
// color de acento: azul en el auge, rojo en la caída, azul de nuevo en la lección
const fallK=t=>clamp((t-34.6)/.6)*(1-clamp((t-44.6)/.5));
const accent=t=>t<3.5?C.blue:t<6?C.red:mix(C.blue,C.red,fallK(t));
const accentHi=t=>t<3.5?C.blueHi:t<6?C.redHi:mix(C.blueHi,C.redHi,fallK(t));

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(0,'whoosh',.8,.8);sfx(.45,'impact');for(let i=0;i<11;i++)sfx(.45+i*.09,'tick',.55,1+i*.03);sfx(1.5,'ding',.9);sfx(3.5,'glass');sfx(3.5,'impact',.6,.7);sfx(3.55,'stamp',.5,.8);
sfx(6.0,'tear');sfx(6.25,'pop',.6);sfx(6.6,'pop',.6,1.15);for(let i=0;i<5;i++)sfx(6.45+i*.08,'clink',.35,1+i*.05);sfx(O[1]+.1,'stamp');sfx(O[2],'whoosh',.6,1.3);sfx(O[2]+.6,'impact',.55,1.2);sfx(O[2]+.65,'psst');
sfx(13.1,'whoosh',.8);sfx(13.2,'pop',.6);sfx(14.7,'ding');sfx(S[0]+.3,'stamp',.8);sfx(S[1],'whoosh',.6);sfx(S[1]+.1,'tank');sfx(S[1]+.8,'stamp',.8,1.1);sfx(S[2],'whoosh',.6,1.2);sfx(S[2]+.05,'heli');sfx(S[2]+.9,'stamp',.8,.95);sfx(16.8,'tick',.5,.9);sfx(20.5,'tick',.5,1.1);
sfx(22.8,'tear');sfx(22.95,'tick',.5,.8);sfx(23.0,'whoosh',.6);sfx(23.35,'impact',.45,1.3);for(let i=0;i<24;i++)sfx(J[1]+.05+i*.07,'pop',.25,1+(i%5)*.06);sfx(26.2,'register');sfx(26.25,'ding',.7,1.2);for(let i=0;i<6;i++)sfx(28.3+i*.25,'flip',.4,1+(i%3)*.1);sfx(29.6,'register',.8);sfx(30.0,'ding',.9,1.3);
sfx(32.5,'whoosh',.7);sfx(32.6,'tick',.5,1.1);sfx(32.9,'pop',.6);sfx(CRASH,'tapestop');sfx(FALL,'glass');sfx(FALL,'impact',.7,.6);sfx(FALL+.05,'tick',.6,.7);
for(let i=0;i<38;i++)sfx(38.6+i*.045,'switch',.35,1+(i%4)*.04);sfx(38.55,'buzz',.5,.8);sfx(40.6,'whoosh',.4);sfx(K[4]+.05,'fire');
sfx(44.7,'tear');sfx(44.9,'pop',.6);sfx(45.0,'whoosh',.5,1.3);sfx(L[1]+.1,'thud',.8);for(let i=0;i<4;i++)sfx(L[1]+.2+i*.12,'thud',.5,1.2+i*.05);sfx(L[2],'whoosh',.7);sfx(L[2]+.55,'impact',.6,1.1);sfx(L[2]+.6,'psst');sfx(L[2]+.7,'shine',.6);
sfx(51.4,'tear');for(let i=0;i<4;i++)sfx(51.6+i*.16,'key',.7,1+(i%3)*.08);sfx(52.9,'stamp');sfx(52.9,'ding',1,1.2);
sfx(55.9,'whoosh',.7,1.3);sfx(56.05,'pop',.6);sfx(56.25,'pop',.6);sfx(56.45,'pop',.6);sfx(58.6,'click');sfx(58.62,'pop',.6,1.3);sfx(59.45,'whoosh',.6,.8);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,
 sfx:SFX,crash:CRASH,fall:FALL,rebuild:44.7,musicBoost:[[22.3,22.9,1.3],[32.0,32.6,1.25]]};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='Anton',color=C.bone,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle=C.bone;ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function jagRect(x,y,w,h,seed,j=5){ctx.beginPath();const st=16;
 for(let i=0;i<=w;i+=st)ctx.lineTo(x+i,y+(rnd(seed+i)-.5)*j);
 for(let i=0;i<=h;i+=st)ctx.lineTo(x+w+(rnd(seed+500+i)-.5)*j,y+i);
 for(let i=w;i>=0;i-=st)ctx.lineTo(x+i,y+h+(rnd(seed+900+i)-.5)*j);
 for(let i=h;i>=0;i-=st)ctx.lineTo(x+(rnd(seed+1300+i)-.5)*j,y+i);ctx.closePath()}
function scrap(x,y,w,h,rot,fill,seed){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=16;ctx.shadowOffsetX=6;ctx.shadowOffsetY=9;jagRect(-w/2,-h/2,w,h,seed);ctx.fillStyle=fill;ctx.fill();ctx.restore()}
function tape(x,y,w,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const h=34;ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);
 for(let i=0;i<=6;i++)ctx.lineTo(w/2+(i%2?-6:0),-h/2+i*h/6);ctx.lineTo(-w/2,h/2);for(let i=6;i>=0;i--)ctx.lineTo(-w/2+(i%2?6:0),-h/2+i*h/6);ctx.closePath();ctx.fillStyle=C.tape;ctx.fill();ctx.restore()}
const STP=document.createElement('canvas');
function stamp(label,x,y,rot,size,k,col){
 if(k<=0)return;const s=lerp(2.3,1,eo(clamp(k*1.5)));
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha*=clamp(k*3);
 ctx.font=`${size}px Bebas`;const tw=ctx.measureText(label).width,w=tw+size*.9,h=size*1.3;
 STP.width=Math.ceil(w+20);STP.height=Math.ceil(h+20);const c=STP.getContext('2d');c.translate(10,10);
 c.strokeStyle=col;c.lineWidth=size*.07;c.beginPath();c.roundRect(0,0,w,h,size*.12);c.stroke();
 c.lineWidth=size*.03;c.beginPath();c.roundRect(size*.12,size*.12,w-size*.24,h-size*.24,size*.08);c.stroke();
 c.fillStyle=col;c.font=`${size}px Bebas`;c.textAlign='center';c.textBaseline='middle';c.fillText(label,w/2,h/2+size*.06);
 c.globalCompositeOperation='destination-out';
 for(let i=0;i<110;i++){c.globalAlpha=.3+.5*rnd(i*3+label.length);c.fillRect(rnd(i*7.1)*w,rnd(i*11.3)*h,2+rnd(i*1.7)*6,2+rnd(i*5.9)*4)}
 c.globalCompositeOperation='source-over';c.globalAlpha=1;
 ctx.drawImage(STP,-w/2-10,-h/2-10);ctx.restore()}
// tachón a mano
function scribble(x0,y0,x1,y1,k,col,lw,seed){if(k<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 const n=7;for(let i=0;i<=n*k;i++){const f=i/n,x=lerp(x0,x1,f)+(rnd(seed+i)-.5)*30,y=lerp(y0,y1,f)+(i%2?-1:1)*40;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore()}

/* ================= LATAS (fotos reales + integración) ================= */
const POOL={};
function pool(k){return POOL[k]||(POOL[k]=document.createElement('canvas'))}
function canRatio(name){const im=IMG[name];return loaded(im)?im.naturalHeight/im.naturalWidth:LATAS[name]}
function placeholderCan(c,w,h,name){ // rectángulo marcado mientras no exista el PNG
 c.fillStyle='#2b2b2b';c.beginPath();c.roundRect(0,0,w,h,w*.1);c.fill();c.setLineDash([10,8]);c.strokeStyle=C.bone;c.lineWidth=3;c.beginPath();c.roundRect(3,3,w-6,h-6,w*.1);c.stroke();
 c.fillStyle=C.bone;c.font=`${w*.12}px Bebas`;c.textAlign='center';c.fillText('['+name+']',w/2,h/2)}
function sprite(name,w,gray,rim,rimCol){
 const im=IMG[name],h=Math.round(w*canRatio(name));w=Math.round(w);const o=pool(name);o.width=w;o.height=h;const c=o.getContext('2d');
 if(loaded(im)){if(gray>0)c.filter=`grayscale(${gray}) brightness(${1-.25*gray}) contrast(${1+.15*gray})`;c.drawImage(im,0,0,w,h);c.filter='none'}else placeholderCan(c,w,h,name);
 c.globalCompositeOperation='source-atop';
 let g=c.createLinearGradient(0,0,w,0);
 g.addColorStop(0,'rgba(255,248,235,.24)');g.addColorStop(.3,'rgba(255,248,235,0)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.38)');c.fillStyle=g;c.fillRect(0,0,w,h);
 g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,248,235,.12)');g.addColorStop(.35,'rgba(255,248,235,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
 // gotas de condensación
 if(gray<.5){c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<40;i++){const r=1+rnd(i*3.3)*2.6;c.beginPath();c.arc(rnd(i*7.7)*w,h*.12+rnd(i*5.1)*h*.8,r,0,TAU);c.fill()}}
 if(rim>0){g=c.createLinearGradient(w*.8,0,w,0);g.addColorStop(0,rgba(rimCol,0));g.addColorStop(1,rgba(rimCol,.8*rim));c.fillStyle=g;c.fillRect(0,0,w,h)}
 c.globalCompositeOperation='source-over';return o}
function silhouette(name,w,h){const o=pool('s_'+name);o.width=w;o.height=h;const c=o.getContext('2d'),im=IMG[name];
 if(loaded(im))c.drawImage(im,0,0,w,h);else{c.beginPath();c.roundRect(0,0,w,h,w*.1);c.fill()}
 c.globalCompositeOperation='source-in';c.fillStyle='#000';c.fillRect(0,0,w,h);return o}
// grieta gráfica sobre la lata (coordenadas locales: base al centro)
function crackLines(w,h,k,seed){if(k<=0)return;const ox=-w*.15,oy=-h*.62;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 for(let b=0;b<6;b++){const a0=rnd(seed+b)*TAU,len=(.35+.5*rnd(seed+b*3))*h*k;let x=ox,y=oy,a=a0;const pts=[[x,y]];
  for(let s=0;s<8;s++){a+=(rnd(seed+b*17+s)-.5)*1.1;x+=Math.cos(a)*len/8;y+=Math.sin(a)*len/8;pts.push([x,y])}
  for(const[col,lw,dx]of[['rgba(0,0,0,.85)',6,0],['rgba(242,237,228,.85)',2,2]]){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();pts.forEach(([px,py],i)=>i?ctx.lineTo(px+dx,py+dx):ctx.moveTo(px+dx,py+dx));ctx.stroke()}}
 ctx.restore()}
function drawCan(name,P){
 const s=P.s??1,w=P.w*s,rim=P.rim??1,rimCol=P.rimCol||C.blue,spr=sprite(name,w,P.gray||0,rim,rimCol),h=spr.height,gy=P.gy??P.y,lift=Math.max(0,gy-P.y);
 ctx.save();ctx.globalAlpha*=P.alpha??1;
 if((P.shadow??1)>0){
