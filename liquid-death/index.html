<!doctype html>
<html lang="es">
<head>

<style>

<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>Liquid Death · caso de estudio · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-con-voz.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2,DEG=Math.PI/180;
const C={bg:'#0A0A0A',bone:'#F2EDE4',red:'#C1121F',redHi:'#E3262F',ink:'#141414',gray:'#8C877F',grayD:'#3B3936',tape:'rgba(222,208,176,.82)'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';
// Fotos reales: se cargan desde assets/latas/<ETIQUETA>.png y assets/avatares/<ETIQUETA>.png (PNG con fondo transparente).
// Si un archivo no existe se dibuja el sustituto gráfico; para reemplazarlo basta con guardar el PNG con ese nombre.
const LATAS=['LATA_AGUA','LATA_SPARKLING','LATA_SABOR','LATA_COLAB_FEASTABLES'];
const AVATARES=['AVATAR_MIKE_CESSARIO','AVATAR_GARY_VEE','AVATAR_MRBEAST'];
const IMG={};
LATAS.forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/latas/${n}.png`});
AVATARES.forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/avatares/${n}.png`});
const loaded=i=>i&&i.complete&&i.naturalWidth>0;

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:4.25,tr:null,pauses:[[3.75,4.25]],vis:'[LATA_AGUA] cae al centro con impacto, sacudida y polvo; detrás explotan rayos rojos y «$1,400,000,000» cuenta rápido. Sello «VALUACIÓN 2024».'},
 {id:'origen',name:'EL ORIGEN (2009)',a:4.25,b:12.0,tr:'tear',vis:'La cinta de tiempo marca 2009. Cartel fotocopiado de un concierto punk genérico con multitud en silueta; [AVATAR_MIKE_CESSARIO] «Mike Cessario · fundador». Un fan levanta una lata de energética genérica, se encierra en rojo («¿AGUA?») y la cámara hace zoom.'},
 {id:'idea',name:'LA IDEA',a:12.0,b:18.6,tr:'slam',vis:'Botella de plástico gris y genérica; un sello rojo «ABURRIDA» la tacha. Entra [LATA_SPARKLING] girando en 2.5D, anillos gráficos la envuelven (mitad detrás, mitad delante), gotas y rayos.'},
 {id:'video',name:'EL VIDEO ANTES DEL PRODUCTO',a:18.6,b:30.1,tr:'tear',vis:'Celular genérico con un video y contador de vistas; silueta punteada «SIN PRODUCTO». «$1,500» y «≈3 MILLONES DE VISTAS» solos en pantalla. La cinta avanza a 2019; billetes salen del celular y construyen [LATA_AGUA] por capas.'},
 {id:'disrup',name:'LA DISRUPCIÓN',a:30.1,b:38.1,tr:'slam',vis:'[LATA_SABOR] cae al centro. Recortes: calavera genérica, «FORMATO CERVEZA», «MATA TU SED» en letras de nota de rescate; un vinilo sale de detrás de la lata, los comentarios de odio se convierten en notas musicales.'},
 {id:'gente',name:'LA GENTE DETRÁS',a:38.1,b:45.1,tr:'tear',vis:'[AVATAR_GARY_VEE] «Gary Vee · inversionista» lanza una moneda dentro de [LATA_AGUA]; la cinta avanza a 2024 y 2026; [AVATAR_MRBEAST] «MrBeast · colaboración Feastables» y entre ambos [LATA_COLAB_FEASTABLES] con brillo.'},
 {id:'leccion',name:'LA LECCIÓN',a:45.1,b:51.45,tr:'slide',vis:'Sello «LA LECCIÓN». Fila de latas grises idénticas; [LATA_AGUA] da un paso al frente y recupera el color; «IDENTIDAD» enorme en rojo pasa por detrás de ella.'},
 {id:'cta',name:'CTA CON PALABRA CLAVE',a:51.45,b:60,tr:'tear',vis:'Burbuja de comentario que escribe «DISRUPTIVO» → la palabra sola y grande 3 s → logo, «ATLAS PATH», @Atlas_Path y botón SEGUIR con clic. Texto pequeño «Caso de estudio. Sin afiliación con la marca.» → regresa a la lata cayendo (loop).'},
];
// cada bloque dura al menos 1.5 s y va a ≤2.25 pal/s; el tiempo sobrante se reparte en proporción
function alloc(a,b,blocks){
 const base=blocks.map(x=>Math.max(1.5,x[0].split(/\s+/).length/2.25)),tot=base.reduce((s,v)=>s+v,0),k=(b-a)/tot;
 if(k<1)console.log('ALLOC no cabe: '+blocks[0][0]);let t=a;
 return blocks.map((x,i)=>{const d=base[i]*k,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const SUBS_RAW=[
 [0.0,1.75,'Esta marca vende agua…',['agua']],
 ...alloc(4.25,11.5,[['En 2009, su fundador',['fundador']],['vio en un concierto',['concierto']],['gente tomando agua',['agua']],['en latas de energética.',['energética']]]),
 ...alloc(12.0,18.1,[['Y pensó: ¿y si',['pensó']],['el agua fuera tan rebelde',['rebelde']],['como una energética?',['energética']]]),
 [18.6,20.35,'Antes de tener producto,',['producto']],
 [20.35,22.1,'gastó en un video:',['video']],
 [26.1,27.85,'y levantó 1.6 millones',['millones']],
 [27.85,29.6,'para fabricar sus latas.',['latas']],
 ...alloc(30.1,37.6,[['Calaveras, lata de cerveza',['calaveras']],['lema: «Mata tu sed».',['mata','sed']],['Hasta grabaron un disco',['disco']],['con comentarios de odio.',['odio']]]),
 ...alloc(38.1,44.6,[['Gary Vee también invirtió.',['invirtió']],['Y este año, MrBeast',['mrbeast']],['lanzó un sabor con ellos.',['sabor']]]),
 ...alloc(45.1,50.95,[['Si tu categoría aburre,',['aburre']],['no compitas en producto.',['producto']],['Compite en identidad.',['identidad']]]),
 [51.45,52.95,'Comenta la palabra…',['comenta']],
 [55.95,57.7,'y creamos tu estrategia.',['estrategia']],
 [57.7,59.45,'Síguenos en Atlas Path.',['síguenos']],
];
const HOLDS=[{a:1.75,b:3.75,text:'$1,400,000,000'},{a:22.1,b:24.1,text:'$1,500'},{a:24.1,b:26.1,text:'≈3 MILLONES DE VISTAS'},{a:52.95,b:55.95,text:'DISRUPTIVO'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const BS=id=>{const sc=SCENES.find(s=>s.id===id);return SUBS.filter(s=>s.a>=sc.a-1e-6&&s.a<sc.b).map(s=>s.a)};
const O=BS('origen'),I=BS('idea'),D=BS('disrup'),G=BS('gente'),L=BS('leccion');

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(0,'whoosh',.8,.8);sfx(.45,'impact');for(let i=0;i<12;i++)sfx(.55+i*.09,'tick',.6,1+i*.03);sfx(1.75,'ding',.9);sfx(1.8,'stamp',.6);
sfx(4.25,'tear');sfx(4.4,'whoosh',.6);sfx(5.0,'pop',.6);sfx(O[1],'whoosh',.4,1.3);sfx(O[2]+.05,'pop',.6,1.2);sfx(O[2]+.3,'marker');sfx(O[3],'whoosh',.6,.8);
sfx(12.0,'whoosh',.8);sfx(12.1,'thud',.7);sfx(12.95,'stamp');sfx(I[1],'whoosh',.6,1.3);sfx(I[1]+.15,'spin');sfx(15.2,'psst');sfx(15.25,'shine',.6);sfx(I[2]+.05,'pop',.6);sfx(I[2]+.3,'pop',.6,1.3);
sfx(18.6,'tear');sfx(18.8,'pop',.6);sfx(19.1,'pop',.5,1.3);sfx(20.45,'click');sfx(22.1,'ding');sfx(22.12,'stamp',.6);sfx(24.1,'ding',1,1.2);for(let i=0;i<8;i++)sfx(24.1+i*.1,'tick',.5,1.2+i*.04);
sfx(26.1,'whoosh',.6);sfx(26.2,'tick',.6,.9);for(let i=0;i<14;i++)sfx(26.3+i*.12,'flip',.45,1+(i%3)*.1);sfx(28.45,'psst');sfx(28.5,'shine',.6);
sfx(30.1,'whoosh',.8);sfx(30.55,'impact',.9);sfx(D[0]+.2,'pop',.6);sfx(D[0]+.9,'pop',.6,1.2);for(let i=0;i<9;i++)sfx(D[1]+.05+i*.07+(i>3?.07:0)+(i>5?.07:0),'stamp',.22,1.4);
sfx(D[2],'scratch');sfx(D[3],'pop',.6);sfx(D[3]+.25,'pop',.6,1.15);sfx(D[3]+.5,'pop',.6,1.3);sfx(D[3]+.9,'whoosh',.5,1.4);sfx(D[3]+1.0,'rise',.6);
sfx(38.1,'tear');sfx(38.3,'pop',.6);sfx(38.35,'tick',.6,.9);sfx(38.9,'whoosh',.5,1.4);sfx(39.6,'coin');sfx(40.3,'pop',.6,1.1);sfx(40.35,'tick',.6,1.1);sfx(G[2],'whoosh',.7);sfx(G[2]+.35,'shine',.8);
sfx(45.1,'whoosh',.6);sfx(45.25,'stamp');for(let i=0;i<5;i++)sfx(45.5+i*.08,'clink',.35,1+i*.05);sfx(L[1],'whoosh',.6,.9);sfx(L[1]+.1,'psst',.7);sfx(L[2],'whoosh',.9,.7);sfx(L[2]+.6,'impact',.5);
sfx(51.45,'tear');for(let i=0;i<10;i++)sfx(51.65+i*.09,'key',.7,1+(i%3)*.08);sfx(52.95,'stamp');sfx(52.95,'ding',1,1.2);
sfx(55.95,'whoosh',.7,1.3);sfx(56.1,'pop',.6);sfx(56.3,'pop',.6);sfx(56.5,'pop',.6);sfx(58.6,'click');sfx(58.62,'pop',.6,1.3);sfx(59.45,'whoosh',.6,.8);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,
 sfx:SFX,musicBoost:[[3.8,4.3,1.3],[29.6,30.2,1.3],[44.6,45.2,1.3]]};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='Anton',color=C.bone,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle=C.bone;ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
// papel recortado con orillas irregulares
function jagRect(x,y,w,h,seed,j=5){ctx.beginPath();const st=16;
 for(let i=0;i<=w;i+=st)ctx.lineTo(x+i,y+(rnd(seed+i)-.5)*j);
 for(let i=0;i<=h;i+=st)ctx.lineTo(x+w+(rnd(seed+500+i)-.5)*j,y+i);
 for(let i=w;i>=0;i-=st)ctx.lineTo(x+i,y+h+(rnd(seed+900+i)-.5)*j);
 for(let i=h;i>=0;i-=st)ctx.lineTo(x+(rnd(seed+1300+i)-.5)*j,y+i);ctx.closePath()}
function scrap(x,y,w,h,rot,fill,seed){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=16;ctx.shadowOffsetX=6;ctx.shadowOffsetY=9;jagRect(-w/2,-h/2,w,h,seed);ctx.fillStyle=fill;ctx.fill();ctx.restore()}
function tape(x,y,w,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const h=34;ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);
 for(let i=0;i<=6;i++)ctx.lineTo(w/2+(i%2?-6:0),-h/2+i*h/6);ctx.lineTo(-w/2,h/2);for(let i=6;i>=0;i--)ctx.lineTo(-w/2+(i%2?6:0),-h/2+i*h/6);ctx.closePath();ctx.fillStyle=C.tape;ctx.fill();ctx.restore()}
// sello de goma con tinta irregular; k = progreso del golpe
const STP=document.createElement('canvas');
function stamp(label,x,y,rot,size,k,col=C.red){
 if(k<=0)return;const s=lerp(2.3,1,eo(clamp(k*1.5)));
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha*=clamp(k*3);
 ctx.font=`${size}px Bebas`;const tw=ctx.measureText(label).width,w=tw+size*.9,h=size*1.3;
 STP.width=Math.ceil(w+20);STP.height=Math.ceil(h+20);const c=STP.getContext('2d');c.translate(10,10);
 c.strokeStyle=col;c.lineWidth=size*.07;c.beginPath();c.roundRect(0,0,w,h,size*.12);c.stroke();
 c.lineWidth=size*.03;c.beginPath();c.roundRect(size*.12,size*.12,w-size*.24,h-size*.24,size*.08);c.stroke();
 c.fillStyle=col;c.font=`${size}px Bebas`;c.textAlign='center';c.textBaseline='middle';c.fillText(label,w/2,h/2+size*.06);
 c.globalCompositeOperation='destination-out';
 for(let i=0;i<110;i++){c.globalAlpha=.3+.5*rnd(i*3+label.length);c.fillRect(rnd(i*7.1)*w,rnd(i*11.3)*h,2+rnd(i*1.7)*6,2+rnd(i*5.9)*4)}
 c.globalCompositeOperation='source-over';c.globalAlpha=1;
 ctx.drawImage(STP,-w/2-10,-h/2-10);ctx.restore()}

/* ================= LATAS (fotos reales + integración) ================= */
const POOL={};
function pool(k){return POOL[k]||(POOL[k]=document.createElement('canvas'))}
function placeholderCan(c,w,h){ // sustituto genérico mientras no exista el PNG (sin texto ni marca)
 let g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'#2a170b');g.addColorStop(.35,'#7a4a26');g.addColorStop(.6,'#5a3519');g.addColorStop(1,'#1f1209');
 c.fillStyle=g;c.beginPath();c.roundRect(0,h*.035,w,h*.93,w*.1);c.fill();
 const m=c.createLinearGradient(0,0,w,0);m.addColorStop(0,'#77746f');m.addColorStop(.4,'#e9e6df');m.addColorStop(1,'#5d5a55');
 c.fillStyle=m;c.beginPath();c.roundRect(w*.05,0,w*.9,h*.05,w*.05);c.fill();c.beginPath();c.roundRect(w*.07,h*.95,w*.86,h*.05,w*.05);c.fill();
 c.fillStyle=C.bone;c.fillRect(0,h*.38,w,h*.24);c.fillStyle=C.red;c.fillRect(0,h*.36,w,h*.022);c.fillRect(0,h*.618,w,h*.022);
 // copa de chocolate genérica
 c.save();c.translate(w/2,h*.5);c.fillStyle='#E0791F';c.beginPath();c.moveTo(-w*.3,-h*.035);c.lineTo(w*.3,-h*.035);c.lineTo(w*.22,h*.07);c.lineTo(-w*.22,h*.07);c.closePath();c.fill();
 c.strokeStyle='#9b4f12';c.lineWidth=3;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*w*.085,-h*.035);c.lineTo(i*w*.064,h*.07);c.stroke()}
 c.fillStyle='#4a2a14';c.beginPath();c.ellipse(0,-h*.035,w*.3,h*.03,0,Math.PI,TAU);c.fill();c.restore();
 g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.3,'rgba(255,255,255,.25)');g.addColorStop(.38,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h)}
function canRatio(name){const im=IMG[name];return loaded(im)?im.naturalHeight/im.naturalWidth:2.6}
function sprite(name,w,gray,rim){
 const im=IMG[name],h=Math.round(w*canRatio(name));w=Math.round(w);const o=pool(name);o.width=w;o.height=h;const c=o.getContext('2d');
 if(loaded(im)){if(gray>0)c.filter=`grayscale(${gray}) brightness(${1-.3*gray}) contrast(${1-.25*gray})`;c.drawImage(im,0,0,w,h);c.filter='none'}else placeholderCan(c,w,h);
 c.globalCompositeOperation='source-atop';
 let g=c.createLinearGradient(0,0,w,0); // luz principal arriba a la izquierda
 g.addColorStop(0,'rgba(255,248,235,.24)');g.addColorStop(.3,'rgba(255,248,235,0)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.38)');c.fillStyle=g;c.fillRect(0,0,w,h);
 g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,248,235,.12)');g.addColorStop(.35,'rgba(255,248,235,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
 if(rim>0){g=c.createLinearGradient(w*.8,0,w,0);g.addColorStop(0,'rgba(193,18,31,0)');g.addColorStop(1,`rgba(230,32,42,${.8*rim})`);c.fillStyle=g;c.fillRect(0,0,w,h)}
 c.globalCompositeOperation='source-over';return o}
function silhouette(name,w,h){const o=pool('s_'+name);o.width=w;o.height=h;const c=o.getContext('2d'),im=IMG[name];
 if(loaded(im))c.drawImage(im,0,0,w,h);else{c.beginPath();c.roundRect(0,0,w,h,w*.1);c.fill()}
 c.globalCompositeOperation='source-in';c.fillStyle='#000';c.fillRect(0,0,w,h);return o}
// P: x, y (base de la lata), w, rot, s, sx (giro 2.5D), gray, rim, alpha, gy (piso para la sombra), shadow, glow, reveal (0..1 de abajo hacia arriba)
function drawCan(name,P){
 const s=P.s??1,w=P.w*s,rim=P.rim??1,spr=sprite(name,w,P.gray||0,rim),h=spr.height,gy=P.gy??P.y,lift=Math.max(0,gy-P.y);
 ctx.save();ctx.globalAlpha*=P.alpha??1;
 if((P.shadow??1)>0){
  const sk=clamp(1-lift/800)*(P.shadow??1),rv=P.reveal??1;
  ctx.save();ctx.translate(P.x+6,gy);ctx.scale(1,.2);const r=w*.8*(1+lift/700);
  const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,`rgba(0,0,0,${.85*sk})`);g.addColorStop(.6,`rgba(0,0,0,${.4*sk})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();ctx.restore();

 {const ko=1-eo(p(t,L[2],L[2]+.3));if(ko>0){ctx.save();ctx.globalAlpha*=ko;stamp('LA LECCIÓN',CX,410,-4*DEG,84,p(t,45.25,45.55));ctx.restore()}}

 const kb=pop(t,56.45,.35),clicked=t>=58.6,press=1-.08*Math.sin(Math.PI*p(t,58.55,58.75));

 const rk=p(t,58.6,59.1);if(rk>0&&rk<1){ctx.beginPath();ctx.arc(CX+70,1095,30+rk*110,0,TAU);ctx.strokeStyle=`rgba(193,18,31,${1-rk})`;ctx.lineWidth=8;ctx.stroke()}
 const mk=eio(p(t,57.9,58.5));if(t>57.9)cursorArrow(lerp(900,CX+70,mk),lerp(1310,1095,mk),t>=58.55&&t<58.75?.88:1);

/* ================= COMPOSICIÓN ================= */
const DRAW=[sHook,sOrigin,sIdea,sVideo,sDisrupt,sPeople,sLesson,sCta];
function sceneAt(t){let i=0;SCENES.forEach((s,j)=>{if(t>=s.a)i=j});return i}
function tearPts(k){const pts=[];for(let y=-40;y<=H+40;y+=24)pts.push([-260+k*(W+560)+(y-H/2)*.2+(rnd(y*.37)-.5)*28,y]);return pts}
function renderFrame(t){
 bg(t);const i=sceneAt(t),sc=SCENES[i],TD=.45,a=sc.a,sh=shake(t);
 ctx.save();ctx.translate(sh[0],sh[1]);
 if(sc.tr&&t<a+TD){const k=eo(p(t,a,a+TD)),tp=a-1e-3;
  if(sc.tr==='tear'){DRAW[i-1](tp);const pts=tearPts(k);ctx.save();ctx.beginPath();ctx.moveTo(-60,-40);pts.forEach(([x,y])=>ctx.lineTo(x,y));ctx.lineTo(-60,H+40);ctx.closePath();ctx.clip();bg(t);DRAW[i](t);ctx.restore();
   ctx.beginPath();pts.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineJoin='round';ctx.strokeStyle=C.bone;ctx.lineWidth=18;ctx.stroke();ctx.strokeStyle=C.red;ctx.lineWidth=4;ctx.stroke()}
  else if(sc.tr==='slam'){ctx.save();ctx.globalAlpha=1-k;ctx.translate(CX,900);ctx.scale(1+.25*k,1+.25*k);ctx.translate(-CX,-900);DRAW[i-1](tp);ctx.restore();
   ctx.save();ctx.globalAlpha=k;DRAW[i](t);ctx.restore();ctx.fillStyle=`rgba(193,18,31,${.25*(1-k)})`;ctx.fillRect(0,0,W,H)}
  else{ctx.save();ctx.translate(-W*k,0);DRAW[i-1](tp);ctx.restore();ctx.save();ctx.translate(W*(1-k),0);DRAW[i](t);ctx.restore()}}
 else DRAW[i](t);
 ctx.restore();
 drawTape(t);
 // loop: el último medio segundo regresa a la lata cayendo del primer cuadro
 if(t>59.45){ctx.save();ctx.globalAlpha=eio(p(t,59.45,60));bg(0);sHook(0);ctx.restore()}
 post(t);subs(t);hud(t);
}

/* ================= REPRODUCCIÓN ================= */
window.renderFrame=renderFrame;
const imgReady=im=>new Promise(r=>{if(im.complete)r();else{im.onload=r;im.onerror=r}});

const RENDER=new URLSearchParams(location.search).has('render');
const ui=document.getElementById('ui'),aud=document.getElementById('aud');
if(RENDER){ui.classList.add('hide');document.body.style.background=C.bg}
else{
 let playing=false,t0=0,useAudio=true;
 aud.addEventListener('error',()=>useAudio=false);
 const now=()=>useAudio&&!isNaN(aud.duration)?aud.currentTime:(performance.now()-t0)/1000;
 function loop(){if(!playing)return;let t=now();if(t>=DUR){if(useAudio){aud.currentTime=0;aud.play()}else t0=performance.now();t=0}renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)}
 function start(){ui.classList.add('hide');playing=true;t0=performance.now();aud.currentTime=0;aud.play().catch(()=>useAudio=false);loop()}
 ui.addEventListener('click',start);
 addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
