function buildSharp(name){const im=IMG[name],ok=loaded(im),w=ok?im.naturalWidth:1200,h=ok?im.naturalHeight:900,[o,c]=mkCanvas(w,h);

function buildBG(name,{blur=8,dark=.4,vig=.6}={}){const[o,c]=mkCanvas(BW,BH),im=IMG[name],ok=loaded(im);
