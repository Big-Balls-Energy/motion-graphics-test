<body>

<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=545,DUR=60,TAU=Math.PI*2,DEG=Math.PI/180;
const C={bg:'#121212',bone:'#F5EFE6',red:'#EF4444',green:'#22C55E',yellow:'#FACC15',ink:'#161616',gray:'#9A948C'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';
// Fotos: assets/fotos/<NOMBRE EXACTO>. Si un archivo falta se dibuja un sustituto gráfico; al guardar la foto con ese nombre se usa sola.

 F10_parque_diversiones:{fx:.5,fy:.5},F11_resort:{fx:.5,fy:.5},F12_pago_celular:{fx:.5,fy:.5},F14_mostrador_negocio:{fx:.5,fy:.5}};
const RECORTES={F01_fichas_casino:.83,F03_billetes_mano:1.67,F04_tarjeta:.63,F08_boletos:.71,F09_pulsera_acceso:.74,F13_terminal_pago:1.7}; // alto/ancho si falta el archivo
const AVATARES=['AVATAR_DRAZEN_PRELEC','AVATAR_DUNCAN_SIMESTER'];
const IMG={};
Object.keys(FONDOS).forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/fotos/${n}.jpg`});
Object.keys(RECORTES).forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/fotos/${n}.png`});
AVATARES.forEach(n=>{IMG[n]=new Image();IMG[n].src=`assets/avatares/${n}.png`});
const loaded=i=>i&&i.complete&&i.naturalWidth>0;
const GRADE='contrast(.95) saturate(.8) sepia(.14)'; // gradación común: contraste medio, cálido, algo desaturado

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('')};
const rgba=(h,a)=>`rgba(${hex(h).join(',')},${a})`;

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:5.6,tr:null,vis:'Fondo F02_mesa_casino.jpg desenfocado; F01_fichas_casino.png cae al centro en cámara lenta con sombra real y rebote; un «?» gráfico gira encima. Sacudida al caer.'},
 {id:'giro',name:'GIRO',a:5.6,b:11.5,tr:'wipe',vis:'F03_billetes_mano.png entra desde abajo; al llegar al centro salen líneas rojas de impacto y el medidor de dolor sube a rojo. «EL DOLOR DE PAGAR» entra grande y pasa por detrás de la mano.'},
 {id:'cerebro',name:'QUÉ PASA EN TU CEREBRO',a:11.5,b:21.5,tr:'zoom',vis:'Fondo F05_escaner_cerebro.jpg: una etiqueta de precio alto y una zona que se ilumina en rojo con pulso («ínsula»). Transición a F06_persona_ticket.jpg con un ticket gráfico que se alarga hacia abajo.'},
 {id:'experimento',name:'EL EXPERIMENTO',a:21.5,b:32.3,tr:'slide',vis:'Fondo F07_arena_basquet.jpg; F08_boletos.png flota al centro con sello «SUBASTA»; [AVATAR_DRAZEN_PRELEC] y [AVATAR_DUNCAN_SIMESTER] con etiqueta MIT. Pantalla dividida: efectivo (F03) con barra corta y tarjeta (F04) con barra que crece hasta «x2» en amarillo.'},
 {id:'donde',name:'DÓNDE LO VES',a:32.3,b:41.6,tr:'slide',vis:'Carrusel con parallax: fichas sobre la mesa (F02 + F01), parque (F10) con la pulsera F09, resort (F11) con sello «TODO INCLUIDO» y pago con celular (F12) con ondas sin contacto. En cada uno el medidor baja a verde.'},
 {id:'aplicacion',name:'APLICACIÓN',a:41.6,b:49.9,tr:'wipe',vis:'Fondo F14_mostrador_negocio.jpg; F13_terminal_pago.png al centro; etiquetas verdes «PAQUETES», «MEMBRESÍAS», «SIN FRICCIÓN» y un ícono de balanza al decir «con ética».'},
 {id:'cta',name:'CTA CON PALABRA CLAVE',a:49.9,b:60,tr:'wipe',vis:'Burbuja que escribe «DOLOR» en rojo → «DOLOR» sola y grande 3 s → el medidor baja a verde → logo, «ATLAS PATH», @Atlas_Path y botón SEGUIR con clic → regresa a las fichas cayendo sobre la mesa (loop).'},
];
function alloc(a,b,blocks){
 const base=blocks.map(x=>Math.max(1.5,x[0].split(/\s+/).length/2.25)),tot=base.reduce((s,v)=>s+v,0),k=(b-a)/tot;
 if(k<1)console.log('ALLOC no cabe: '+blocks[0][0]);let t=a;
 return blocks.map((x,i)=>{const d=base[i]*k,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const SUBS_RAW=[
 ...alloc(0,5.1,[['¿Por qué los casinos',['casinos']],['cambian tu dinero',['dinero']],['por fichas de plástico?',['fichas']]]),
 ...alloc(5.6,11.0,[['Porque pagar duele.',['duele']],['Literalmente. Se llama:',['literalmente']],['el dolor de pagar.',['dolor']]]),
 ...alloc(11.5,21.0,[['Ver un precio alto',['precio']],['activa en tu cerebro',['cerebro']],['una zona de malestar.',['malestar']],['Y entre más ves',['ves']],['salir tu dinero, más duele.',['duele']]]),
 ...alloc(21.5,27.3,[['Un experimento del MIT',['mit']],['subastó boletos de basquetbol.',['boletos']],['Quienes pagarían con tarjeta',['tarjeta']]]),
 [29.6,31.8,'que quienes pagaban en efectivo.',['efectivo']],
 ...alloc(32.3,41.1,[['Por eso existen las fichas,',['fichas']],['las pulseras con saldo,',['pulseras']],['el todo incluido',['incluido']],['y pagar con un toque.',['toque']]]),
 ...alloc(41.6,49.4,[['¿Tienes un negocio?',['negocio']],['Haz que pagar sea ligero:',['ligero']],['paquetes, membresías, sin fricción.',['fricción']],['Y úsalo con ética.',['ética']]]),
 [49.9,51.4,'Comenta la palabra…',['comenta']],
 [54.4,56.2,'Te enviamos 5 formas',['5']],
 [56.2,57.7,'para quitar fricción.',['fricción']],
 [57.7,59.45,'Síguenos en Atlas Path.',['síguenos']],
];
// color de la palabra clave: rojo cuando el pago duele, verde cuando se siente ligero
const KEYCOL={duele:C.red,dolor:C.red,malestar:C.red,precio:C.red,efectivo:C.red,ves:C.red,dinero:C.red,comenta:C.red,
 tarjeta:C.green,fichas:C.green,pulseras:C.green,incluido:C.green,toque:C.green,ligero:C.green,fricción:C.green,'5':C.yellow,síguenos:C.green,ética:C.bone};
const HOLDS=[{a:27.3,b:29.6,text:'x2'},{a:51.4,b:54.4,text:'DOLOR'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];const n=norm(w);return{w,key:keys.includes(n),col:KEYCOL[n]||C.yellow,t0}});
 return{a,b,text,keys,words};
});
const BS=id=>{const sc=SCENES.find(s=>s.id===id);return SUBS.filter(s=>s.a>=sc.a-1e-6&&s.a<sc.b).map(s=>s.a)};
const G=BS('giro'),B=BS('cerebro'),E=BS('experimento'),D=BS('donde'),A=BS('aplicacion');
// medidor de dolor (0 = alivio verde, 1 = dolor rojo)
const PAIN=[[0,.3],[1.0,.45],[5.6,.42],[6.3,.42],[6.75,.92],[11.5,.85],[13.4,.9],[14.0,1],[16.9,.9],[18.8,1],[21.5,.75],[25.4,.75],[26.3,.22],[29.6,.22],[29.9,.8],[31.8,.8],
 [D[0]+.6,.18],[D[1],.5],[D[1]+.6,.16],[D[2],.5],[D[2]+.6,.14],[D[3],.5],[D[3]+.6,.12],[41.6,.15],[49.9,.15],[51.4,.97],[54.4,.97],[55.0,.1],[60,.1]];
function pain(t){for(let i=0;i<PAIN.length-1;i++){const[a,va]=PAIN[i],[b,vb]=PAIN[i+1];if(t<=b)return lerp(va,vb,eio(p(t,a,b)))}return PAIN[PAIN.length-1][1]}
const BEATS=[];for(let i=0;i<PAIN.length-1;i++){const[a,va]=PAIN[i],[b,vb]=PAIN[i+1];if(vb-va>.3)BEATS.push(a+(b-a)*.5)}

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(0,'whoosh',.7,.7);sfx(1.0,'chips');sfx(1.0,'thud',.8,.8);sfx(1.35,'chips',.5,1.15);sfx(1.6,'chips',.3,1.3);sfx(2.0,'whoosh',.4,1.4);
BEATS.forEach(b=>{sfx(b,'heart',.9);sfx(b+.75,'heart',.7)});
sfx(5.6,'whoosh',.7);sfx(6.75,'impact');sfx(G[2],'whoosh',.8,.8);sfx(G[2]+.2,'thud',.6,1.1);
sfx(11.5,'whoosh',.6);sfx(11.7,'pop',.6);sfx(B[1]+.1,'pulse',.8);sfx(B[3],'whoosh',.6,1.2);sfx(B[3]+.3,'printer');sfx(B[4],'register',.7);
sfx(21.5,'whoosh',.7);sfx(21.7,'pop',.5);sfx(22.1,'pop',.6);sfx(22.5,'pop',.6,1.15);sfx(E[1]+.2,'stamp',.8);sfx(E[2],'whoosh',.6);sfx(E[2]+.3,'register',.6);sfx(25.9,'rise',.7);
sfx(27.3,'ding');sfx(27.32,'pop',.6,1.3);sfx(29.6,'whoosh',.4);
sfx(32.3,'whoosh',.7);sfx(32.6,'chips',.5);for(let i=1;i<4;i++){sfx(D[i],'whoosh',.6,1+i*.1);sfx(D[i]+.6,'relief',.6)}sfx(D[0]+.6,'relief',.6);sfx(D[2]+.3,'stamp',.8);sfx(D[3]+.35,'beep');
sfx(41.6,'whoosh',.6);sfx(41.9,'pop',.6);sfx(A[1]+.3,'beep',.8,1.1);for(let i=0;i<3;i++)sfx(A[2]+.05+i*.45,'pop',.6,1+i*.1);sfx(A[3]+.15,'ding',.6,.9);
sfx(49.9,'whoosh',.6);for(let i=0;i<5;i++)sfx(50.05+i*.15,'key',.7,1+(i%3)*.08);sfx(51.4,'stamp');sfx(51.4,'ding',1,1.2);sfx(54.4,'relief',.8);for(let i=0;i<5;i++)sfx(54.8+i*.12,'pop',.4,1.2+i*.06);
sfx(55.9,'whoosh',.7,1.3);sfx(56.05,'pop',.6);sfx(56.25,'pop',.6);sfx(56.45,'pop',.6);sfx(58.6,'click');sfx(58.62,'pop',.6,1.3);sfx(59.45,'whoosh',.6,.8);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,sfx:SFX,
 musicBoost:[[5.1,5.7,1.3],[21.0,21.6,1.25],[41.1,41.7,1.25]]};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.bone,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle=C.bone;ctx.fill();ctx.strokeStyle=C.bg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function pill(label,x,y,k,col,size=40,fg=C.bg){if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.font=`${size}px MBlack`;const w=ctx.measureText(label).width+size*1.4;
 ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetX=6;ctx.shadowOffsetY=8;rr(-w/2,-size*.85,w,size*1.7,size*.85);ctx.fillStyle=col;ctx.fill();ctx.shadowColor='transparent';
 text(label,0,size*.05,size,'MBlack',fg);ctx.restore()}
// sello de goma con tinta irregular
const STP=document.createElement('canvas');
function stamp(label,x,y,rot,size,k,col){
 if(k<=0)return;const s=lerp(2.3,1,eo(clamp(k*1.5)));
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha*=clamp(k*3);
 ctx.font=`${size}px MBlack`;const tw=ctx.measureText(label).width,w=tw+size*.9,h=size*1.4;
 STP.width=Math.ceil(w+20);STP.height=Math.ceil(h+20);const c=STP.getContext('2d');c.translate(10,10);
 c.strokeStyle=col;c.lineWidth=size*.08;c.beginPath();c.roundRect(0,0,w,h,size*.14);c.stroke();
 c.fillStyle=col;c.font=`${size}px MBlack`;c.textAlign='center';c.textBaseline='middle';c.fillText(label,w/2,h/2+size*.04);
 c.globalCompositeOperation='destination-out';for(let i=0;i<120;i++){c.globalAlpha=.3+.5*rnd(i*3+label.length);c.fillRect(rnd(i*7.1)*w,rnd(i*11.3)*h,2+rnd(i*1.7)*6,2+rnd(i*5.9)*4)}
 c.globalCompositeOperation='source-over';c.globalAlpha=1;ctx.drawImage(STP,-w/2-10,-h/2-10);ctx.restore()}

/* ================= FONDOS (foto desenfocada y oscurecida, con parallax) ================= */
const BGC={},BW=1296,BH=2304;
function illus(name,c){ // sustitutos gráficos para fondos que faltan (mismo nombre de archivo para reemplazarlos)
 const w=BW,h=BH;let g;
 if(name==='F10_parque_diversiones'){g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1d1533');g.addColorStop(.55,'#7a3b52');g.addColorStop(.75,'#e08a3c');g.addColorStop(1,'#2a1d1a');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.strokeStyle='#120c16';c.fillStyle='#120c16';c.lineWidth=14;const cx=w*.62,cy=h*.5,r=w*.36;c.beginPath();c.arc(cx,cy,r,0,TAU);c.stroke();for(let i=0;i<16;i++){const a=i*TAU/16;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);c.stroke();c.beginPath();c.roundRect(cx+Math.cos(a)*r-26,cy+Math.sin(a)*r,52,44,8);c.fill()}
  c.lineWidth=26;c.beginPath();c.moveTo(cx-140,h*.85);c.lineTo(cx,cy);c.lineTo(cx+140,h*.85);c.stroke();
  c.lineWidth=18;c.beginPath();c.moveTo(0,h*.7);c.bezierCurveTo(w*.15,h*.5,w*.3,h*.85,w*.45,h*.66);c.stroke();for(let i=0;i<12;i++){c.fillRect(i*w*.04,h*.7+Math.sin(i)*80,10,h*.3)}
  for(let i=0;i<80;i++){c.fillStyle=`rgba(255,${180+rnd(i)*60|0},120,${.5+rnd(i*3)*.5})`;c.beginPath();c.arc(rnd(i*7)*w,h*.55+rnd(i*9)*h*.3,4+rnd(i*5)*8,0,TAU);c.fill()}
  c.fillStyle='#140d10';c.fillRect(0,h*.86,w,h*.14)}
 if(name==='F11_resort'){g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0f3a4a');g.addColorStop(.42,'#e6a15a');g.addColorStop(.5,'#f2c27b');g.addColorStop(.52,'#1f6f86');g.addColorStop(.75,'#145466');g.addColorStop(1,'#0b2730');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,230,170,.9)';c.beginPath();c.arc(w*.5,h*.47,120,0,TAU);c.fill();
  c.fillStyle='#2dd4bf';c.globalAlpha=.6;c.beginPath();c.roundRect(w*.1,h*.68,w*.8,h*.12,40);c.fill();c.globalAlpha=1;
  for(const[px,ph,lean]of[[w*.12,h*.42,-.2],[w*.86,h*.38,.25],[w*.72,h*.3,.1]]){c.strokeStyle='#0a1a1f';c.lineWidth=26;c.beginPath();c.moveTo(px,h*.82);c.quadraticCurveTo(px+lean*300,h*.6,px+lean*200,ph);c.stroke();c.fillStyle='#0a1a1f';
   for(let i=0;i<7;i++){const a=i*TAU/7;c.beginPath();c.ellipse(px+lean*200+Math.cos(a)*140,ph+Math.sin(a)*50,150,30,a,0,TAU);c.fill()}}
  c.fillStyle='#e8d9c2';for(let i=0;i<3;i++){c.beginPath();c.roundRect(w*.2+i*w*.22,h*.86,w*.16,40,10);c.fill()}}
 if(name==='F12_pago_celular'){g=c.createRadialGradient(w*.5,h*.45,50,w*.5,h*.45,h*.7);g.addColorStop(0,'#5a3a2a');g.addColorStop(1,'#120c0a');c.fillStyle=g;c.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){c.fillStyle=`rgba(255,${170+rnd(i)*70|0},110,${.25+rnd(i*3)*.4})`;c.beginPath();c.arc(rnd(i*7)*w,rnd(i*9)*h*.7,20+rnd(i*5)*60,0,TAU);c.fill()}
  c.fillStyle='#111';c.beginPath();c.roundRect(w*.44,h*.38,300,560,50);c.fill();
  c.fillStyle='#1f8f5a';c.beginPath();c.roundRect(w*.455,h*.395,270,500,36);c.fill();  c.fillStyle='#2b2b2b';c.beginPath();c.roundRect(w*.62,h*.3,260,360,30);c.fill()}
 c.fillStyle='rgba(0,0,0,.15)';c.fillRect(0,0,w,h)}
function buildBG(name){const o=document.createElement('canvas');o.width=BW;o.height=BH;const c=o.getContext('2d'),im=IMG[name],f=FONDOS[name];
 let src=im;if(!loaded(im)){src=document.createElement('canvas');src.width=BW;src.height=BH;illus(name,src.getContext('2d'))}
 const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,s=Math.max(BW/sw,BH/sh),dw=sw*s,dh=sh*s;

/* ================= REPRODUCCIÓN ================= */
window.renderFrame=renderFrame;
const imgReady=im=>new Promise(r=>{if(im.complete)r();else{im.onload=r;im.onerror=r}});
window.ready=Promise.all([...['MBlack','MXB','MSemi'].map(f=>document.fonts.load(`100px ${f}`)),imgReady(logo),...Object.values(IMG).map(imgReady)]).then(()=>Object.keys(FONDOS).forEach(buildBG));
const RENDER=new URLSearchParams(location.search).has('render');
const ui=document.getElementById('ui'),aud=document.getElementById('aud');
if(RENDER){ui.classList.add('hide');document.body.style.background=C.bg}
else{
 let playing=false,t0=0,useAudio=true;
 aud.addEventListener('error',()=>useAudio=false);
 const now=()=>useAudio&&!isNaN(aud.duration)?aud.currentTime:(performance.now()-t0)/1000;
 function loop(){if(!playing)return;let t=now();if(t>=DUR){if(useAudio){aud.currentTime=0;aud.play()}else t0=performance.now();t=0}renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)}
 function start(){ui.classList.add('hide');playing=true;t0=performance.now();aud.currentTime=0;aud.play().catch(()=>useAudio=false);loop()}
 ui.addEventListener('click',start);
 addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
