<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reciprocidad — Reel</title>
<style>
@font-face{font-family:MBlack;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:MXB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MSemi;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;width:auto;background:#F5EFE6;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);color:#fff;font-family:MXB,system-ui,sans-serif;cursor:pointer;text-align:center;padding:16px}
#ui .play{width:120px;height:120px;border-radius:50%;background:#FF5A1F;display:flex;align-items:center;justify-content:center;font-size:52px}
#ui small{font-family:MSemi,system-ui,sans-serif;opacity:.8;font-size:15px;line-height:1.6}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>Reciprocidad · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-reciprocidad.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2;
const C={cream:'#F5EFE6',ink:'#1A1A1A',orange:'#FF5A1F',green:'#22C55E',pink:'#F9A8D4',pinkD:'#EC7FB7',gray:'#9CA3AF',white:'#FFFFFF',sand:'#E8DCCB',cloth:'#EADBC4',skin:'#F2B48A',tray:'#2B2B2B'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=1000;off.height=440;const octx=off.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const bounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:3,tr:null,vis:'Una mano deja una charola con la cuenta y un dulce sobre la mesa; zoom al dulce con brillo.'},
 {id:'giro',name:'GIRO',a:3,b:8,tr:'wipe',vis:'«AMABILIDAD» se tacha → entra «RECIPROCIDAD» con brillo, rodeado por dos flechas en círculo (DAR ↔ DEVOLVER).'},
 {id:'exp',name:'EL EXPERIMENTO',a:8,b:20,tr:'slide',vis:'Mesas A, B y C. En A cae un dulce → «+3%» (cifra sola 2 s). En B caen dos → «+14%» (cifra sola 2 s). La mesa C espera con «¿?».'},
 {id:'res',name:'EL RESULTADO',a:20,b:30,tr:'zoom',vis:'Mesa C: el mesero deja un dulce, se va, se detiene, regresa y deja otro con un corazón. Barra verde crece → «MÁS DE +20%» (sola 2 s).'},
 {id:'why',name:'POR QUÉ FUNCIONA',a:30,b:42,tr:'spin',vis:'Una personita recibe un regalo; sobre su cabeza una balanza se desequilibra y se equilibra cuando deja dinero en la mesa. Check verde.'},
 {id:'where',name:'DÓNDE LO VES',a:42,b:52,tr:'up',vis:'Carrusel: charolita de degustación → pantalla «Descarga gratis» con campo de correo → taza de café con etiqueta «Cortesía».'},
 {id:'app',name:'APLICACIÓN',a:52,b:57,tr:'zoom',vis:'«VENDER PRIMERO» se tacha → una caja de regalo se abre y sale una tarjeta «Para ti».'},
 {id:'cta',name:'CTA',a:57,b:60,tr:'wipe',vis:'Una caja de regalo se abre y sale el botón SEGUIR + cursor con clic + @Atlas_Path y tu logo → regresa a la charola con el dulce (loop).'},
];
function alloc(a,b,blocks){
 const n=blocks.map(x=>x[0].split(/\s+/).length),tot=n.reduce((s,v)=>s+v,0);let t=a;
 return blocks.map((x,i)=>{const d=(b-a)*n[i]/tot,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const S5=alloc(30.0,41.5,[
 ['Cuando alguien te da algo,',['da']],
 ['sientes una deuda.',['deuda']],
 ['Y tu cerebro quiere pagarla,',['pagarla']],
 ['aunque nadie te la cobre.',['cobre']],
]);
const S6=alloc(42.0,51.5,[
 ['En las muestras gratis,',['muestras']],
 ['en el ebook «gratis»',['ebook']],
 ['a cambio de tu correo',['correo']],
 ['y en el café «cortesía».',['cortesía']],
]);
const SUBS_RAW=[
 [0.0,2.5,'¿Por qué ese dulce gratis?',['dulce']],
 [3.0,4.75,'No es amabilidad.',['amabilidad']],
 [4.75,7.5,'Es estrategia: se llama reciprocidad.',['reciprocidad']],
 [8.0,9.75,'Un estudio en restaurantes',['restaurantes']],
 [9.75,11.95,'probó dulces con la cuenta.',['dulces']],
 [11.95,13.7,'Con un dulce, propinas…',['un']],
 [15.7,17.2,'Con dos dulces…',['dos']],
 [20.0,21.9,'Pero el truco ganador:',['ganador']],
 [21.9,23.7,'dejar un dulce, irse…',['irse']],
 [23.7,25.5,'y regresar con otro',['regresar']],
 [25.5,27.2,'«solo para ustedes».',['ustedes']],
 ...S5,...S6,
 [52.0,54.0,'Da primero, vende después.',['primero']],
 [54.0,56.5,'Hazlo sentir personal.',['personal']],
 [57.0,59.5,'Síguenos para más trucos gratis',['síguenos']],
];
const HOLDS=[{a:13.7,b:15.7,text:'+3%'},{a:17.2,b:19.4,text:'+14%'},{a:27.2,b:29.5,text:'+20%'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const T5={gift:30.5,scale:32.0,tilt:S5[1][0]+.1,pay:36.4,level:37.1,check:37.9};
const T6=[S6[1][0],S6[2][0],S6[3][0]];
// mesero en la mesa C
const WT={drop1:22.0,goA:22.6,goB:23.6,backA:23.75,backB:24.65,drop2:24.8,heart:25.1,barA:25.6,barB:27.1};

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
sfx(0.45,'clink',.8);sfx(1.2,'whoosh',.5);sfx(1.7,'shine',.8);
sfx(3.0,'whoosh');sfx(3.2,'pop');sfx(3.9,'strike');sfx(4.8,'whoosh',.8);sfx(5.2,'shine');sfx(5.4,'whoosh',.35,1.3);
sfx(8.0,'whoosh');[8.3,8.6,8.9].forEach(x=>sfx(x,'pop',.5));
const CANDY3=[{tb:0,t:12.25},{tb:1,t:15.85},{tb:1,t:16.25}];CANDY3.forEach(c=>sfx(c.t+.45,'clink'));
sfx(13.7,'ding');sfx(17.2,'ding',1,1.12);sfx(19.4,'pop',.6);
sfx(20.0,'whoosh');sfx(WT.drop1+.3,'clink');
for(let i=0;i<4;i++){sfx(WT.goA+.1+i*.24,'step',.8);sfx(WT.backA+.1+i*.22,'step',.8)}
sfx(WT.drop2+.3,'clink');sfx(WT.heart,'pop',.7,1.2);
for(let i=1;i<=8;i++){const k=1-Math.pow(1-i/8,1/3);sfx(WT.barA+(WT.barB-WT.barA)*k*.98,'tick',.5,1+i*.05)}
sfx(27.2,'ding',1,1.25);
sfx(30.0,'whoosh');sfx(T5.gift,'whoosh',.4,1.3);sfx(T5.gift+.7,'pop',.6);sfx(T5.scale,'pop',.6);sfx(T5.tilt,'step',.6,.8);
sfx(T5.pay,'whoosh',.4,1.4);sfx(T5.pay+.6,'pop',.6);sfx(T5.level+.2,'clink',.6);sfx(T5.check,'ding',.9,1.3);
sfx(42.0,'whoosh');sfx(42.4,'pop',.5);sfx(T6[0],'whoosh',.7);for(let i=0;i<8;i++)sfx(T6[1]+.3+i*.16,'tick',.35,1.4);
sfx(T6[2],'whoosh',.7);sfx(T6[2]+.4,'pop',.5);
sfx(52.0,'whoosh');sfx(52.15,'pop');sfx(52.9,'strike');sfx(53.7,'whoosh',.5);sfx(54.1,'pop');sfx(54.5,'gift');sfx(54.9,'shine',.7);
sfx(57.0,'whoosh');sfx(57.1,'gift');sfx(57.3,'pop',.7);sfx(57.5,'pop',.6);sfx(58.3,'click');sfx(58.32,'pop',.6,1.3);
sfx(59.35,'whoosh',.5);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,sfx:SFX};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.ink,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function person(x,y,s,col,alpha=1){
 if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;
 ctx.beginPath();ctx.arc(x,y-s*3.1,s,0,TAU);ctx.fill();
 rr(x-s*1.15,y-s*1.9,s*2.3,s*1.9,[s*1.1,s*1.1,s*.25,s*.25]);ctx.fill();ctx.restore();
}
function sparkle(x,y,r,col){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fillStyle=col;ctx.fill()}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function heart(x,y,s,col){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.fillStyle=col;ctx.fill()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function candy(x,y,s,rot=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineJoin='round';ctx.strokeStyle=C.ink;ctx.lineWidth=Math.max(3,s*.07);
 for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(d*s*.42,0);ctx.lineTo(d*s*.95,-s*.36);ctx.lineTo(d*s*.95,s*.36);ctx.closePath();ctx.fillStyle=C.pinkD;ctx.fill();ctx.stroke()}
 ctx.beginPath();ctx.ellipse(0,0,s*.52,s*.38,0,0,TAU);ctx.fillStyle=C.pink;ctx.fill();ctx.stroke();
 ctx.strokeStyle='#fff';ctx.lineWidth=s*.08;ctx.lineCap='round';ctx.beginPath();ctx.arc(-s*.05,0,s*.2,Math.PI*.9,Math.PI*1.9);ctx.stroke();
 ctx.restore();
}
function gift(x,y,s,lid=0,col=C.pink){ // lid 0 cerrado → 1 abierto
 ctx.save();ctx.translate(x,y);ctx.strokeStyle=C.ink;ctx.lineWidth=Math.max(4,s*.035);ctx.lineJoin='round';
 rr(-s/2,-s*.35,s,s*.75,s*.05);ctx.fillStyle=col;ctx.fill();ctx.stroke();
 ctx.fillStyle=C.orange;ctx.fillRect(-s*.08,-s*.35,s*.16,s*.75);ctx.strokeRect(-s*.08,-s*.35,s*.16,s*.75);
 ctx.save();ctx.translate(lerp(0,s*.8,lid),lerp(-s*.35,-s*.5,lid));ctx.rotate(lid*.9);
 rr(-s*.56,-s*.2,s*1.12,s*.2,s*.04);ctx.fillStyle=col;ctx.fill();ctx.stroke();ctx.fillStyle=C.orange;ctx.fillRect(-s*.08,-s*.2,s*.16,s*.2);
 for(const d of[-1,1]){ctx.beginPath();ctx.ellipse(d*s*.15,-s*.3,s*.16,s*.1,d*.5,0,TAU);ctx.fillStyle=C.orange;ctx.fill();ctx.stroke()}
 ctx.restore();ctx.restore();
}
function bill(x,y,w,col=C.green,rot=0){const h=w*.5;ctx.save();ctx.translate(x,y);ctx.rotate(rot);
 rr(-w/2,-h/2,w,h,w*.06);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(26,26,26,.85)';ctx.lineWidth=Math.max(3,w*.025);ctx.stroke();
 circle(0,0,h*.3,'rgba(255,255,255,.85)');text('$',0,h*.02,h*.42,'MBlack',col);ctx.restore()}
function tray(x,y,sc,withCandy=true,rot=0){
 ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.rotate(rot);
 rr(-210,-150,420,300,34);ctx.fillStyle='rgba(26,26,26,.15)';ctx.fill();
 rr(-215,-160,420,300,34);ctx.fillStyle=C.tray;ctx.fill();
 ctx.save();ctx.translate(-60,-10);ctx.rotate(-.05);rr(-95,-125,190,250,10);ctx.fillStyle='#fff';ctx.fill();
 text('CUENTA',0,-92,26,'MXB',C.ink);ctx.fillStyle='#E5DCCF';for(let i=0;i<4;i++){rr(-70,-58+i*30,[110,90,120,80][i],12,6);ctx.fill()}
 ctx.fillStyle=C.ink;ctx.fillRect(-70,66,140,4);text('TOTAL',-30,96,20,'MXB',C.ink);ctx.restore();
 if(withCandy)candy(125,10,90,-.4);
 ctx.restore();
}
function hand(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);
 ctx.fillStyle=C.ink;rr(-s*.45,-s*3.2,s*.9,s*2.4,s*.2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-s*.45,-s*.95,s*.9,s*.18);
 ctx.beginPath();ctx.ellipse(0,-s*.35,s*.48,s*.6,0,0,TAU);ctx.fillStyle=C.skin;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.stroke();ctx.restore()}

/* ================= FONDO / HUD / SUBTÍTULOS ================= */
const BLOBS=[[120,560,260,.30,C.orange],[980,1480,320,.22,C.ink],[930,330,170,.35,C.pink],[180,1680,230,.27,C.green]];
function bg(t){ctx.fillStyle=C.cream;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.05;
 for(const[x,y,r,s,c]of BLOBS)circle(x+Math.sin(t*s)*36,y+Math.cos(t*s*.8)*36,r,c);ctx.restore()}
function hud(t){
 if(logo.complete&&logo.naturalWidth){const h=128,w=h*logo.naturalWidth/logo.naturalHeight;ctx.drawImage(logo,46,262,w,h)}
 ctx.fillStyle='rgba(26,26,26,.12)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.orange;ctx.fillRect(0,0,W*clamp(t/DUR),10);
}
const SUB_FS=60,SUB_Y=1400,SUB_MAXW=800;
function subs(t){
 const s=SUBS.find(s=>t>=s.a&&t<s.b);if(!s)return;
 ctx.font=`${SUB_FS}px MXB`;const sp=ctx.measureText(' ').width;
 const lines=[];let cur=[],cw=0;
 for(const w of s.words){const ww=ctx.measureText(w.w).width;if(cur.length&&cw+sp+ww>SUB_MAXW){lines.push({ws:cur,w:cw});cur=[];cw=0}cur.push({...w,ww});cw+=(cur.length>1?sp:0)+ww}
 lines.push({ws:cur,w:cw});
 const lh=SUB_FS*1.25,pad=34,pv=20,bw=Math.max(...lines.map(l=>l.w))+pad*2,bh=lines.length*lh+pv*2;
 const kin=eo(p(t,s.a,s.a+.18)),kout=1-p(t,s.b-.12,s.b);
 ctx.save();ctx.translate(CX,SUB_Y);const sc=.92+.08*kin;ctx.scale(sc,sc);ctx.globalAlpha=Math.min(kin,kout);
 rr(-bw/2,-bh/2,bw,bh,26);ctx.fillStyle='rgba(26,26,26,.84)';ctx.fill();
 ctx.textBaseline='middle';ctx.textAlign='left';
 lines.forEach((l,li)=>{let x=-l.w/2;const y=-bh/2+pv+lh*(li+.5);
  l.ws.forEach(w=>{const reached=t>=w.t0;ctx.fillStyle=reached?(w.key?C.orange:'#fff'):'rgba(255,255,255,.42)';
   const bump=reached?1+.1*(1-eo(p(t,w.t0,w.t0+.28))):1;
   ctx.save();ctx.translate(x+w.ww/2,y);ctx.scale(bump,bump);ctx.fillText(w.w,-w.ww/2,0);ctx.restore();x+=w.ww+sp})});
 ctx.restore();
}
const holdK=(t,h)=>Math.min(eo(p(t,h.a,h.a+.25)),1-p(t,h.b,h.b+.2));
function holdNum(t,h,col,cx,cy,size,tx,ty,tsize){
 if(t<h.a)return;const kin=pop(t,h.a,.35),out=eio(p(t,h.b,h.b+.25));
 ctx.save();ctx.translate(lerp(cx,tx,out),lerp(cy,ty,out));const s=kin*lerp(1,tsize/size,out);ctx.scale(s,s);
 text(h.text,0,0,size,'MBlack',col);ctx.restore();
}

/* ================= ESCENA 1 · HOOK ================= */
function tableCloth(){rr(60,430,900,840,48);ctx.fillStyle=C.cloth;ctx.fill();ctx.strokeStyle='rgba(26,26,26,.08)';ctx.lineWidth=3;
 for(let x=60+75;x<960;x+=75){ctx.beginPath();ctx.moveTo(x,430);ctx.lineTo(x,1270);ctx.stroke()}for(let y=430+75;y<1270;y+=75){ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(960,y);ctx.stroke()}}
function sHook(t){
 const z=eio(p(t,1.2,2.4)),s=1+.55*z,F={x:CX+125*.95,y:850};
 ctx.save();ctx.translate(lerp(F.x,CX,z),lerp(F.y,830,z));ctx.scale(s,s);ctx.translate(-F.x,-F.y);
 tableCloth();
 const d=eo(p(t,-.1,.55)),ty=lerp(760,840,d);
 tray(CX,ty,.95);
 const hk=eio(p(t,.55,1.1));if(hk<1)hand(CX+260+hk*260,ty-60-hk*420,60,-.75);
 ctx.restore();
 const sh=p(t,1.6,2.9);if(sh>0)for(const[dx,dy,d0]of[[-110,-70,0],[105,-80,.15],[80,75,.3],[-95,70,.45]]){const k=Math.sin(clamp((sh-d0/1.3)*1.6)*Math.PI);if(k>0)sparkle(CX+dx,830+dy,30*k,C.orange)}
}

/* ================= ESCENA 2 · GIRO ================= */
function arrowArc(cx,cy,rx,ry,a0,a1,col,lw){
 ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,a0,a1);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
 const x=cx+Math.cos(a1)*rx,y=cy+Math.sin(a1)*ry,tx=-Math.sin(a1)*rx,ty=Math.cos(a1)*ry,L=Math.hypot(tx,ty),ux=tx/L,uy=ty/L;
 ctx.beginPath();ctx.moveTo(x+ux*34,y+uy*34);ctx.lineTo(x-uy*26,y+ux*26);ctx.lineTo(x+uy*26,y-ux*26);ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function sGiro(t){
 if(t<4.9){const kin=pop(t,3.2,.35),out=eio(p(t,4.45,4.85));
  ctx.save();ctx.translate(CX,900-out*80);const sc=kin*(1-.25*out);ctx.scale(sc,sc);ctx.globalAlpha*=1-out;
  const fs=fitSize('AMABILIDAD','MBlack',130,860);text('AMABILIDAD',0,0,fs);ctx.font=`${fs}px MBlack`;const tw=ctx.measureText('AMABILIDAD').width;
  const k=eo(p(t,3.9,4.3));if(k>0){ctx.beginPath();ctx.moveTo(-tw/2-30,14);ctx.lineTo(lerp(-tw/2-30,tw/2+30,k),lerp(14,-18,k));ctx.strokeStyle=C.orange;ctx.lineWidth=22;ctx.lineCap='round';ctx.stroke()}
  ctx.restore()}
 if(t>=4.8){

 const now=()=>useAudio&&!isNaN(aud.duration)?aud.currentTime:(performance.now()-t0)/1000;
 function loop(){if(!playing)return;let t=now();if(t>=DUR){if(useAudio){aud.currentTime=0;aud.play()}else t0=performance.now();t=0}renderFrame(Math.min(t,DUR-.001));requestAnimationFrame(loop)}
 function start(){ui.classList.add('hide');playing=true;t0=performance.now();aud.currentTime=0;aud.play().catch(()=>useAudio=false);loop()}
 ui.addEventListener('click',start);
 addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
}
</script>
</body>
</html>
