<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aversión a la Pérdida — Reel</title>
<style>
@font-face{font-family:MBlack;src:url(fonts/Montserrat-Black.ttf)}
@font-face{font-family:MXB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MSemi;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;width:auto;background:#F5EFE6;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);color:#fff;font-family:MXB,system-ui,sans-serif;cursor:pointer;text-align:center;padding:16px}
#ui .play{width:120px;height:120px;border-radius:50%;background:#FF5A1F;display:flex;align-items:center;justify-content:center;font-size:52px}
#ui small{font-family:MSemi,system-ui,sans-serif;opacity:.8;font-size:15px;line-height:1.6}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="ui"><div class="play">▶</div><div>Aversión a la pérdida · 60 s</div>
<small>Clic para reproducir · F = pantalla completa · Espacio = pausa · R = reiniciar</small></div>
<audio id="aud" src="audio/mezcla-aversion-perdida.m4a" preload="auto"></audio>
<script>
/* ================= CONFIG ================= */
const W=1080,H=1920,CX=510,DUR=60,TAU=Math.PI*2;
const C={cream:'#F5EFE6',ink:'#1A1A1A',orange:'#FF5A1F',green:'#22C55E',red:'#EF4444',gray:'#9CA3AF',white:'#FFFFFF',sand:'#E8DCCB',gold:'#F5B83D',goldD:'#C98A1B',skin:'#F2B48A'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=1000;off.height=440;const octx=off.getContext('2d');
const logo=new Image();logo.src='assets/logo-atlas-path.png';

/* ================= EASING ================= */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.32)=>eback(p(t,t0,t0+d));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`};

/* ================= TIMELINE ================= */
const SCENES=[
 {id:'hook',name:'HOOK',a:0,b:3,tr:null,vis:'Dos cupones: «OBTÉN 20%» quieto en gris y «NO PIERDAS 20%» vibrando en rojo con un reloj encima. Zoom al rojo. Tic-tac.'},
 {id:'giro',name:'GIRO',a:3,b:8,tr:'wipe',vis:'Signo «=» entre los cupones → un cerebro reacciona en rojo al cupón de pérdida → entra «AVERSIÓN A LA PÉRDIDA» con brillo.'},
 {id:'exp',name:'EL EXPERIMENTO',a:8,b:20,tr:'slide',vis:'Moneda girando en el aire (cling). Águila a la izquierda: «+$150» verde (cifra sola 2 s). Sol a la derecha: «−$100» rojo (cifra sola 2 s). La moneda queda suspendida con «¿?».'},
 {id:'res',name:'EL RESULTADO',a:20,b:30,tr:'zoom',vis:'Personitas niegan con la cabeza y aparecen «NO» en cascada → columna «$100» roja frente a «≈ $200» verde → «x2» grande en naranja (sola 2 s).'},
 {id:'why',name:'POR QUÉ FUNCIONA',a:30,b:42,tr:'spin',vis:'Balanza: un billete en «GANAR» y el mismo en «PERDER»; el lado perder se hunde con peso «x2». Luego unas manos abrazan un billete.'},
 {id:'where',name:'DÓNDE LO VES',a:42,b:52,tr:'up',vis:'Carrusel: cupón con cuenta regresiva → carrito con temporizador 10:00 bajando → suscripción con «Cancelar» diminuto y aviso «Perderás tus beneficios».'},
 {id:'app',name:'APLICACIÓN',a:52,b:57,tr:'zoom',vis:'«GANA 20%» se tacha → aparece «NO PIERDAS TU 20%» en rojo con un reloj de arena vaciándose.'},
 {id:'cta',name:'CTA',a:57,b:60,tr:'wipe',vis:'Logo + @Atlas_Path + botón SEGUIR con clic + notificación «No te lo pierdas» → regresa a los dos cupones (loop).'},
];
function alloc(a,b,blocks){
 const n=blocks.map(x=>x[0].split(/\s+/).length),tot=n.reduce((s,v)=>s+v,0);let t=a;
 return blocks.map((x,i)=>{const d=(b-a)*n[i]/tot,r=[+t.toFixed(3),+(t+d).toFixed(3),x[0],x[1]];t+=d;return r});
}
const S5=alloc(30.0,41.5,[
 ['Perder duele cerca del doble',['doble']],
 ['de lo que disfrutas ganar.',['ganar']],
 ['Por eso tu cerebro protege',['protege']],
 ['lo que siente suyo.',['suyo']],
]);
const S6=alloc(42.0,51.5,[
 ['En «no pierdas tu descuento»',['pierdas']],
 ['en «tu carrito expira»',['expira']],
 ['en pruebas gratis',['gratis']],
 ['que cuesta cancelar:',['cancelar']],
 ['ya las sientes tuyas.',['tuyas']],
]);
const SUBS_RAW=[
 [0.0,2.5,'¿Por qué «no pierdas» funciona?',['pierdas']],
 [3.0,4.75,'Misma oferta, distinto efecto.',['efecto']],
 [4.75,7.5,'Es aversión a la pérdida.',['aversión','pérdida']],
 [8.0,10.0,'Juego: lanzamos una moneda.',['moneda']],
 [10.0,11.8,'Si sale águila, ganas…',['ganas']],
 [13.8,15.6,'Si sale sol, pierdes…',['pierdes']],
 [17.6,19.5,'¿Tú le entras?',['entras']],
 [20.0,22.2,'La mayoría dice que no.',['no']],
 [22.2,24.0,'Según Kahneman y Tversky,',['kahneman','tversky']],
 [24.0,25.5,'por arriesgar $100',['$100']],
 [25.5,27.3,'piden ganar casi $200',['$200']],
 ...S5,...S6,
 [52.0,54.0,'No digas qué gana,',['gana']],
 [54.0,56.5,'dile qué podría perder.',['perder']],
 [57.0,59.5,'Síguenos para no perderte nada',['síguenos']],
];
// cifras clave solas en pantalla (sin subtítulo)
const HOLDS=[{a:11.8,b:13.8,text:'+$150'},{a:15.6,b:17.6,text:'−$100'},{a:27.3,b:29.5,text:'x2'}];
const norm=s=>s.toLowerCase().replace(/[«»¿?¡!.,:;…"]/g,'');
const SUBS=SUBS_RAW.map(([a,b,text,keys])=>{
 const ws=text.split(/\s+/),chars=ws.map(w=>w.length),tot=chars.reduce((s,v)=>s+v,0);let acc=0;
 const words=ws.map((w,i)=>{const t0=a+.05+(acc/tot)*(b-a)*.8;acc+=chars[i];return{w,key:keys.includes(norm(w)),t0}});
 return{a,b,text,keys,words};
});
const T6=[S6[1][0],S6[2][0],S6[3][0],S6[4][0]]; // carrusel: carrito, suscripción, «Cancelar», aviso

const SFX=[];
const sfx=(t,type,v=1,pitch=1)=>SFX.push({t:+t.toFixed(3),type,v,pitch});
for(let i=0;i<6;i++)sfx(i*.5,'tictac',.8,i%2?.8:1);sfx(1.0,'whoosh',.5);
sfx(3.0,'whoosh');sfx(3.25,'pop');sfx(3.6,'pop');sfx(4.0,'buzz',.5);sfx(4.8,'whoosh',.8);sfx(5.2,'shine');
sfx(8.0,'whoosh');for(let i=0;i<7;i++)sfx(8.2+i*.32,'cling',1-i*.1,1+(i%3)*.06);
sfx(10.0,'pop',.6);sfx(11.8,'ding');sfx(13.8,'pop',.6);sfx(15.6,'buzz');sfx(17.6,'pop');sfx(17.7,'cling',.5,1.1);
sfx(20.0,'whoosh');const NOS=[];for(let i=0;i<8;i++){NOS.push(20.3+i*.18);sfx(20.3+i*.18,'pop',.45,.9+(i%4)*.08)}
sfx(24.0,'buzz');sfx(25.5,'ding');sfx(27.3,'ding',1,1.2);
sfx(30.0,'whoosh');sfx(30.4,'pop');sfx(30.9,'pop');sfx(31.6,'buzz',.9);sfx(36.1,'whoosh',.5);sfx(36.3,'pop');sfx(37.2,'pop',.6,1.3);
sfx(42.0,'whoosh');for(let x=42.5;x<T6[0]-.1;x+=.5)sfx(x,'tictac',.6,(x*2)%2?.8:1);
sfx(T6[0],'whoosh',.7);for(let x=T6[0]+.4;x<T6[1]-.1;x+=.4)sfx(x,'tictac',.6,1.1);
sfx(T6[1],'whoosh',.7);sfx(T6[2],'pop',.5);sfx(T6[3],'buzz',.6);
sfx(52.0,'whoosh');sfx(52.15,'pop');sfx(52.9,'strike');sfx(53.7,'whoosh',.5);sfx(54.05,'buzz',.7);for(let x=54.5;x<56.5;x+=.5)sfx(x,'tictac',.5,(x*2)%2?.8:1);
sfx(57.0,'whoosh');sfx(57.1,'pop',.6);sfx(57.4,'pop',.6);sfx(58.3,'click');sfx(58.32,'pop',.6,1.3);sfx(58.6,'ding',.5,1.5);
sfx(59.35,'whoosh',.5);sfx(59.5,'tictac',.6);

window.TL={W,H,fps:30,duration:DUR,scenes:SCENES,subs:SUBS.map(s=>({a:s.a,b:s.b,text:s.text,keys:s.keys})),holds:HOLDS,sfx:SFX};

/* ================= PRIMITIVAS ================= */
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MBlack',color=C.ink,align='center'){ctx.font=`${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function fitSize(s,font,size,maxW){ctx.font=`${size}px ${font}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}
function person(x,y,s,col,alpha=1,hx=0){
 if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;
 ctx.beginPath();ctx.arc(x+hx,y-s*3.1,s,0,TAU);ctx.fill();
 rr(x-s*1.15,y-s*1.9,s*2.3,s*1.9,[s*1.1,s*1.1,s*.25,s*.25]);ctx.fill();ctx.restore();
}
function sparkle(x,y,r,col){ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fillStyle=col;ctx.fill()}
function check(x,y,s,col,lw){ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.35);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function heart(x,y,s,col){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);ctx.fillStyle=col;ctx.fill()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function coupon(cx,cy,w,h,col,l1,l2,l3,sc=1){
 ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
 rr(-w/2+8,-h/2+12,w,h,24);ctx.fillStyle='rgba(26,26,26,.12)';ctx.fill();
 rr(-w/2,-h/2,w,h,24);ctx.fillStyle=col;ctx.fill();
 circle(-w/2,0,26,C.cream);circle(w/2,0,26,C.cream);
 ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=4;rr(-w/2+18,-h/2+18,w-36,h-36,14);ctx.stroke();ctx.setLineDash([]);
 text(l1,0,-h*.27,fitSize(l1,'MBlack',44,w-90),'MBlack','#fff');text(l2,0,h*.04,104,'MBlack','#fff');text(l3,0,h*.31,28,'MSemi','rgba(255,255,255,.9)');
 ctx.restore();
}
function alarm(x,y,r,t,col){
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*40)*.08);
 ctx.strokeStyle=col;ctx.lineWidth=r*.14;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-r*.55,r*.8);ctx.lineTo(-r*.8,r*1.1);ctx.moveTo(r*.55,r*.8);ctx.lineTo(r*.8,r*1.1);ctx.stroke();
 for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*r*.68,-r*.82,r*.36,Math.PI,0);ctx.fillStyle=col;ctx.fill()}
 circle(0,0,r,col);circle(0,0,r*.8,'#fff');
 ctx.strokeStyle=C.ink;ctx.lineWidth=r*.1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-r*.5);ctx.stroke();
 const a=t*6;ctx.strokeStyle=col;ctx.lineWidth=r*.07;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(a)*r*.65,-Math.cos(a)*r*.65);ctx.stroke();
 circle(0,0,r*.1,C.ink);ctx.restore();
}
function brain(x,y,s,heat){
 const L=[[-.55,-.25,.42],[-.2,-.5,.42],[.22,-.48,.42],[.56,-.2,.4],[.48,.22,.38],[.05,.22,.44],[-.42,.22,.4]];
 for(const[a,b,r]of L)circle(x+a*s,y+b*s,r*s+7,C.ink);
 const f=mix('#F9C8BE','#EF4444',heat);for(const[a,b,r]of L)circle(x+a*s,y+b*s,r*s,f);
 ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x,y-s*.75);ctx.bezierCurveTo(x-s*.1,y-s*.3,x+s*.1,y,x,y+s*.45);ctx.stroke();
 for(const[a,b,r,s0]of[[-.45,-.15,.2,0],[.4,-.2,.18,3],[-.3,.25,.16,4],[.35,.25,.16,1]]){ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,s0,s0+2.2);ctx.stroke()}
}
function coin(x,y,r,ang){
 const c=Math.cos(ang),sx=Math.max(Math.abs(c),.07);
 ctx.save();ctx.translate(x,y);ctx.scale(sx,1);circle(0,0,r,C.goldD);circle(0,0,r*.86,C.gold);
 ctx.strokeStyle='#8A5A0B';ctx.fillStyle='#8A5A0B';ctx.lineWidth=r*.09;ctx.lineCap='round';ctx.lineJoin='round';
 if(c>=0)eagle(0,0,r*.5);else{circle(0,0,r*.24,'#8A5A0B');for(let i=0;i<8;i++){const a=i*TAU/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.34,Math.sin(a)*r*.34);ctx.lineTo(Math.cos(a)*r*.52,Math.sin(a)*r*.52);ctx.stroke()}}
 ctx.restore();
}
function eagle(x,y,s){ctx.beginPath();ctx.moveTo(x-s,y-s*.2);ctx.quadraticCurveTo(x-s*.5,y-s*.75,x,y+s*.05);ctx.quadraticCurveTo(x+s*.5,y-s*.75,x+s,y-s*.2);ctx.stroke();
 ctx.beginPath();ctx.arc(x,y-s*.2,s*.16,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(x-s*.2,y+s*.25);ctx.lineTo(x,y+s*.6);ctx.lineTo(x+s*.2,y+s*.25);ctx.stroke()}
function sunIcon(x,y,s){circle(x,y,s*.38,C.orange);ctx.strokeStyle=C.orange;ctx.lineWidth=s*.12;ctx.lineCap='round';for(let i=0;i<8;i++){const a=i*TAU/8;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*s*.55,y+Math.sin(a)*s*.55);ctx.lineTo(x+Math.cos(a)*s*.8,y+Math.sin(a)*s*.8);ctx.stroke()}}
function bill(x,y,w,col=C.green,rot=0){const h=w*.5;ctx.save();ctx.translate(x,y);ctx.rotate(rot);
 rr(-w/2,-h/2,w,h,w*.06);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='rgba(26,26,26,.85)';ctx.lineWidth=Math.max(3,w*.025);ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(2,w*.015);rr(-w/2+w*.06,-h/2+w*.06,w-w*.12,h-w*.12,w*.04);ctx.stroke();
 circle(0,0,h*.3,'rgba(255,255,255,.85)');text('$',0,h*.02,h*.42,'MBlack',col);ctx.restore()}

/* ================= FONDO / HUD / SUBTÍTULOS ================= */
const BLOBS=[[120,560,260,.30,C.orange],[980,1480,320,.22,C.ink],[930,330,170,.35,C.red],[180,1680,230,.27,C.green]];
function bg(t){ctx.fillStyle=C.cream;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.045;
 for(const[x,y,r,s,c]of BLOBS)circle(x+Math.sin(t*s)*36,y+Math.cos(t*s*.8)*36,r,c);ctx.restore()}
function hud(t){
 if(logo.complete&&logo.naturalWidth){const h=128,w=h*logo.naturalWidth/logo.naturalHeight;ctx.drawImage(logo,46,262,w,h)}
 ctx.fillStyle='rgba(26,26,26,.12)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.orange;ctx.fillRect(0,0,W*clamp(t/DUR),10);
}
const SUB_FS=60,SUB_Y=1400,SUB_MAXW=800;
function subs(t){
 const s=SUBS.find(s=>t>=s.a&&t<s.b);if(!s)return;
 ctx.font=`${SUB_FS}px MXB`;const sp=ctx.measureText(' ').width;
 const lines=[];let cur=[],cw=0;
 for(const w of s.words){const ww=ctx.measureText(w.w).width;if(cur.length&&cw+sp+ww>SUB_MAXW){lines.push({ws:cur,w:cw});cur=[];cw=0}cur.push({...w,ww});cw+=(cur.length>1?sp:0)+ww}
 lines.push({ws:cur,w:cw});
 const lh=SUB_FS*1.25,pad=34,pv=20,bw=Math.max(...lines.map(l=>l.w))+pad*2,bh=lines.length*lh+pv*2;
 const kin=eo(p(t,s.a,s.a+.18)),kout=1-p(t,s.b-.12,s.b);
 ctx.save();ctx.translate(CX,SUB_Y);const sc=.92+.08*kin;ctx.scale(sc,sc);ctx.globalAlpha=Math.min(kin,kout);
 rr(-bw/2,-bh/2,bw,bh,26);ctx.fillStyle='rgba(26,26,26,.84)';ctx.fill();
 ctx.textBaseline='middle';ctx.textAlign='left';
 lines.forEach((l,li)=>{let x=-l.w/2;const y=-bh/2+pv+lh*(li+.5);
  l.ws.forEach(w=>{const reached=t>=w.t0;ctx.fillStyle=reached?(w.key?C.orange:'#fff'):'rgba(255,255,255,.42)';
   const bump=reached?1+.1*(1-eo(p(t,w.t0,w.t0+.28))):1;
   ctx.save();ctx.translate(x+w.ww/2,y);ctx.scale(bump,bump);ctx.fillText(w.w,-w.ww/2,0);ctx.restore();x+=w.ww+sp})});
 ctx.restore();
}
// cifra grande sola: entra al centro y se encoge hacia su lugar final
const holdK=(t,h)=>Math.min(eo(p(t,h.a,h.a+.25)),1-p(t,h.b,h.b+.2));
function holdNum(t,h,col,cx,cy,size,tx,ty,tsize,stay=true){
 if(t<h.a)return;const kin=pop(t,h.a,.35),out=eio(p(t,h.b,h.b+.25));if(!stay&&out>=1)return;
 ctx.save();ctx.translate(lerp(cx,tx,out),lerp(cy,ty,out));const s=kin*lerp(1,tsize/size,out);ctx.scale(s,s);
 if(!stay)ctx.globalAlpha*=1-out;text(h.text,0,0,size,'MBlack',col);ctx.restore();
}

/* ================= ESCENA 1 · HOOK ================= */
function sHook(t){
 const z=eio(p(t,1.0,2.4)),s=1+.3*z,F={x:735,y:860};
 ctx.save();ctx.translate(lerp(F.x,CX,z),F.y);ctx.scale(s,s);ctx.translate(-F.x,-F.y);
 ctx.save();ctx.globalAlpha*=1-.45*z;coupon(265,900,400,250,'#B8BEC7','OBTÉN','20%','de descuento');ctx.restore();
 const sx=Math.sin(t*55)*5,sr=Math.sin(t*47)*.012;
 ctx.save();ctx.translate(735+sx,900);ctx.rotate(sr);coupon(0,0,400,250,C.red,'NO PIERDAS','20%','tu descuento');ctx.restore();
 alarm(735+sx*.6,700,58,t,C.red);
 ctx.restore();
}

/* ================= ESCENA 2 · GIRO ================= */
function sGiro(t){
 if(t<4.95){const out=eio(p(t,4.55,4.95));
  ctx.save();ctx.globalAlpha*=1-out;ctx.translate(CX,600-out*80);ctx.scale(.62,.62);ctx.translate(-CX,-900);

  if(e.key===' '){e.preventDefault();if(!playing){start();return}if(aud.paused){aud.play();}else aud.pause()}
  if(e.key==='r'||e.key==='R'){aud.currentTime=0;t0=performance.now();if(!playing)start()}
 });
 window.ready.then(()=>renderFrame(0));
