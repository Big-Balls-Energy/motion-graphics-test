/* ================= PRIMITIVAS 2D ================= */
function mkCanvas(w,h=w){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
function circle(x,y,r,fill,g=ctx){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=fill;g.fill()}
function rr(x,y,w,h,r,g=ctx){g.beginPath();g.roundRect(x,y,w,h,r)}
function text(s,x,y,size,font='MB',color=C.white,align='center',ls=0,g=ctx){g.font=`${size}px ${font}`;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.letterSpacing=ls+'px';g.fillText(s,x,y);g.letterSpacing='0px'}
function tw(s,size,font='MB',ls=0,g=ctx){g.font=`${size}px ${font}`;g.letterSpacing=ls+'px';const w=g.measureText(s).width;g.letterSpacing='0px';return w}
function fitSize(s,font,size,maxW,ls=0){const w=tw(s,size,font,ls);return w>maxW?size*maxW/w:size}
function check(x,y,s,col,lw,g=ctx){g.beginPath();g.moveTo(x-s*.5,y);g.lineTo(x-s*.12,y+s*.38);g.lineTo(x+s*.55,y-s*.35);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';g.stroke()}
function cursorArrow(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();
 ctx.moveTo(0,0);ctx.lineTo(0,62);ctx.lineTo(15,48);ctx.lineTo(26,72);ctx.lineTo(37,67);ctx.lineTo(26,44);ctx.lineTo(46,44);ctx.closePath();
 ctx.fillStyle=C.white;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function sparks(x,y,t,t0,n,seed,o={}){
 const {spd=600,g=1500,life=.8,col=C.white,size=6,spread=1.2,dir=-Math.PI/2,kind='sq',cols}=o,dt=t-t0;if(dt<0||dt>life)return;
 ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const a=dir+(rnd(seed+i)-.5)*spread*2,v=spd*(.35+.65*rnd(seed+i*2.3)),vx=Math.cos(a)*v,vy=Math.sin(a)*v;
  const px=x+vx*dt,py=y+vy*dt+.5*g*dt*dt,al=1-dt/life;ctx.globalAlpha=al;const cc=cols?cols[i%cols.length]:(i%4?col:C.white);
  if(kind==='spark'){ctx.strokeStyle=cc;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-vx*.03,py-(vy+g*dt)*.03);ctx.stroke()}
  else{ctx.fillStyle=cc;const s=size*(.5+rnd(seed+i*7));ctx.fillRect(px-s/2,py-s/2,s,s)}}
 ctx.restore()}
function lensFlare(x,y,k,col=C.gold){if(k<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
 let g=ctx.createRadialGradient(x,y,0,x,y,260*k);g.addColorStop(0,`rgba(255,255,255,${.9*k})`);g.addColorStop(.2,rgba(col,.5*k));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(x-300,y-300,600,600);
 g=ctx.createLinearGradient(x-700,y,x+700,y);g.addColorStop(0,rgba(col,0));g.addColorStop(.5,`rgba(255,255,255,${.8*k})`);g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(x-700,y-3*k,1400,6*k);ctx.restore()}
function glowText(s,x,y,size,col,font='MB',ls=0,blur=50,stroke=0,strokeCol='rgba(10,6,20,.9)'){ctx.save();ctx.font=`${size}px ${font}`;ctx.letterSpacing=ls+'px';ctx.textAlign='center';ctx.textBaseline='middle';
 if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=strokeCol;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
 ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0;ctx.letterSpacing='0px';ctx.restore()}
// texto dorado con degradado metálico (títulos de acto y cifras)
function goldText(s,x,y,size,font='CZB',ls=0,{glow=30,stroke=8,a=1}={}){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font=`${size}px ${font}`;ctx.letterSpacing=ls+'px';ctx.textAlign='center';ctx.textBaseline='middle';
 if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(10,6,20,.85)';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
 const g=ctx.createLinearGradient(0,y-size*.55,0,y+size*.5);g.addColorStop(0,'#FFF6CF');g.addColorStop(.42,'#F5C542');g.addColorStop(.58,'#C98A1B');g.addColorStop(1,'#FFE08A');
 ctx.shadowColor='rgba(245,197,66,.75)';ctx.shadowBlur=glow;ctx.fillStyle=g;ctx.fillText(s,x,y);ctx.shadowBlur=0;ctx.letterSpacing='0px';ctx.restore()}
function ring2D(x,y,r,col,a,lw=6,sq=1,rot=0){if(a<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.beginPath();ctx.ellipse(x,y,r,r*sq,rot,0,TAU);ctx.strokeStyle=rgba(col,a);ctx.lineWidth=lw;ctx.stroke();ctx.restore()}
function starPath(g,x,y,r,ri=r*.45){g.beginPath();for(let i=0;i<10;i++){const r2=i%2?ri:r,a=-Math.PI/2+i*Math.PI/5;i?g.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2):g.moveTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2)}g.closePath()}

function pixelIcon(g,name,x,y,px,col,outline='#0A0614'){const P=PX[name],h=P.length,w=P[0].length,x0=Math.round(x-w*px/2),y0=Math.round(y-h*px/2);
 if(outline){g.fillStyle=outline;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(P[j][i]==='X')g.fillRect(x0+i*px-px*.6,y0+j*px-px*.6,px*2.2,px*2.2)}

function pixelPanel(x,y,w,h,{px=6,fill='rgba(10,6,20,.9)',border=C.gold,inner='#7A5410'}={},g=ctx){
 const path=(o)=>{g.beginPath();g.moveTo(x+px*2+o,y+o);g.lineTo(x+w-px*2-o,y+o);g.lineTo(x+w-px*2-o,y+px+o);g.lineTo(x+w-px-o,y+px+o);g.lineTo(x+w-px-o,y+px*2+o);g.lineTo(x+w-o,y+px*2+o);
  g.lineTo(x+w-o,y+h-px*2-o);g.lineTo(x+w-px-o,y+h-px*2-o);g.lineTo(x+w-px-o,y+h-px-o);g.lineTo(x+w-px*2-o,y+h-px-o);g.lineTo(x+w-px*2-o,y+h-o);g.lineTo(x+px*2+o,y+h-o);
  g.lineTo(x+px*2+o,y+h-px-o);g.lineTo(x+px+o,y+h-px-o);g.lineTo(x+px+o,y+h-px*2-o);g.lineTo(x+o,y+h-px*2-o);g.lineTo(x+o,y+px*2+o);g.lineTo(x+px+o,y+px*2+o);g.lineTo(x+px+o,y+px+o);g.lineTo(x+px*2+o,y+px+o);g.closePath()};
 path(0);g.fillStyle=border;g.fill();path(px);g.fillStyle=inner;g.fill();path(px*1.6);g.fillStyle=fill;g.fill()}

const GRADES={a1:{tint:'rgba(120,40,190,.30)',mul:'rgba(214,180,255,.30)',hi:'rgba(255,62,165,.10)',lo:'rgba(62,242,255,.10)'},
 a2:{tint:'rgba(20,70,190,.32)',mul:'rgba(170,200,255,.32)',hi:'rgba(245,197,66,.10)',lo:'rgba(34,211,238,.12)'},
 a3:{tint:'rgba(80,90,110,.34)',mul:'rgba(200,205,215,.36)',hi:'rgba(255,138,61,.12)',lo:'rgba(5,5,10,.2)'},
 ep:{tint:'rgba(255,170,60,.30)',mul:'rgba(255,225,170,.30)',hi:'rgba(255,244,214,.16)',lo:'rgba(255,181,71,.12)'}};
function grade(c,w,h,key,k=1){const G=GRADES[key];c.save();c.globalAlpha=k;c.globalCompositeOperation='soft-light';c.fillStyle=G.tint;c.fillRect(0,0,w,h);
 c.globalCompositeOperation='multiply';c.fillStyle=G.mul;c.fillRect(0,0,w,h);
 c.globalCompositeOperation='screen';let g=c.createRadialGradient(w*.1,h*.06,0,w*.1,h*.06,Math.max(w,h)*.7);g.addColorStop(0,G.hi);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
 g=c.createRadialGradient(w*.95,h*.92,0,w*.95,h*.92,Math.max(w,h)*.6);g.addColorStop(0,G.lo);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);c.restore()}
// foto que falta: rectángulo gris con su nombre exacto
function placeholder(c,w,h,name,ext){c.fillStyle='#4a4f5a';c.fillRect(0,0,w,h);c.setLineDash([18,12]);c.strokeStyle='#cbd5e1';c.lineWidth=5;c.strokeRect(10,10,w-20,h-20);c.setLineDash([]);
 const fs=Math.max(20,Math.min(w*.05,64));c.fillStyle='#e2e8f0';c.textAlign='center';c.textBaseline='middle';
 for(const y of h>w*1.2?[h*.36,h*.62]:[h*.5]){c.font=`${fs*.55}px MS`;c.fillText('FOTO PENDIENTE · reemplazar con:',w/2,y-fs*1.1);c.font=`${fs}px MB`;c.fillText(name+ext,w/2,y)}}

function buildBG(name,gk,key=name+'_'+gk,{blur=8,dark=.4,vig=.6}={}){const[o,c]=mkCanvas(BW,BH),im=IMG[name],ok=loaded(im),F=FONDOS[name]||{};
 if(!ok){placeholder(c,BW,BH,name,'.jpg');c.fillStyle='rgba(5,5,10,.28)';c.fillRect(0,0,BW,BH);grade(c,BW,BH,gk,.6);BGC[key]=o;return}
 const sw=im.naturalWidth,sh=im.naturalHeight,s=Math.max(BW/sw,BH/sh),dw=sw*s,dh=sh*s;
 c.filter=`contrast(1.12) saturate(.9)${blur?` blur(${blur}px)`:''} brightness(${dark})`;c.drawImage(im,clamp((BW-dw)*(F.fx??.5),BW-dw,0),clamp((BH-dh)*(F.fy??.5),BH-dh,0),dw,dh);c.filter='none';grade(c,BW,BH,gk);
 const g=c.createRadialGradient(BW/2,BH*.45,BH*.25,BW/2,BH*.45,BH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vig})`);c.fillStyle=g;c.fillRect(0,0,BW,BH);BGC[key]=o}
function fondo(key,{z=1,ox=0,oy=0,alpha=1}={}){const o=BGC[key];if(!o||alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(W/2+ox,H/2+oy);ctx.scale(z,z);ctx.drawImage(o,-BW/2,-BH/2);ctx.restore()}

function edgeLight(o,w,h,dx,dy,col,a,bl){const[m,mc]=mkCanvas(w,h);mc.drawImage(o,0,0);mc.globalCompositeOperation='source-in';mc.fillStyle=col;mc.fillRect(0,0,w,h);

 const c=o.getContext('2d'),[keep,kc]=mkCanvas(w,h);kc.drawImage(o,0,0);
 c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.filter=`blur(${bl}px)`;c.drawImage(m,0,0);c.restore();
 c.save();c.globalCompositeOperation='destination-in';c.drawImage(keep,0,0);c.restore()}

const CUT={};
function buildCut(name,gk,key=name+'_'+gk,{rim=C.gold}={}){const im=IMG[name],ok=loaded(im),w=ok?im.naturalWidth:900,h=ok?im.naturalHeight:Math.round(900*(RECORTES[name]||1));

  const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,248,230,.16)');g.addColorStop(.45,'rgba(255,248,230,0)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.26)');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.globalCompositeOperation='destination-in';c.drawImage(im,0,0);c.globalCompositeOperation='source-over';
  const d=Math.max(4,Math.round(w*.009));edgeLight(o,w,h,d,0,rim,.9,Math.max(2,Math.round(d*.4)));edgeLight(o,w,h,-Math.round(d*.6),-Math.round(d*.6),'#FFF4D6',.28,2)}
 else placeholder(c,w,h,name,'.png');
 const[s,sc]=mkCanvas(w,h);sc.filter=`blur(${Math.round(w*.015)}px)`;sc.drawImage(o,0,0);sc.filter='none';sc.globalCompositeOperation='source-in';sc.fillStyle='#000';sc.fillRect(0,0,w,h);
 CUT[key]={img:o,sil:s,w,h}}
function drawCut(key,P){const cu=CUT[key];if(!cu)return;const w=P.w,s=w/cu.w,h=cu.h*s;
 ctx.save();ctx.globalAlpha*=P.alpha??1;ctx.translate(P.x,P.y);
 if(P.contact){ctx.save();ctx.translate(w*.04,h*.5+P.contact);ctx.scale(1,.14);const g=ctx.createRadialGradient(0,0,0,0,0,w*.5);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w*.5,0,TAU);ctx.fill();ctx.restore()}
 ctx.rotate(P.rot||0);if(P.sx)ctx.scale(P.sx,1);
 if((P.shadow??1)>0){ctx.save();ctx.globalAlpha*=.5*(P.shadow??1);ctx.drawImage(cu.sil,-w/2+w*.04,-h/2+h*.06,w,h);ctx.restore()}
 ctx.drawImage(cu.img,-w/2,-h/2,w,h);ctx.restore()}
