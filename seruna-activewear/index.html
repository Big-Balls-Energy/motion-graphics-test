const BGC={},BW=1296,BH=2304;
function mkCanvas(w,h=w){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
// gradación uniforme: fría (azul marino en sombras, luz fría arriba a la izquierda) con un toque cálido en las fotos de la cafetería
function grade(c,w,h,k=1,warm=0){c.save();c.globalCompositeOperation='soft-light';c.fillStyle=`rgba(20,121,255,${.3*k*(1-.45*warm)})`;c.fillRect(0,0,w,h);
 c.globalCompositeOperation='multiply';c.fillStyle=`rgba(${Math.round(lerp(190,235,warm))},${Math.round(lerp(210,215,warm))},255,${.32*k})`;c.fillRect(0,0,w,h);
 c.globalCompositeOperation='screen';let g=c.createRadialGradient(w*.1,h*.06,0,w*.1,h*.06,Math.max(w,h)*.7);g.addColorStop(0,`rgba(205,228,255,${.12*k})`);g.addColorStop(1,'rgba(205,228,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
 if(warm>0){g=c.createRadialGradient(w*.55,h*.45,0,w*.55,h*.45,Math.max(w,h)*.55);g.addColorStop(0,`rgba(255,170,90,${.12*warm*k})`);g.addColorStop(1,'rgba(255,170,90,0)');c.fillStyle=g;c.fillRect(0,0,w,h)}
 g=c.createRadialGradient(w*.95,h*.92,0,w*.95,h*.92,Math.max(w,h)*.6);g.addColorStop(0,`rgba(61,139,255,${.12*k})`);g.addColorStop(1,'rgba(61,139,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);c.restore()}
// foto que falta: rectángulo gris con su nombre exacto (al centro y abajo, donde no lo tapa el contenido)
function placeholder(c,w,h,name,ext){c.fillStyle='#3a3f4a';c.fillRect(0,0,w,h);c.setLineDash([16,10]);c.strokeStyle='#cbd5e1';c.lineWidth=4;c.strokeRect(8,8,w-16,h-16);c.setLineDash([]);
 const fs=Math.max(18,w*.035);c.fillStyle='#e2e8f0';c.textAlign='center';c.textBaseline='middle';
 for(const y of h>w*1.2?[h*.5,h*.79]:[h*.5]){c.font=`${fs*.6}px JBMm`;c.fillText('FOTO PENDIENTE · reemplazar con:',w/2,y-fs*1.1);c.font=`${fs}px JBM`;c.fillText(name+ext,w/2,y)}}
// fondos: desenfoque 8 px y 60 % más oscuros (brightness .4); el marcador de una foto faltante se deja legible
function buildBG(name,key=name,{blur=8,dark=.4,vig=.6,fx=FONDOS[name].fx,fy=.5}={}){const[o,c]=mkCanvas(BW,BH),im=IMG[name],ok=loaded(im);
 if(!ok){placeholder(c,BW,BH,name,'.jpg');c.fillStyle='rgba(5,8,15,.25)';c.fillRect(0,0,BW,BH);BGC[key]=o;return}
 const sw=im.naturalWidth,sh=im.naturalHeight,s=Math.max(BW/sw,BH/sh),dw=sw*s,dh=sh*s;
 c.filter=`${GRADE}${blur?` blur(${blur}px)`:''} brightness(${dark})`;c.drawImage(im,clamp((BW-dw)*fx,BW-dw,0),clamp((BH-dh)*fy,BH-dh,0),dw,dh);c.filter='none';grade(c,BW,BH,1,FONDOS[name].warm||0);
 const g=c.createRadialGradient(BW/2,BH*.45,BH*.25,BW/2,BH*.45,BH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vig})`);c.fillStyle=g;c.fillRect(0,0,BW,BH);BGC[key]=o}
function fondo(key,{z=1,ox=0,oy=0,alpha=1}={}){const o=BGC[key];if(!o||alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(W/2+ox,H/2+oy);ctx.scale(z,z);ctx.drawImage(o,-BW/2,-BH/2);ctx.restore()}
function bgBase(){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H)}
// luz volumétrica fría desde arriba a la izquierda (misma dirección que la luz principal)
function godRays(t,k=1,ox=-160,oy=-240,col='165,205,255'){if(k<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<7;i++){const a=.86+i*.105+.025*Math.sin(t*.35+i*1.7),len=2900,wd=.035+.03*rnd(i*3),fl=.75+.25*Math.sin(t*.9+i*2.1);
  const g=ctx.createLinearGradient(ox,oy,ox+Math.cos(a)*len,oy+Math.sin(a)*len);g.addColorStop(0,`rgba(${col},${.11*k*fl})`);g.addColorStop(.55,`rgba(20,121,255,${.035*k*fl})`);g.addColorStop(1,'rgba(20,121,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+Math.cos(a-wd)*len,oy+Math.sin(a-wd)*len);ctx.lineTo(ox+Math.cos(a+wd)*len,oy+Math.sin(a+wd)*len);ctx.closePath();ctx.fill()}
 ctx.restore()}
function motes(t,k=1){if(k<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<60;i++){const z=.3+rnd(i*1.3)*.7,x=(rnd(i)*W+Math.sin(t*.25+i)*30*z)%W,y=((rnd(i*3.1)*H-t*(14+30*z))%H+H)%H,tw2=.45+.55*Math.sin(t*1.7+i*2.3);
  ctx.fillStyle=`rgba(190,230,255,${.2*k*tw2*z})`;ctx.beginPath();ctx.arc(x,y,1.2+2.4*z,0,TAU);ctx.fill()}ctx.restore()}
function bgSpace(t,{beams=.8,col='#0B1E3D'}={}){const g=ctx.createRadialGradient(W*.5,H*.42,40,W*.5,H*.5,H*.8);g.addColorStop(0,col);g.addColorStop(.5,'#06101F');g.addColorStop(1,C.bg);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);godRays(t,beams);motes(t,.7)}

// recortes: se gradúan una vez (fríos, alto contraste) con luz principal arriba a la izquierda y rim light cian en el borde derecho
const CUT={};
function edgeLight(o,w,h,dx,dy,col,a,bl){const[m,mc]=mkCanvas(w,h);mc.drawImage(o,0,0);mc.globalCompositeOperation='source-in';mc.fillStyle=col;mc.fillRect(0,0,w,h);

 const c=o.getContext('2d'),[keep,kc]=mkCanvas(w,h);kc.drawImage(o,0,0);
 c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.filter=`blur(${bl}px)`;c.drawImage(m,0,0);c.restore();
 c.save();c.globalCompositeOperation='destination-in';c.drawImage(keep,0,0);c.restore()}
function buildCut(name){const im=IMG[name],ok=loaded(im),w=ok?im.naturalWidth:800,h=ok?im.naturalHeight:Math.round(800*RECORTES[name]);
 const[o,c]=mkCanvas(w,h);
 if(ok){c.filter=GRADE;c.drawImage(im,0,0);c.filter='none';grade(c,w,h,.7,.2);
  const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(235,245,255,.14)');g.addColorStop(.45,'rgba(235,245,255,0)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.28)');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.globalCompositeOperation='destination-in';c.drawImage(im,0,0);c.globalCompositeOperation='source-over';
  const d=Math.max(4,Math.round(w*.011));edgeLight(o,w,h,d,0,C.cyan,.95,Math.max(2,Math.round(d*.35)));edgeLight(o,w,h,-Math.round(d*.6),-Math.round(d*.6),'#e0f2fe',.3,2)}
 else placeholder(c,w,h,name,'.png');
 const[s,sc]=mkCanvas(w,h);sc.filter=`blur(${Math.round(w*.018)}px)`;sc.drawImage(o,0,0);sc.filter='none';sc.globalCompositeOperation='source-in';sc.fillStyle='#000';sc.fillRect(0,0,w,h);
 CUT[name]={img:o,sil:s,w,h}}
function drawCut(name,P){const cu=CUT[name];if(!cu)return;const w=P.w,s=w/cu.w,h=cu.h*s;
 ctx.save();ctx.globalAlpha*=P.alpha??1;ctx.translate(P.x,P.y);
 if(P.contact){ctx.save();ctx.translate(w*.04,h*.5+P.contact);ctx.scale(1,.14);const g=ctx.createRadialGradient(0,0,0,0,0,w*.5);g.addColorStop(0,'rgba(0,0,0,.65)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w*.5,0,TAU);ctx.fill();ctx.restore()}
 ctx.rotate(P.rot||0);
 if((P.shadow??1)>0){ctx.save();ctx.globalAlpha*=.55*(P.shadow??1);ctx.drawImage(cu.sil,-w/2+w*.05,-h/2+h*.07,w,h);ctx.restore()}
 ctx.drawImage(cu.img,-w/2,-h/2,w,h);ctx.restore()}
